<style>
/* ===== Blank Page: mobile-first styles ===== */
:root {
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface-2: #efece4;
  --ink: #1c1b17;
  --muted: #69655b;
  --line: #e0dbcf;
  --accent: #1f6b58;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --ok: #1d7a3e;
  --ok-soft: #e1f2e6;
  --bad: #b3261e;
  --bad-soft: #f8e3e1;
  --warn: #8a5200;
  --warn-soft: #f8ecd9;
  --code-bg: #f0ede5;
  --code-ink: #24221d;
  --focus: #2f7dd1;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --code-size: 16px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111311; --surface: #1a1d1a; --surface-2: #232723; --ink: #e9e7e0; --muted: #a39f95;
    --line: #2e332e; --accent: #62c8a8; --accent-ink: #0b1a14; --accent-soft: #17332a;
    --ok: #6fd08f; --ok-soft: #15301e; --bad: #ff8a80; --bad-soft: #3a1a18; --warn: #f0b45c; --warn-soft: #33270f;
    --code-bg: #0c0e0c; --code-ink: #e2e0d8; --focus: #7ab4ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111311; --surface: #1a1d1a; --surface-2: #232723; --ink: #e9e7e0; --muted: #a39f95;
  --line: #2e332e; --accent: #62c8a8; --accent-ink: #0b1a14; --accent-soft: #17332a;
  --ok: #6fd08f; --ok-soft: #15301e; --bad: #ff8a80; --bad-soft: #3a1a18; --warn: #f0b45c; --warn-soft: #33270f;
  --code-bg: #0c0e0c; --code-ink: #e2e0d8; --focus: #7ab4ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font);
  min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ----- App frame ----- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: calc(var(--sat) + 6px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
}
.topbar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.topbar .brand { font-weight: 750; }
.topbar .brand span { color: var(--accent); }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; padding: 0 8px;
}
.icon-btn:active { background: var(--surface-2); }
.py-pill {
  font-size: 13px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: var(--surface);
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; cursor: pointer;
}
.py-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.py-pill.ready .dot { background: var(--ok); }
.py-pill.loading .dot { background: var(--warn); animation: pulse 1s infinite alternate; }
.py-pill.failed .dot { background: var(--bad); }
@keyframes pulse { to { opacity: .3; } }

main {
  max-width: 760px; margin: 0 auto;
  padding: 12px calc(var(--sar) + 16px) calc(var(--sab) + 96px) calc(var(--sal) + 16px);
}
body.playing main { padding-bottom: calc(var(--sab) + 120px); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--line); display: flex; justify-content: space-around;
  padding: 4px calc(var(--sar) + 4px) calc(var(--sab) + 4px) calc(var(--sal) + 4px);
}
.tabbar a {
  flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-decoration: none; color: var(--muted); font-size: 12px; gap: 2px; border-radius: 12px;
}
.tabbar a .ico { font-size: 20px; line-height: 1; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 650; }
body.playing .tabbar { display: none; }

/* ----- Generic blocks ----- */
h2 { font-size: 22px; margin: 18px 0 8px; letter-spacing: -0.015em; }
h3 { font-size: 18px; margin: 14px 0 6px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 12px 0;
}
.card.accent { border-color: var(--accent); background: var(--accent-soft); }
.card.warn { border-color: var(--warn); background: var(--warn-soft); }
.card.bad { border-color: var(--bad); background: var(--bad-soft); }
.card.ok { border-color: var(--ok); background: var(--ok-soft); }
.card h3:first-child, .card h2:first-child { margin-top: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
.stack > * + * { margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

.btn {
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; color: var(--ink); touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }

.prose code, .inline-code {
  font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 6px;
  overflow-wrap: anywhere;
}
.prose ul, .prose ol { padding-left: 22px; margin: 8px 0; }
.prose li { margin: 4px 0; }
pre.code-block, .code-view {
  font-family: var(--mono); font-size: 14.5px; line-height: 1.5; background: var(--code-bg); color: var(--code-ink);
  border-radius: 12px; padding: 10px 12px; overflow-x: auto; margin: 10px 0; white-space: pre; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
}
pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ----- Progress bars ----- */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stage-dots { display: inline-flex; gap: 4px; }
.stage-dots i { width: 14px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.stage-dots i.on { background: var(--accent); border-color: var(--accent); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.stat .num { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; }
.stat .lbl { font-size: 13px; color: var(--muted); }

/* ----- Lists ----- */
.list { list-style: none; padding: 0; margin: 8px 0; }
.list li { border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .item-link {
  display: flex; gap: 10px; align-items: center; padding: 10px 2px; min-height: 52px; width: 100%;
  background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); text-decoration: none;
}
.list .item-link .st { width: 26px; text-align: center; flex: none; font-size: 16px; }
.list .item-link .ttl { flex: 1; min-width: 0; }
.list .item-link .ttl small { display: block; color: var(--muted); font-size: 13px; }
.list .item-link[aria-disabled="true"] { opacity: .55; }

/* ----- Player ----- */
.player-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 6px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.timer.over { background: var(--bad-soft); color: var(--bad); }
.footer-actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px calc(var(--sar) + 12px) calc(var(--sab) + 8px) calc(var(--sal) + 12px);
  display: flex; gap: 8px; justify-content: flex-end; align-items: center;
}
.footer-actions .grow { flex: 1; }
.footer-actions .btn { flex: 0 1 auto; }
.choice { width: 100%; text-align: left; justify-content: flex-start; margin: 6px 0; padding: 10px 12px; }
.choice pre { margin: 0; font-family: var(--mono); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }

textarea.plain, input.plain {
  width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); resize: vertical;
}
textarea.plain.mono { font-family: var(--mono); font-size: var(--code-size); }
label.field { display: block; font-weight: 650; margin: 12px 0 4px; }
label.field small { font-weight: 400; color: var(--muted); }

/* ----- Code editor ----- */
.editor {
  display: flex; border: 1px solid var(--line); border-radius: 12px; background: var(--code-bg); overflow: hidden;
  font-family: var(--mono); font-size: var(--code-size); line-height: 1.5;
}
.editor:focus-within { border-color: var(--accent); }
.editor .gutter {
  flex: none; padding: 10px 6px 10px 8px; text-align: right; color: var(--muted); user-select: none; -webkit-user-select: none;
  white-space: pre; border-right: 1px solid var(--line); min-width: 2.6em; font-size: calc(var(--code-size) - 2px);
  line-height: calc(var(--code-size) * 1.5); opacity: .8;
}
.editor textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--code-ink); resize: none;
  font: inherit; font-size: var(--code-size); line-height: calc(var(--code-size) * 1.5); padding: 10px; white-space: pre;
  overflow-x: auto; overflow-y: hidden; tab-size: 4; -moz-tab-size: 4; min-height: 8em; -webkit-overflow-scrolling: touch;
}
.editor.readonly textarea { min-height: 0; }

/* ----- Quick-insert bar (pinned above the keyboard) ----- */
.keybar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface-2); border-top: 1px solid var(--line);
  display: flex; align-items: stretch; padding: 4px calc(var(--sar) + 4px) calc(var(--sab) + 4px) calc(var(--sal) + 4px); gap: 4px;
  will-change: transform;
}
.keybar.kb-open { padding-bottom: 4px; }
.keybar .keys { display: flex; gap: 4px; overflow-x: auto; flex: 1; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.keybar .keys::-webkit-scrollbar { display: none; }
.keybar button {
  min-width: 42px; min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--mono); font-size: 18px; flex: none; cursor: pointer; padding: 0 6px; touch-action: manipulation;
}
.keybar button.act { font-family: var(--font); font-size: 15px; font-weight: 650; padding: 0 12px; }
.keybar button.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ----- Results ----- */
.results { margin: 12px 0; }
.result-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--surface); }
.result-row.pass { border-left: 5px solid var(--ok); }
.result-row.fail { border-left: 5px solid var(--bad); }
.result-row .rt { font-weight: 650; }
.result-row .kv { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 4px; }
.result-row .kv b { font-family: var(--font); font-weight: 600; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.summary { font-weight: 700; font-size: 18px; }
.summary.pass { color: var(--ok); }
.summary.fail { color: var(--bad); }
.out { font-family: var(--mono); font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code-bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); margin: 8px 0; max-height: 50vh; overflow-y: auto; }
.err-card { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 12px; padding: 12px; margin: 10px 0; }
.err-card .et { font-weight: 750; color: var(--bad); }
.err-card details { margin-top: 8px; }
.err-card summary { cursor: pointer; min-height: 32px; font-weight: 600; }

/* ----- Tests table ----- */
.tests { margin: 10px 0; }
.tests .t { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.tests .t .lbl { font-family: var(--font); font-size: 13px; color: var(--muted); display: block; }

/* ----- Spot the bug lines ----- */
.lines { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--code-bg); margin: 10px 0; }
.lines button {
  display: flex; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  text-align: left; padding: 0; min-height: 40px; align-items: stretch; cursor: pointer; font-family: var(--mono); font-size: 14.5px; color: var(--code-ink);
}
.lines button .n { width: 2.6em; flex: none; text-align: right; padding: 9px 8px 9px 4px; color: var(--muted); border-right: 1px solid var(--line); }
.lines button .c { padding: 9px 10px; white-space: pre; overflow-x: auto; flex: 1; }
.lines button.picked-ok { background: var(--ok-soft); }
.lines button.picked-bad { background: var(--bad-soft); }

/* ----- Parsons ----- */
.parsons-zone { border: 2px dashed var(--line); border-radius: 12px; padding: 6px; min-height: 64px; margin: 8px 0; background: var(--surface); }
.parsons-zone.answer { border-color: var(--accent); }
.pline {
  display: block; width: 100%; text-align: left; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  border: 1px solid var(--line); background: var(--code-bg); color: var(--code-ink); border-radius: 9px; padding: 9px 10px; margin: 5px 0; min-height: 44px; cursor: pointer;
}
.pline.prose-line { font-family: var(--font); white-space: normal; }
.pline .idx { color: var(--muted); margin-right: 8px; font-family: var(--font); font-size: 12px; }

/* ----- Fill in blanks ----- */
.fill { font-family: var(--mono); font-size: 14.5px; white-space: pre; overflow-x: auto; background: var(--code-bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); line-height: 2.3; }
.fill input {
  font-family: var(--mono); font-size: 16px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface);
  padding: 2px 4px; min-width: 3ch; color: var(--ink);
}

/* ----- Hints ----- */
.hint { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; }
.hint pre { font-family: var(--mono); font-size: 14px; white-space: pre-wrap; margin: 4px 0 0; }
.hint .ht { font-weight: 700; font-size: 13px; color: var(--warn); text-transform: uppercase; letter-spacing: .04em; }

/* ----- Flashcard ----- */
.flash { min-height: 160px; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 19px; }
.flash .back { font-family: var(--mono); font-size: 15.5px; text-align: left; white-space: pre-wrap; margin-top: 10px; }

/* ----- Rubric self-rate ----- */
.rate { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.rate button { flex: 1; min-width: 72px; }
.rate button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 84px); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: 90vw;
  box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 720px) {
  body { font-size: 17px; }
  .grid-wide { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ----- v2: Today session cards, modal, checklist ----- */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 .stat .num { font-size: 22px; }
.session-cards { display: grid; gap: 10px; margin: 10px 0; }
@media (min-width: 640px) { .session-cards { grid-template-columns: 1fr 1fr; } }
.session-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; width: 100%;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer; min-height: 96px;
  color: var(--ink); touch-action: manipulation;
}
.session-card.commute { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.session-card:disabled { opacity: .55; cursor: not-allowed; }
.session-card:active:not(:disabled) { transform: translateY(1px); }
.sc-kicker { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; opacity: .85; }
.sc-title { font-size: 21px; font-weight: 750; letter-spacing: -0.01em; }
.sc-meta { font-size: 14px; opacity: .85; }
.challenge-link { padding: 12px 14px; }
.modal-wrap {
  position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center;
  padding: 12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
}
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 16px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin-top: 0; }

.check-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; min-height: 44px; cursor: pointer; }

<script type="application/json" id="bp-content">{"schemaVersion":1,"meta":{"title":"Blank Page","subtitle":"From reading Python to writing it","contentVersion":"2.0.0","pyodideVersion":"314.0.7","pythonInBrowser":"3.14","syntaxTarget":"3.12","pandasVersion":"3.0.2","numpyVersion":"2.4.6"},"skills":[{"id":"planning","name":"Planning","description":"Turn a vague brief into inputs, outputs, steps and signatures."},{"id":"decomposition","name":"Decomposition","description":"Split a problem into small functions; simplest working version first."},{"id":"recall","name":"Recall","description":"Write common patterns from memory."},{"id":"debugging","name":"Debugging","description":"Read tracebacks, find and fix bugs."},{"id":"structuring","name":"Structuring","description":"main(), modules, tests: whole programs."}],"concepts":[{"id":"plan","name":"Plan before code","skill":"planning"},{"id":"dicts","name":"Dicts as portfolios","skill":"recall"},{"id":"guards","name":"Guard rails and errors","skill":"decomposition"},{"id":"tracebacks","name":"Reading tracebacks","skill":"debugging"},{"id":"compounding","name":"Multi-period returns","skill":"decomposition"},{"id":"structure","name":"Programs: main() and tests","skill":"structuring"},{"id":"m2dc","name":"Records with dataclasses","skill":"structuring"},{"id":"m2comp","name":"Comprehensions and sorting","skill":"recall"},{"id":"m2rebal","name":"Trade-list logic","skill":"decomposition"},{"id":"m3pd","name":"pandas basics","skill":"recall"},{"id":"m3clean","name":"Cleaning price data","skill":"decomposition"},{"id":"m3ret","name":"Returns with pandas","skill":"recall"},{"id":"m4vol","name":"Volatility and correlation","skill":"recall"},{"id":"m4dd","name":"Drawdowns","skill":"decomposition"},{"id":"m4var","name":"VaR and expected shortfall","skill":"decomposition"},{"id":"m5sig","name":"Signals without look-ahead","skill":"decomposition"},{"id":"m5cost","name":"Turnover and costs","skill":"recall"},{"id":"m6fmt","name":"Formatting numbers and tables","skill":"recall"},{"id":"m6rep","name":"Report structure","skill":"structuring"},{"id":"m7io","name":"Files: pathlib and csv","skill":"recall"},{"id":"m7cli","name":"Command-line programs","skill":"structuring"}],"modules":[{"id":"m1","title":"Module 1: From brief to working function","project":"Portfolio return calculator","packages":[],"objectives":["Plan before coding","Write dict-based portfolio functions","Validate inputs","Debug from tracebacks and failing tests","Compound returns","Structure a small program"],"lessons":["m1l1","m1l2","m1l3","m1l4","m1l5","m1l6"]},{"id":"m2","title":"Module 2: Weights and rebalancing","project":"Rebalancing trade list","objectives":["Model positions with dataclasses","Write comprehensions and sorts from memory","Turn holdings into weights, trades and whole-lot orders"],"packages":[],"lessons":["m2l1","m2l2","m2l3"]},{"id":"m3","title":"Module 3: Clean and analyse a price series","project":"Price-series cleaner","objectives":["Select data with loc and iloc","Clean raw prices: dates, duplicates, gaps","Compute daily, monthly and calendar returns"],"packages":["pandas"],"lessons":["m3l1","m3l2","m3l3"]},{"id":"m4","title":"Module 4: Risk metrics","project":"Risk report numbers","objectives":["Annualise volatility and read correlations","Compute portfolio volatility and risk contributions","Build drawdown series","Compute historical and parametric VaR and expected shortfall, stating the conventions"],"packages":["pandas"],"lessons":["m4l1","m4l2","m4l3"]},{"id":"m5","title":"Module 5: Backtest with costs","project":"Momentum backtest","objectives":["Turn signals into weights without look-ahead","Measure turnover and charge costs","Assemble a full backtest from small functions"],"packages":["pandas"],"lessons":["m5l1","m5l2"]},{"id":"m6","title":"Module 6: Reporting","project":"Monthly report generator","objectives":["Format numbers exactly with the format mini-language","Build text and Markdown tables","Separate calculation from presentation"],"packages":[],"lessons":["m6l1","m6l2"]},{"id":"m7","title":"Module 7: A command-line tool with tests","project":"Risk CLI","objectives":["Read and write files with pathlib and csv","Build a CLI with argparse and exit codes","Structure a project with uv, pytest and ruff"],"packages":[],"lessons":["m7l1","m7l2"]}],"lessons":[{"id":"m1l1","module":"m1","title":"Plan before you code","skill":"planning","device":"phone","estMinutes":20,"objectives":["Write inputs, outputs, steps and signatures before any code","Turn a one-line brief into testable decisions"],"steps":[{"kind":"item","ref":"l1-order-plan"},{"kind":"explain","md":"You can read code. The gap is starting. A plan closes it: four short sections you write before any code.\n\n- **Inputs**: names, types, units. Decimals or percentages? Which dict maps what to what?\n- **Outputs**: one type, stated.\n- **Steps**: plain English, one line each. Each step tends to become a line, a loop or a function.\n- **Signatures**: `def name(arg: type) -> type`. The app checks they're valid Python and turns them into your starter code.\n\nPitfall: skipping the edge cases (\"what if it's empty?\") in the plan. They reappear as bugs."},{"kind":"item","ref":"l1-worked-plan"},{"kind":"item","ref":"fc-plan-four"},{"kind":"item","ref":"l1-plan-drift"},{"kind":"item","ref":"l1-plan-fx"},{"kind":"item","ref":"l1-plan-best"},{"kind":"item","ref":"l1-plan-contrib"}]},{"id":"m1l2","module":"m1","title":"Dicts as portfolios","skill":"recall","device":"phone","estMinutes":25,"objectives":["Loop over dicts with .items()","Accumulate totals with .get()","Sort and slice dict items"],"steps":[{"kind":"item","ref":"pr-dict-iter"},{"kind":"explain","md":"A portfolio is a dict: ticker → weight. Three patterns cover most of what you'll do with it:\n\n- `for ticker, w in weights.items():` to walk holdings.\n- `totals[k] = totals.get(k, 0.0) + x` to accumulate (groupby by hand).\n- `sorted(d.items(), key=lambda kv: kv[1], reverse=True)` to rank.\n\nPitfall: `.get(k, 0.0)` is right when missing means zero (an unheld weight) and wrong when missing means bad data (a missing return)."},{"kind":"item","ref":"w-dicts"},{"kind":"item","ref":"fb-dicts"},{"kind":"item","ref":"ps-active"},{"kind":"item","ref":"fc-get"},{"kind":"item","ref":"cd-asset-class"},{"kind":"item","ref":"pr-get-accum"},{"kind":"item","ref":"cd-top-n"},{"kind":"item","ref":"cd-trades"},{"kind":"item","ref":"pr-items-pairs"},{"kind":"item","ref":"pr-sum-values"},{"kind":"item","ref":"fc-sort-desc"}]},{"id":"m1l3","module":"m1","title":"Guard rails","skill":"decomposition","device":"phone","estMinutes":25,"objectives":["Validate inputs before computing","Raise ValueError with useful messages","Compare floats safely"],"steps":[{"kind":"item","ref":"pr-float-eq"},{"kind":"explain","md":"Decide what bad input looks like, check for it first, and raise a `ValueError` whose message tells the reader what to fix. Then compute.\n\n- Float equality: `math.isclose(a, b, abs_tol=...)`, never `==`.\n- Collect all problems (e.g. every missing ticker) before raising, so one run tells the whole story.\n- Turn low-level errors into domain ones: `except ValueError: raise ValueError(f\"line {n}: ...\") from None`.\n\nPitfall: returning `None` or `False` on bad input. Callers forget to check; exceptions can't be ignored."},{"kind":"item","ref":"w-guards"},{"kind":"item","ref":"sb-float-eq"},{"kind":"item","ref":"fc-isclose"},{"kind":"item","ref":"cd-safe-return"},{"kind":"item","ref":"pr-except"},{"kind":"item","ref":"cd-parse-pct"},{"kind":"item","ref":"cd-load-weights"},{"kind":"item","ref":"pr-isclose-zero"},{"kind":"item","ref":"fc-raise-from"},{"kind":"item","ref":"sb-double-pct"}]},{"id":"m1l4","module":"m1","title":"Read the traceback","skill":"debugging","device":"phone","estMinutes":25,"objectives":["Read a traceback bottom-up","Locate the failing line in your own code","Fix quiet bugs found by tests"],"steps":[{"kind":"item","ref":"pr-unpack"},{"kind":"explain","md":"A traceback is a stack of calls, oldest at the top. Read it **bottom-up**:\n\n1. Last line: error type and message. That's *what* went wrong.\n2. The last frame in *your* file: *where* it blew up.\n3. Ask: is that line the bug, or did bad data arrive from further up?\n\nQuiet bugs (wrong answer, no crash) are found by tests and by printing intermediate values. Under every error the app gives a plain-English translation; read the real traceback first, then check yourself against it."},{"kind":"item","ref":"w-traceback"},{"kind":"item","ref":"sb-str-returns"},{"kind":"item","ref":"fc-tb-read"},{"kind":"item","ref":"sb-avg"},{"kind":"item","ref":"pr-mutable-default"},{"kind":"item","ref":"sb-mutable"},{"kind":"item","ref":"sb-summary"},{"kind":"item","ref":"pr-index-error"},{"kind":"item","ref":"pr-fstring-eq"},{"kind":"item","ref":"fc-debug-print"},{"kind":"item","ref":"pr-none-return"}]},{"id":"m1l5","module":"m1","title":"Multi-period returns","skill":"decomposition","device":"either","estMinutes":25,"objectives":["Compound period returns","Build a growth path and a drawdown","Annualise, and know the conventions"],"steps":[{"kind":"item","ref":"pr-compound"},{"kind":"explain","md":"Simple returns compound: cumulative = Π(1 + rᵢ) − 1. Most path-dependent maths (growth of £1, drawdowns, cash balances) is a loop with a **running value** and something you update each step.\n\nConventions to state, not assume: periods per year (12, 52, ~252), sample vs population standard deviation, and whether you annualise at all (GIPS doesn't allow it under a year)."},{"kind":"item","ref":"w-compound"},{"kind":"item","ref":"fb-compound"},{"kind":"item","ref":"fc-compound"},{"kind":"item","ref":"cd-growth"},{"kind":"item","ref":"pr-fstring-pct"},{"kind":"item","ref":"cd-max-dd"},{"kind":"item","ref":"cd-ann-stats"},{"kind":"item","ref":"pr-monthly-annual"},{"kind":"item","ref":"fc-ann-vol"},{"kind":"item","ref":"pr-range-skip"}]},{"id":"m1l6","module":"m1","title":"From functions to a program","skill":"structuring","device":"either","estMinutes":40,"objectives":["Separate calculation from printing","Use main() and the __name__ guard","Write tests that catch real bugs"],"steps":[{"kind":"item","ref":"pr-name-main"},{"kind":"explain","md":"A program is small pure functions (inputs in, value out) plus one `main()` that wires them together and does the printing. The guard `if __name__ == \"__main__\": main()` means running the file does the work, importing it (from tests) doesn't.\n\nOn your laptop the same shape becomes: `uv init`, `src/` with your module, `tests/test_*.py` run by `pytest`, and `ruff check` for lint. The final task here exports a brief you can build there."},{"kind":"item","ref":"w-program"},{"kind":"item","ref":"ps-program"},{"kind":"item","ref":"fc-main-guard"},{"kind":"item","ref":"cd-main-report"},{"kind":"item","ref":"cd-write-tests"},{"kind":"item","ref":"cd-program"},{"kind":"item","ref":"fc-uv-pytest"},{"kind":"item","ref":"fc-ruff"},{"kind":"item","ref":"pr-import-runs"}]},{"id":"m2l1","module":"m2","title":"Records with dataclasses","skill":"structuring","device":"phone","estMinutes":25,"objectives":["Define dataclasses with defaults and properties","Use frozen records safely","Convert raw rows into typed records"],"steps":[{"kind":"item","ref":"pr-dc-repr"},{"kind":"explain","md":"A dataclass is a class whose job is to hold data. `@dataclass` writes `__init__`, `__repr__` and `__eq__` from the annotated fields.\n\n- `frozen=True`: immutable, hashable. Use it for positions, trades and anything you pass around.\n- Derived numbers (market value) go in `@property`, so they can't go stale.\n- Mutable defaults need `field(default_factory=list)`.\n\nPitfall: type hints aren't enforced. `units=\"100\"` is accepted and breaks later; convert at the boundary."},{"kind":"item","ref":"w-dataclass"},{"kind":"item","ref":"fc-dc-factory"},{"kind":"item","ref":"fb-dc"},{"kind":"item","ref":"pr-dc-eq"},{"kind":"item","ref":"cd-positions-from"},{"kind":"item","ref":"cd-dc-weight"},{"kind":"item","ref":"cd-bond-blank"}]},{"id":"m2l2","module":"m2","title":"Comprehensions and sorting","skill":"recall","device":"phone","estMinutes":25,"objectives":["Write list, dict, set and generator comprehensions","Sort with key functions and tuple keys","Group items into buckets"],"steps":[{"kind":"item","ref":"pr-dict-comp"},{"kind":"explain","md":"Comprehensions turn 'loop, test, append' into one readable line. Use them when the body is a single expression; switch back to a loop when you need several steps or error handling.\n\n`sorted(items, key=…, reverse=…)` covers almost every ranking. Tuple keys sort by several things at once: `key=lambda x: (-x[1], x[0])`.\n\nPitfall: a comprehension that needs a comment to be understood should be a loop."},{"kind":"item","ref":"w-comp"},{"kind":"item","ref":"fc-dictcomp"},{"kind":"item","ref":"ps-zip"},{"kind":"item","ref":"fb-comp"},{"kind":"item","ref":"pr-sorted-key"},{"kind":"item","ref":"cd-bucket"},{"kind":"item","ref":"cd-top-contrib"},{"kind":"item","ref":"cd-rank-blank"}]},{"id":"m2l3","module":"m2","title":"Building the trade list","skill":"decomposition","device":"either","estMinutes":35,"objectives":["Turn values into weights","Compute trades with a clear sign convention","Round to lots without overshooting"],"steps":[{"kind":"item","ref":"pr-round-bankers"},{"kind":"explain","md":"A rebalancer is a chain of small, testable steps:\n\n1. Values → NAV (cash included).\n2. Target weight × NAV → target value or units.\n3. Target − current → trade (positive = buy).\n4. Round to tradable lots, toward zero.\n5. Drop dust; check the trades net to zero against cash.\n\nEach step becomes one function or one line. Write the sign convention in the docstring."},{"kind":"item","ref":"w-weights"},{"kind":"item","ref":"sb-rebal-sign"},{"kind":"item","ref":"fc-trunc"},{"kind":"item","ref":"cd-trade-list"},{"kind":"item","ref":"pr-trade-net"},{"kind":"item","ref":"cd-lots"},{"kind":"item","ref":"cd-rebal-blank"}]},{"id":"m3l1","module":"m3","title":"pandas basics","skill":"recall","device":"phone","estMinutes":25,"objectives":["Select with .loc and .iloc","Know how pandas treats missing values","Summarise a price table"],"steps":[{"kind":"item","ref":"pr-pd-loc"},{"kind":"explain","md":"Two objects do most of the work: a **Series** (one column with an index) and a **DataFrame** (columns sharing an index). For prices, the index is dates.\n\n- `.loc[label]` by label, `.iloc[pos]` by position; `df[col]` for a column.\n- Arithmetic aligns on labels, so `prices.iloc[-1] / prices.iloc[0] - 1` works for every column at once.\n- pandas 3 is copy-on-write: chained assignment (`df[col][i] = x`) does nothing. Use `df.loc[i, col] = x`.\n\nRuns here use pandas 3.0.2; the first pandas exercise takes 20–40 s to load it."},{"kind":"item","ref":"w-pd"},{"kind":"item","ref":"fc-loc-iloc"},{"kind":"item","ref":"pr-chained"},{"kind":"item","ref":"fb-pd"},{"kind":"item","ref":"cd-snapshot"},{"kind":"item","ref":"pr-pd-mean"},{"kind":"item","ref":"cd-total-ret"},{"kind":"item","ref":"cd-summary-blank"}]},{"id":"m3l2","module":"m3","title":"Cleaning price data","skill":"decomposition","device":"either","estMinutes":30,"objectives":["Parse dates and de-duplicate corrections","Reshape long data to wide","Fill gaps carefully and spot bad prints"],"steps":[{"kind":"item","ref":"pr-pct-nan"},{"kind":"explain","md":"Real price files are long (date, ticker, price), unsorted, sometimes text, with resends and gaps. A cleaning function is a short, fixed pipeline:\n\n1. Parse types: `pd.to_datetime`, `pd.to_numeric`.\n2. De-duplicate (`keep=\"last\"` for corrections).\n3. Reshape: `pivot(index=\"date\", columns=\"ticker\", values=\"price\")`.\n4. Sort, then fill small gaps: `ffill(limit=…)`.\n5. Flag what's still suspicious rather than silently 'fixing' it.\n\nWrite those steps as the docstring first. That's the plan."},{"kind":"item","ref":"w-clean"},{"kind":"item","ref":"fc-ffill"},{"kind":"item","ref":"sb-dup-first"},{"kind":"item","ref":"ps-clean"},{"kind":"item","ref":"cd-clean"},{"kind":"item","ref":"pr-dropna-index"},{"kind":"item","ref":"cd-jumps"},{"kind":"item","ref":"cd-clean-blank"}]},{"id":"m3l3","module":"m3","title":"Returns with pandas","skill":"recall","device":"either","estMinutes":25,"objectives":["Resample to month ends","Compound with cumprod","Compute YTD and calendar-year returns"],"steps":[{"kind":"item","ref":"pr-resample"},{"kind":"explain","md":"The return toolkit is small:\n\n- `prices.pct_change()` for period returns.\n- `prices.resample(\"ME\").last()` for month-end prices (`\"QE\"`, `\"YE\"` for quarters and years).\n- `(1 + r).cumprod()` for the growth path.\n- `.loc[:date].iloc[-1]` for 'as of' a date.\n\nPitfall: summing returns across periods. Compound them."},{"kind":"item","ref":"w-returns"},{"kind":"item","ref":"fc-me"},{"kind":"item","ref":"fb-ret"},{"kind":"item","ref":"cd-growth-index"},{"kind":"item","ref":"pr-cumprod"},{"kind":"item","ref":"cd-ytd"},{"kind":"item","ref":"cd-calendar-blank"}]},{"id":"m4l1","module":"m4","title":"Volatility and correlation","skill":"recall","device":"either","estMinutes":30,"objectives":["Annualise vol, knowing ddof and the √time assumption","Use numpy for w′Sw","Decompose risk by asset"],"steps":[{"kind":"item","ref":"pr-ddof"},{"kind":"explain","md":"Risk numbers are one-liners in numpy/pandas. The work is in the conventions:\n\n- Sample vs population std (`ddof=1` vs `ddof=0`): pandas and numpy disagree by default.\n- Annualise by √(periods per year): assumes independent returns.\n- Portfolio variance is `w @ S @ w`; never average the vols.\n- A correlation matrix has 1s on the diagonal: skip it when hunting pairs."},{"kind":"item","ref":"w-vol"},{"kind":"item","ref":"fc-port-vol"},{"kind":"item","ref":"fb-vol"},{"kind":"item","ref":"cd-port-vol"},{"kind":"item","ref":"pr-matmul"},{"kind":"item","ref":"cd-most-corr"},{"kind":"item","ref":"cd-risk-contrib-blank"}]},{"id":"m4l2","module":"m4","title":"Drawdowns","skill":"decomposition","device":"either","estMinutes":25,"objectives":["Build drawdown series from prices or returns","Measure time underwater","Find peak and trough dates"],"steps":[{"kind":"item","ref":"pr-cummax"},{"kind":"explain","md":"Drawdown = how far below the best level so far. From prices: `p / p.cummax() - 1`. From returns: build the wealth index with `cumprod()` first, and remember the implicit starting level of 1.0.\n\nMost drawdown questions decompose into: a series (vectorised), then a scan (often a short loop) for streaks or dates."},{"kind":"item","ref":"w-dd"},{"kind":"item","ref":"sb-dd-cummin"},{"kind":"item","ref":"fc-dd"},{"kind":"item","ref":"cd-dd-series"},{"kind":"item","ref":"cd-underwater"},{"kind":"item","ref":"cd-worst-dd-blank"}]},{"id":"m4l3","module":"m4","title":"VaR and expected shortfall","skill":"decomposition","device":"either","estMinutes":30,"objectives":["Compute historical and parametric VaR","Scale over horizons, knowing the assumption","Compute expected shortfall"],"steps":[{"kind":"item","ref":"pr-quantile"},{"kind":"explain","md":"VaR answers: 'what loss won't be exceeded with X% confidence over horizon h?' Every number needs four labels: confidence, horizon, method (historical or parametric) and sign convention.\n\n- Historical: `-r.quantile(1 - conf)`.\n- Parametric (normal): `-(μ + z·σ)` with `z = NormalDist().inv_cdf(1 - conf)`.\n- Expected shortfall: the average loss beyond the VaR point."},{"kind":"item","ref":"w-var"},{"kind":"item","ref":"fc-var"},{"kind":"item","ref":"fb-var"},{"kind":"item","ref":"cd-hist-var"},{"kind":"item","ref":"pr-sqrt-time"},{"kind":"item","ref":"cd-param-var-h"},{"kind":"item","ref":"cd-es-blank"}]},{"id":"m5l1","module":"m5","title":"Signals without look-ahead","skill":"decomposition","device":"either","estMinutes":30,"objectives":["Lag weights correctly","Build momentum signals","Turn ranks into weights"],"steps":[{"kind":"item","ref":"pr-shift"},{"kind":"explain","md":"A backtest asks: if I had followed this rule, what would I have earned? The rule may only use information available at the time.\n\n- Decide weights at the end of period t; they earn period t + 1: `weights.shift(1) * returns`.\n- Signals come from prices up to t: `prices / prices.shift(n) - 1`.\n- Ranks → weights with boolean masks, not loops.\n\nIf a backtest looks too good, look for a missing shift first."},{"kind":"item","ref":"w-lookahead"},{"kind":"item","ref":"fc-lookahead"},{"kind":"item","ref":"sb-lookahead"},{"kind":"item","ref":"cd-momentum"},{"kind":"item","ref":"pr-rank"},{"kind":"item","ref":"cd-topk"},{"kind":"item","ref":"cd-strategy-blank"}]},{"id":"m5l2","module":"m5","title":"Turnover and costs","skill":"recall","device":"either","estMinutes":35,"objectives":["Measure two-way turnover","Convert basis points and charge costs at the right time","Assemble a full backtest"],"steps":[{"kind":"item","ref":"pr-turnover"},{"kind":"explain","md":"Costs turn many good-looking strategies into bad ones.\n\n- Turnover = Σ|wₜ − wₜ₋₁|, starting from all cash.\n- Cost = turnover × bps / 10,000, charged when you trade.\n- Report gross and net, and average turnover.\n\nConventions to state: one-way vs two-way turnover, whether the initial build counts, cost per unit traded."},{"kind":"item","ref":"w-costs"},{"kind":"item","ref":"fc-bps"},{"kind":"item","ref":"fb-cost"},{"kind":"item","ref":"cd-turnover"},{"kind":"item","ref":"pr-cost-drag"},{"kind":"item","ref":"cd-net"},{"kind":"item","ref":"cd-backtest-blank"}]},{"id":"m6l1","module":"m6","title":"Formatting numbers and tables","skill":"recall","device":"phone","estMinutes":25,"objectives":["Use the format mini-language from memory","Build aligned text and Markdown tables","Know float rounding traps"],"steps":[{"kind":"item","ref":"pr-format-specs"},{"kind":"explain","md":"Every number in a report goes through a format spec: `f\"{value:[align][sign][width][,][.precision][type]}\"`.\n\n- `,.0f` money, `+.2%` returns, `>9` right-align, `<10` left-align.\n- Build tables as lists of lines and `\"\\n\".join(...)` once.\n- Return strings from formatting functions; print only in main().\n\nPitfall: `round()` and `:.2f` round the binary value, so 2.675 → 2.67. Use `decimal` for money that must round half-up."},{"kind":"item","ref":"w-format"},{"kind":"item","ref":"fc-format"},{"kind":"item","ref":"fb-format"},{"kind":"item","ref":"cd-stats-table"},{"kind":"item","ref":"pr-round-half"},{"kind":"item","ref":"cd-md-table"},{"kind":"item","ref":"cd-ticket-blank"}]},{"id":"m6l2","module":"m6","title":"Report structure","skill":"structuring","device":"either","estMinutes":35,"objectives":["Separate compute, render and I/O","Plan a real report","Turn limit checks into data"],"steps":[{"kind":"item","ref":"pr-join-lines"},{"kind":"explain","md":"A report program has three layers:\n\n1. **compute**: data in, numbers out (dicts, Series).\n2. **render**: numbers in, text out (no calculation).\n3. **main**: reads inputs, calls 1 and 2, writes the result.\n\nCharts belong to render; on your laptop use matplotlib and `savefig`. matplotlib isn't loaded in this app, so chart tasks are laptop-only."},{"kind":"item","ref":"w-report"},{"kind":"item","ref":"ps-report"},{"kind":"item","ref":"pl-report"},{"kind":"item","ref":"cd-breaches"},{"kind":"item","ref":"cd-report-blank"}]},{"id":"m7l1","module":"m7","title":"Files: pathlib and csv","skill":"recall","device":"phone","estMinutes":25,"objectives":["Build paths with pathlib","Read and write CSV safely","Combine many files"],"steps":[{"kind":"item","ref":"pr-pathlib"},{"kind":"explain","md":"File code is boundary code: text comes in, typed data leaves.\n\n- Paths: `Path(\"data\") / \"prices.csv\"`, `.exists()`, `.glob(\"*.csv\")`, `.read_text()`, `.write_text()`.\n- CSV: `csv.DictReader` / `csv.writer`, opened with `newline=\"\"` and an explicit `encoding`.\n- Convert every value as you read it; raise with the row or ticker in the message.\n\nIn this app files live in browser memory under /tmp and vanish on reload. The code is identical on your laptop."},{"kind":"item","ref":"w-io"},{"kind":"item","ref":"fc-with-open"},{"kind":"item","ref":"fb-io"},{"kind":"item","ref":"cd-load-csv"},{"kind":"item","ref":"pr-csv-strings"},{"kind":"item","ref":"cd-write-csv"},{"kind":"item","ref":"cd-io-blank"}]},{"id":"m7l2","module":"m7","title":"Command-line programs","skill":"structuring","device":"laptop","estMinutes":45,"objectives":["Write main(argv) with argparse","Use exit codes and stderr","Package with uv, pytest and ruff"],"steps":[{"kind":"item","ref":"pr-argparse"},{"kind":"explain","md":"A CLI is the same layered program with a parser on top:\n\n```\ndef main(argv: list[str] | None = None) -> int:\n    args = build_parser().parse_args(argv)\n    ...           # call pure functions\n    return 0\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\nOn the laptop: `uv init --package riskcli`, code in `src/riskcli/`, tests in `tests/`, `uv add --dev pytest ruff`, then `uv run pytest` and `uv run ruff check`. Add `[project.scripts]` to get a real command."},{"kind":"item","ref":"w-cli"},{"kind":"item","ref":"fc-scripts"},{"kind":"item","ref":"ps-cli"},{"kind":"item","ref":"cd-parse-pairs"},{"kind":"item","ref":"pr-argparse-exit"},{"kind":"item","ref":"cd-main-codes"},{"kind":"item","ref":"cd-cli-blank"}]}],"items":[{"id":"l1-order-plan","type":"parsons","concepts":["plan"],"stage":1,"device":"phone","gate":false,"title":"What comes first?","prompt":"Put the steps for starting any coding task in order. Tap lines to build the answer; tap again to send one back. One line is a decoy.","lines":["Decide the inputs, their types and units (decimals, not %)","Decide the output and its type","Write the steps in plain English","Write function signatures with type hints","Write the simplest version that passes one test","Add edge cases and input checks","Open a blank file and start typing"],"order":[0,1,2,3,4,5],"explanation":"Inputs and outputs first, because every later decision depends on them. Steps in English before signatures, because the steps tell you which functions you need. Then the simplest working version, and only then the edge cases. 'Just start typing' is how you end up asking an AI to rescue a half-written file.","hints":[]},{"id":"l1-worked-plan","type":"worked","concepts":["plan"],"stage":1,"device":"phone","title":"A worked plan","show":"**Brief:** given each holding's weight and its return for the month, work out the portfolio's return.\n\n**Inputs**\n- `weights`: dict ticker → weight as a decimal (0.35 means 35%). Should sum to 1.\n- `returns`: dict ticker → simple monthly return as a decimal (0.012 means 1.2%).\n\n**Output**\n- One float: the portfolio's simple return for the month, as a decimal.\n\n**Steps**\n1. Check every ticker in `weights` has a return; fail loudly if not.\n2. For each holding, multiply weight × return.\n3. Add up the products.\n4. Return the total.\n\n**Signature**\n```\ndef portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float\n```","explainPrompt":"Why pin down the units (decimals, not percentages) in the plan, before writing any code?","explanation":"Units are the classic silent bug in finance code. 1.2 and 0.012 both look like a return, nothing crashes if you mix them, and the answer is just 100× out. Fixing the unit up front means every function agrees on it, and a test can catch a mix-up.","financeNotes":["Σ weight × return is exact for simple returns over a single period with weights set at the start of the period. It does not hold for log returns."],"hints":[]},{"id":"fc-plan-four","type":"flashcard","concepts":["plan"],"stage":1,"device":"phone","front":"Before writing code for a brief, which four things do you write down?","back":"1. Inputs (types and units)\n2. Outputs (type)\n3. Steps in plain English\n4. Function signatures with type hints","hints":[]},{"id":"l1-plan-drift","type":"plan","concepts":["plan"],"stage":2,"device":"phone","title":"Complete the plan: drift check","brief":"Each morning, flag every asset whose current weight has drifted from its target by more than a tolerance (default 2 percentage points). Part of the plan is filled in: finish the steps and write the signature.","prefill":{"inputs":"current: dict ticker -> current weight (decimal)\ntarget: dict ticker -> target weight (decimal)\ntolerance: float, default 0.02","outputs":"list of tickers that breach, sorted alphabetically","steps":"1. Take every ticker that appears in either dict (missing = 0 weight)\n2. \n3. \n4. ","signatures":""},"rubric":[{"id":"union","text":"Covers tickers that are in only one of the two dicts","any":["either","union","only one","missing","0 weight","zero",".get"]},{"id":"abs","text":"Uses the absolute difference |current − target|","any":["abs","absolute","|"]},{"id":"cmp","text":"Compares the difference with the tolerance","any":["tolerance",">","greater","exceed","more than"]},{"id":"sig","text":"Signature gives tolerance a default of 0.02","any":["= 0.02","=0.02"]}],"modelPlan":{"inputs":"current: dict ticker -> weight (decimal)\ntarget: dict ticker -> weight (decimal)\ntolerance: float = 0.02","outputs":"list[str]: breaching tickers, sorted","steps":"1. Take every ticker in either dict; a missing weight counts as 0.\n2. For each ticker work out abs(current - target).\n3. Keep the ticker if that difference is greater than tolerance.\n4. Return the kept tickers, sorted.","signatures":"def drift_breaches(current: dict[str, float], target: dict[str, float], tolerance: float = 0.02) -> list[str]"},"hints":["What should happen to an asset you've fully sold that still has a target weight?","Loop over the union of both dicts' keys, use .get(ticker, 0.0) for the missing side, and compare abs(diff) with tolerance.","Steps: 1 union of keys · 2 diff = abs(current.get(t, 0) - target.get(t, 0)) · 3 keep if diff > tolerance · 4 return sorted(...)\nSignature: def drift_breaches(current: ..., target: ..., tolerance: float = ...) -> list[str]"],"explanation":"Drift is two-sided: overweight and underweight both breach, so you need abs(). An asset can exist in only one dict (a new target, a fully sold holding), so you need the union of keys with 0 for the missing side. Sorting the output makes it predictable, and predictable is testable."},{"id":"l1-plan-fx","type":"plan","concepts":["plan"],"stage":3,"device":"phone","title":"Plan: local returns to GBP","brief":"A GBP-based fund holds US and euro-area assets, unhedged. Given each asset's local-currency return and each currency's return against GBP, compute every asset's return in GBP:\n\n(1 + r_GBP) = (1 + r_local) × (1 + r_FX)\n\nWhich currency each asset is in comes from a separate dict. Write the plan.","rubric":[{"id":"map","text":"Includes the asset → currency mapping as an input","any":["currency","ccy"]},{"id":"formula","text":"Compounds the two returns rather than adding them","any":["(1 +","(1+","compound","multipl","×","*"]},{"id":"edge","text":"Handles GBP assets (no FX effect) or a missing currency","any":["gbp","missing","raise","error","zero","0.0"]},{"id":"out","text":"Output is a dict asset → GBP return","any":["dict"]}],"modelPlan":{"inputs":"local_returns: dict asset -> return in its own currency (decimal)\nfx_returns: dict currency -> return of that currency vs GBP (decimal; USD +1% vs GBP = 0.01)\nasset_ccy: dict asset -> currency code","outputs":"dict asset -> return in GBP (decimal)","steps":"1. For each asset, look up its currency.\n2. GBP assets have an FX return of 0.\n3. If a currency is missing from fx_returns, raise ValueError naming it.\n4. gbp = (1 + local) * (1 + fx) - 1\n5. Return the dict.","signatures":"def to_gbp_returns(local_returns: dict[str, float], fx_returns: dict[str, float], asset_ccy: dict[str, str]) -> dict[str, float]"},"hints":["There are three lookups in this problem. Which dict answers 'what currency is this asset in'?","Loop over the assets in local_returns. For each, find its currency, then its FX return (0 for GBP), then compound the two returns.","Inputs: local_returns, fx_returns, asset_ccy\nSteps: for each asset → ccy → fx (GBP = 0, missing → error) → (1 + local) * (1 + fx) - 1\nSignature: def to_gbp_returns(...) -> dict[str, float]"],"explanation":"Adding r_local + r_FX drops the cross term r_local × r_FX. It's small in a quiet month, it's still wrong, and it compounds. Writing down where the currency comes from, and what happens when one is missing, is exactly the kind of decision that a plan forces out of a one-paragraph brief.","financeNotes":["This assumes the position is unhedged. A hedged position would earn roughly the local return plus the interest-rate differential, not the spot FX move."]},{"id":"l1-plan-best","type":"plan","concepts":["plan"],"stage":4,"device":"phone","title":"Plan from one line","brief":"Plan a function that tells you the best and worst performing holding this month.","rubric":[{"id":"metric","text":"Defines 'performing' (return, not contribution)","any":["return"]},{"id":"shape","text":"Decides the output shape (e.g. a tuple of two tickers)","any":["tuple","pair","two","(best"]},{"id":"edge","text":"Handles empty input or ties","any":["empty","tie","raise","valueerror"]},{"id":"how","text":"Uses max/min with a key (or sorting)","any":["max","min","sort"]}],"modelPlan":{"inputs":"returns: dict ticker -> monthly return (decimal)","outputs":"tuple[str, str]: (best ticker, worst ticker)","steps":"1. If returns is empty, raise ValueError.\n2. best = ticker with the highest return (max with key=returns.get).\n3. worst = ticker with the lowest return (min with key=returns.get).\n4. Ties: max/min keep the first one seen; say so in the docstring.\n5. Return (best, worst).","signatures":"def best_and_worst(returns: dict[str, float]) -> tuple[str, str]"},"hints":["'Best performing' by what measure? And what exactly comes back: names, numbers, both?","Take a returns dict. Use max() and min() with key=returns.get to get tickers. Decide what happens when the dict is empty.","Inputs: returns: dict[str, float]\nOutput: (best, worst)\nSteps: empty → raise · max(..., key=...) · min(..., key=...)\nSignature: def best_and_worst(returns: dict[str, float]) -> tuple[str, str]"],"explanation":"A one-line brief hides decisions. Best by return or by contribution? What comes back? What if there's nothing? Write those down and the vague ask becomes something you can test."},{"id":"l1-plan-contrib","type":"plan","concepts":["plan"],"stage":5,"device":"phone","timeLimitSec":360,"title":"Blank page: where did the return come from?","brief":"The CIO asks: \"Where did this month's return come from?\" Plan the code.","rubric":[{"id":"wxr","text":"Contribution of each asset = weight × return","any":["weight *","weight ×","w *","w ×","w*r","weight x","contribution"]},{"id":"sum","text":"Checks the contributions add up to the portfolio return","any":["sum","add up","total"]},{"id":"dict","text":"Output keyed by asset (a dict)","any":["dict"]},{"id":"share","text":"Thinks about shares of the total and the near-zero / negative total case","any":["share","%","zero","negative","divid"]}],"modelPlan":{"inputs":"weights: dict ticker -> weight (decimal)\nreturns: dict ticker -> monthly return (decimal)","outputs":"dict ticker -> contribution (decimal return points); optionally shares of the total","steps":"1. contribution = weight * return for each holding.\n2. Portfolio return = sum of contributions (check it matches portfolio_return()).\n3. Optional: share = contribution / total, but flag or skip it when the total is near zero (shares explode) or negative (signs flip).\n4. Return contributions sorted by size.","signatures":"def contributions(weights: dict[str, float], returns: dict[str, float]) -> dict[str, float]\ndef contribution_shares(contribs: dict[str, float]) -> dict[str, float]"},"explanation":"'Where did the return come from' is single-period contribution: weight × return per asset, which sums exactly to the portfolio return. Shares of the total are fragile: near a zero total they explode and with a negative total they flip sign, so a good plan says what to do there.","financeNotes":["Multi-period attribution needs a linking method (e.g. Carino or Menchero); single-period contributions don't simply add up across months. Out of scope here."],"hints":[]},{"id":"pr-dict-iter","type":"predict","concepts":["dicts"],"stage":1,"device":"phone","code":"weights = {\"EQ_GLOBAL\": 0.6, \"GILTS\": 0.4}\nfor x in weights:\n    print(x)\n","answer":"EQ_GLOBAL\nGILTS","choices":["EQ_GLOBAL\nGILTS","0.6\n0.4","('EQ_GLOBAL', 0.6)\n('GILTS', 0.4)"],"explanation":"Looping over a dict gives its keys. Use .values() for the weights or .items() for (key, value) pairs. Dicts keep insertion order (guaranteed since Python 3.7).","hints":[]},{"id":"w-dicts","type":"worked","concepts":["dicts"],"stage":1,"device":"phone","title":"Weighted sum over a dict","code":"def portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    total = 0.0\n    for ticker, weight in weights.items():\n        total += weight * returns[ticker]\n    return total\n\n\nweights = {\"EQ_GLOBAL\": 0.55, \"GILTS\": 0.25, \"IG_CREDIT\": 0.20}\nreturns = {\"EQ_GLOBAL\": 0.021, \"GILTS\": -0.004, \"IG_CREDIT\": 0.006, \"EM_DEBT\": 0.013}\nprint(f\"{portfolio_return(weights, returns):.4%}\")\n","verifyOutput":"1.1750%","runnable":true,"explainPrompt":"returns includes EM_DEBT, which isn't held. Why loop over weights rather than returns? And what happens if a held ticker is missing from returns?","explanation":"Looping over weights means only holdings count; extra entries in returns (say, a whole index's returns table) are ignored. If a holding has no return, returns[ticker] raises KeyError. That loud failure is what you want: .get(ticker, 0.0) would quietly treat missing data as a 0% month.","hints":[]},{"id":"fb-dicts","type":"fillBlank","concepts":["dicts"],"stage":2,"device":"phone","title":"Fill the gaps","prompt":"Complete portfolio_return(). Any answer that makes the tests pass counts.","code":"def portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    total = 0.0\n    for ticker, weight in weights.__1__:\n        total __2__ weight * returns[__3__]\n    return total\n","answers":[["items()"],["+=","= total +"],["ticker"]],"cases":[{"call":"portfolio_return({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.02, \"GOV\": -0.005})","expect":"0.01","label":"Two assets"},{"call":"portfolio_return({\"EQ\": 1.0}, {\"EQ\": 0.03, \"GOV\": 0.5})","expect":"0.03","label":"Unheld asset ignored","visible":false},{"call":"portfolio_return({}, {})","expect":"0.0","label":"Empty portfolio","visible":false}],"hints":["What do you need to call on a dict to get (key, value) pairs?","Blank 1 gives pairs, blank 2 adds to a running total, blank 3 is the key you're looking up.","for ticker, weight in weights.items():\n    total += weight * returns[...]"],"explanation":".items() yields (ticker, weight) pairs that unpack straight into the loop variables. += keeps a running total. The key for returns is the same ticker you're iterating over."},{"id":"ps-active","type":"parsons","concepts":["dicts"],"stage":2,"device":"phone","title":"Active weights","prompt":"Build active_weights(): portfolio weight minus benchmark weight for every asset in either. Indentation is already set. Two lines are decoys.","lines":["def active_weights(portfolio: dict[str, float], benchmark: dict[str, float]) -> dict[str, float]:","    result = {}","    for ticker in portfolio.keys() | benchmark.keys():","        result[ticker] = portfolio.get(ticker, 0.0) - benchmark.get(ticker, 0.0)","    return result","        result[ticker] = portfolio[ticker] - benchmark[ticker]","        return result"],"order":[0,1,2,3,4],"cases":[{"call":"active_weights({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.5, \"GOV\": 0.3, \"CASH\": 0.2})","expect":"{'EQ': 0.1, 'GOV': 0.1, 'CASH': -0.2}","label":"Benchmark holds CASH, portfolio doesn't"},{"call":"active_weights({\"A\": 0.5, \"B\": 0.5}, {\"A\": 0.5, \"B\": 0.5})","expect":"{'A': 0.0, 'B': 0.0}","label":"Identical weights","visible":false}],"hints":["CASH is only in the benchmark. Which of the two candidate 'result[ticker] =' lines survives that?","Start an empty dict, loop over the union of keys, fill in the difference using .get with a default, then return after the loop.","def ...\n    result = {}\n    for ticker in <union of keys>:\n        result[ticker] = <get-based difference>\n    return result"],"explanation":"keys() views support set operations, so a | b is the union of tickers. .get(ticker, 0.0) treats 'not held' as weight 0, which is right here (unlike for returns, where missing data should fail). The decoy that indexes directly raises KeyError on CASH; the decoy 'return' inside the loop returns after the first ticker."},{"id":"fc-get","type":"flashcard","concepts":["dicts"],"stage":1,"device":"phone","front":"Look up key k in dict d, falling back to 0.0 if it's missing","back":"d.get(k, 0.0)\n\nUse it when 'missing' genuinely means zero (an unheld weight), not when missing means bad data (a missing return).","hints":[]},{"id":"cd-asset-class","type":"code","concepts":["dicts"],"stage":3,"device":"phone","title":"Fund weights → asset-class weights","prompt":"Write the body of asset_class_weights() so it matches its docstring.","starter":"def asset_class_weights(weights: dict[str, float], asset_class: dict[str, str]) -> dict[str, float]:\n    \"\"\"Sum fund weights by asset class.\n\n    weights: fund ticker -> portfolio weight (decimal)\n    asset_class: fund ticker -> asset class name, e.g. \"Equity\"\n    Returns asset class -> total weight. A fund missing from\n    asset_class should raise KeyError.\n    \"\"\"\n    ...\n","solution":"def asset_class_weights(weights: dict[str, float], asset_class: dict[str, str]) -> dict[str, float]:\n    \"\"\"Sum fund weights by asset class.\n\n    weights: fund ticker -> portfolio weight (decimal)\n    asset_class: fund ticker -> asset class name, e.g. \"Equity\"\n    Returns asset class -> total weight. A fund missing from\n    asset_class should raise KeyError.\n    \"\"\"\n    totals: dict[str, float] = {}\n    for fund, weight in weights.items():\n        cls = asset_class[fund]\n        totals[cls] = totals.get(cls, 0.0) + weight\n    return totals\n","cases":[{"call":"asset_class_weights({\"SPY\": 0.3, \"VEA\": 0.2, \"AGG\": 0.4, \"GLD\": 0.1}, {\"SPY\": \"Equity\", \"VEA\": \"Equity\", \"AGG\": \"Bonds\", \"GLD\": \"Commodities\"})","expect":"{'Equity': 0.5, 'Bonds': 0.4, 'Commodities': 0.1}","label":"Four funds, three classes","diagnoses":[{"expect":"{'Equity': 0.2, 'Bonds': 0.4, 'Commodities': 0.1}","message":"You're overwriting each class's total instead of adding to it."}]},{"call":"asset_class_weights({}, {})","expect":"{}","label":"Empty portfolio"},{"kind":"raises","raises":"KeyError","call":"asset_class_weights({\"SPY\": 0.5, \"XYZ\": 0.5}, {\"SPY\": \"Equity\"})","label":"Fund with no asset class","visible":false},{"call":"asset_class_weights({\"A\": 0.25, \"B\": 0.25, \"C\": 0.5}, {\"A\": \"Equity\", \"B\": \"Equity\", \"C\": \"Equity\"})","expect":"{'Equity': 1.0}","label":"Everything in one class","visible":false}],"selftestWrong":[{"note":"overwrites instead of summing","expectMessage":"overwriting","code":"def asset_class_weights(weights, asset_class):\n    totals = {}\n    for fund, weight in weights.items():\n        totals[asset_class[fund]] = weight\n    return totals\n"}],"hints":["What should happen the first time you meet a class, compared with the second time?","Start with an empty dict. For each fund, find its class, then add the weight to that class's running total, using .get(cls, 0.0) for the first time you see it.","totals = {}\nfor fund, weight in weights.items():\n    cls = ...\n    totals[cls] = totals.get(...) + ...\nreturn totals"],"explanation":"This is groupby-and-sum by hand: a dict of running totals, with .get(cls, 0.0) covering the first sighting. Indexing asset_class[fund] directly means an unmapped fund fails loudly. Later, pandas does the same with df.groupby('asset_class')['weight'].sum()."},{"id":"pr-get-accum","type":"predict","concepts":["dicts"],"stage":2,"device":"phone","code":"totals = {}\nfor cls, w in [(\"Equity\", 0.3), (\"Bonds\", 0.5), (\"Equity\", 0.2)]:\n    totals[cls] = totals.get(cls, 0) + w\nprint(totals)\n","answer":"{'Equity': 0.5, 'Bonds': 0.5}","choices":["{'Equity': 0.5, 'Bonds': 0.5}","{'Equity': 0.2, 'Bonds': 0.5}","KeyError"],"explanation":"The first 'Equity' starts from the .get default of 0, the second adds 0.2 to 0.3. Keys keep first-insertion order, so Equity stays first.","hints":[]},{"id":"cd-top-n","type":"code","concepts":["dicts"],"stage":4,"device":"phone","title":"Top-n holdings","prompt":"Write `top_n_holdings(weights, n)`: the n biggest holdings, biggest first, as a list of (ticker, weight) tuples.","starter":"","solution":"def top_n_holdings(weights: dict[str, float], n: int) -> list[tuple[str, float]]:\n    return sorted(weights.items(), key=lambda kv: kv[1], reverse=True)[:n]\n","checks":[{"check":"defines","name":"top_n_holdings","label":"Defines top_n_holdings()"}],"cases":[{"call":"top_n_holdings({\"A\": 0.1, \"B\": 0.5, \"C\": 0.25, \"D\": 0.15}, 2)","expect":"[('B', 0.5), ('C', 0.25)]","cmp":"exact","label":"Top 2"},{"call":"top_n_holdings({\"A\": 0.1, \"B\": 0.5}, 0)","expect":"[]","cmp":"exact","label":"n = 0"},{"call":"top_n_holdings({\"A\": 0.1, \"B\": 0.5, \"C\": 0.4}, 10)","expect":"[('B', 0.5), ('C', 0.4), ('A', 0.1)]","cmp":"exact","label":"n bigger than the portfolio","visible":false}],"selftestWrong":[{"note":"ascending order","code":"def top_n_holdings(weights, n):\n    return sorted(weights.items(), key=lambda kv: kv[1])[:n]\n"}],"hints":["Which built-in sorts any iterable and lets you say what to sort by?","Sort weights.items() by the weight (the second element of each pair), largest first, then slice off the first n.","def top_n_holdings(weights: dict[str, float], n: int) -> list[tuple[str, float]]:\n    ranked = sorted(weights.items(), key=..., reverse=...)\n    return ranked[...]"],"explanation":"sorted() takes any iterable; weights.items() gives (ticker, weight) pairs; key=lambda kv: kv[1] sorts by the weight; reverse=True puts the biggest first; slicing [:n] is safe even when n is larger than the list. heapq.nlargest(n, weights.items(), key=...) does the same and is quicker for very large inputs."},{"id":"cd-trades","type":"code","concepts":["dicts"],"stage":5,"device":"either","timeLimitSec":600,"title":"Blank page: rebalancing trades","prompt":"Write `rebalance_trades(current, target, nav)`.\n\n- `current` and `target` map ticker → weight (decimal).\n- `nav` is the fund value in GBP.\n- Return a dict ticker → GBP amount to trade to reach the target (positive = buy, negative = sell).\n- A ticker may appear in only one of the two dicts; treat the missing weight as 0.\n- Leave out any trade smaller than £1,000 in absolute size.","starter":"","solution":"def rebalance_trades(current: dict[str, float], target: dict[str, float], nav: float) -> dict[str, float]:\n    trades: dict[str, float] = {}\n    for ticker in current.keys() | target.keys():\n        amount = (target.get(ticker, 0.0) - current.get(ticker, 0.0)) * nav\n        if abs(amount) >= 1_000:\n            trades[ticker] = amount\n    return trades\n","cases":[{"call":"rebalance_trades({\"EQ\": 0.62, \"GOV\": 0.38}, {\"EQ\": 0.60, \"GOV\": 0.40}, 10_000_000)","expect":"{'EQ': -200000.0, 'GOV': 200000.0}","tol":1e-06,"label":"Basic two-asset rebalance","visible":false},{"call":"rebalance_trades({\"EQ\": 0.5, \"OLD\": 0.5}, {\"EQ\": 0.5, \"NEW\": 0.5}, 1_000_000)","expect":"{'OLD': -500000.0, 'NEW': 500000.0}","tol":1e-06,"label":"New holding and full sale","visible":false},{"call":"rebalance_trades({\"A\": 0.5001, \"B\": 0.4999}, {\"A\": 0.5, \"B\": 0.5}, 1_000_000)","expect":"{}","label":"Trades under £1,000 dropped","visible":false},{"call":"rebalance_trades({}, {}, 1_000_000)","expect":"{}","label":"Empty inputs","visible":false}],"explanation":"Union of keys so new and sold names both appear; .get(…, 0.0) for the missing side; (target − current) × NAV gives the sign convention for free; abs() for the threshold so small sells are dropped too.","financeNotes":["Real trade lists also round to lot sizes and net against cash flows; the next module builds that."],"hints":[]},{"id":"pr-float-eq","type":"predict","concepts":["guards"],"stage":1,"device":"phone","code":"total = 0.6 + 0.3 + 0.1\nprint(total == 1.0)\nprint(total)\n","answer":"False\n0.9999999999999999","choices":["True\n1.0","False\n0.9999999999999999","False\n1.0"],"explanation":"0.6, 0.3 and 0.1 have no exact binary representation, so adding them left to right lands one tiny step below 1.0. Never compare floats with ==. Note: since Python 3.12, sum() uses compensated summation, so sum([0.6, 0.3, 0.1]) happens to give 1.0, but a manual loop doesn't. Don't rely on either.","hints":[]},{"id":"w-guards","type":"worked","concepts":["guards"],"stage":1,"device":"phone","title":"Fail loudly, early","code":"import math\n\n\ndef check_weights(weights: dict[str, float], tol: float = 1e-6) -> None:\n    \"\"\"Raise ValueError if weights are empty or don't sum to 1.\"\"\"\n    if not weights:\n        raise ValueError(\"weights is empty\")\n    total = sum(weights.values())\n    if not math.isclose(total, 1.0, abs_tol=tol):\n        raise ValueError(f\"weights sum to {total:.4f}, expected 1.0\")\n\n\ncheck_weights({\"EQ\": 0.6, \"GOV\": 0.3, \"IG\": 0.1})  # passes silently\ntry:\n    check_weights({\"EQ\": 0.7, \"GOV\": 0.4})\nexcept ValueError as err:\n    print(f\"Rejected: {err}\")\n","verifyOutput":"Rejected: weights sum to 1.1000, expected 1.0","runnable":true,"explainPrompt":"Why math.isclose instead of ==, and why raise rather than print a warning or return False?","explanation":"Floats carry rounding error, so == 1.0 rejects good portfolios; isclose with an explicit tolerance says what 'equal' means. Raising stops bad data flowing further and carries a message; a returned False is easy to ignore, and a printed warning disappears in a log.","financeNotes":["This check allows negative weights (shorts). A long-only mandate would add: any(w < 0 for w in weights.values()) → raise."],"hints":[]},{"id":"sb-float-eq","type":"spotBug","concepts":["guards"],"stage":2,"device":"phone","title":"The check that rejects good portfolios","prompt":"This check rejects a perfectly good 60/30/10 portfolio. Tap the line with the bug, then fix it.","symptom":"tests","starter":"import math\n\n\ndef check_weights(weights: dict[str, float]) -> None:\n    total = 0.0\n    for w in weights.values():\n        total += w\n    if total != 1.0:\n        raise ValueError(f\"weights sum to {total}, expected 1.0\")\n","bugLines":[8],"solution":"import math\n\n\ndef check_weights(weights: dict[str, float]) -> None:\n    total = 0.0\n    for w in weights.values():\n        total += w\n    if not math.isclose(total, 1.0, abs_tol=1e-9):\n        raise ValueError(f\"weights sum to {total}, expected 1.0\")\n","cases":[{"call":"check_weights({\"EQ\": 0.6, \"GOV\": 0.3, \"IG\": 0.1})","expect":"None","label":"60/30/10 passes"},{"kind":"raises","raises":"ValueError","call":"check_weights({\"EQ\": 0.7, \"GOV\": 0.4})","label":"110% is rejected"},{"kind":"raises","raises":"ValueError","call":"check_weights({})","label":"Empty is rejected","visible":false}],"hints":["Print total for the 60/30/10 case. What do you see?","Exact float equality is the problem. Swap it for a comparison with a tolerance.","if not math.isclose(total, 1.0, abs_tol=...):"],"explanation":"The loop sums to 0.9999999999999999, so != 1.0 is True and a valid portfolio is rejected. math.isclose with abs_tol fixes it. The import was already there, unused: an unused import is often a hint about what the author meant to do."},{"id":"fc-isclose","type":"flashcard","concepts":["guards"],"stage":1,"device":"phone","front":"Compare two floats a and b for equality","back":"math.isclose(a, b, abs_tol=1e-9)\n\nabs_tol matters when comparing with 0: with only the default rel_tol, isclose(x, 0) is True only when x is exactly 0.","hints":[]},{"id":"cd-safe-return","type":"code","concepts":["guards"],"stage":3,"device":"phone","title":"Portfolio return with guard rails","prompt":"Implement safe_portfolio_return() so it matches its docstring.","starter":"import math\n\n\ndef safe_portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    \"\"\"Portfolio return with input checks.\n\n    Raise ValueError if:\n      - weights don't sum to 1 (within 1e-6), or\n      - any held ticker has no return; the message must name\n        every missing ticker.\n    Otherwise return the sum of weight * return.\n    \"\"\"\n    ...\n","solution":"import math\n\n\ndef safe_portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    \"\"\"Portfolio return with input checks.\n\n    Raise ValueError if:\n      - weights don't sum to 1 (within 1e-6), or\n      - any held ticker has no return; the message must name\n        every missing ticker.\n    Otherwise return the sum of weight * return.\n    \"\"\"\n    total_weight = sum(weights.values())\n    if not math.isclose(total_weight, 1.0, abs_tol=1e-6):\n        raise ValueError(f\"weights sum to {total_weight:.6f}, expected 1.0\")\n    missing = sorted(t for t in weights if t not in returns)\n    if missing:\n        raise ValueError(f\"no return for: {', '.join(missing)}\")\n    return sum(w * returns[t] for t, w in weights.items())\n","cases":[{"call":"safe_portfolio_return({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.02, \"GOV\": -0.005})","expect":"0.01","label":"Valid inputs"},{"kind":"raises","raises":"ValueError","call":"safe_portfolio_return({\"EQ\": 0.6, \"GOV\": 0.3}, {\"EQ\": 0.02, \"GOV\": 0.01})","label":"Weights sum to 0.9"},{"kind":"raises","raises":"ValueError","match":"GOV","call":"safe_portfolio_return({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.02})","label":"Missing return named"},{"kind":"raises","raises":"ValueError","match":"(?s)(?=.*IG)(?=.*HY)","call":"safe_portfolio_return({\"EQ\": 0.5, \"IG\": 0.3, \"HY\": 0.2}, {\"EQ\": 0.01})","label":"Several missing: name them all","visible":false},{"call":"safe_portfolio_return({\"A\": 0.6, \"B\": 0.3, \"C\": 0.1}, {\"A\": 0.01, \"B\": 0.01, \"C\": 0.01})","expect":"0.01","label":"Float-y weights still accepted","visible":false}],"selftestWrong":[{"note":"lets KeyError escape","expectMessage":"Python failing","code":"import math\n\ndef safe_portfolio_return(weights, returns):\n    if not math.isclose(sum(weights.values()), 1.0, abs_tol=1e-6):\n        raise ValueError(\"bad weights\")\n    return sum(w * returns[t] for t, w in weights.items())\n"}],"hints":["There are two separate checks before the calculation. Which can you do in one line each?","First compare sum(weights.values()) with 1 using math.isclose. Then build the list of held tickers missing from returns; if it's non-empty, raise with them joined into the message. Only then compute.","total_weight = sum(...)\nif not math.isclose(...):\n    raise ValueError(...)\nmissing = [t for t in weights if t not in returns]\nif missing:\n    raise ValueError(f\"no return for: {...}\")\nreturn ..."],"explanation":"Validate first, compute last. Collecting all missing tickers before raising saves the user a fix-one-rerun-fix-another loop. Letting Python's own KeyError escape would technically fail, but with a message about one ticker and no context."},{"id":"pr-except","type":"predict","concepts":["guards"],"stage":2,"device":"phone","code":"try:\n    float(\"1.5%\")\nexcept ValueError as err:\n    print(type(err).__name__)\n","answer":"ValueError","choices":["ValueError","TypeError","0.015"],"explanation":"float() parses numbers, not percentages: '1.5%' is a ValueError (right type, unacceptable value). TypeError is for the wrong type entirely, e.g. float(None).","hints":[]},{"id":"cd-parse-pct","type":"code","concepts":["guards"],"stage":4,"device":"phone","title":"Parse percentages","prompt":"Write `parse_pct(text)` that turns '1.25%', ' -0.4 % ' or '3' into decimals (0.0125, -0.004, 0.03), and raises ValueError mentioning the original text for anything it can't parse.","starter":"","solution":"def parse_pct(text: str) -> float:\n    cleaned = text.strip().removesuffix(\"%\").strip()\n    try:\n        value = float(cleaned)\n    except ValueError:\n        raise ValueError(f\"not a percentage: {text!r}\") from None\n    return value / 100\n","checks":[{"check":"defines","name":"parse_pct","label":"Defines parse_pct()"}],"cases":[{"call":"parse_pct(\"1.25%\")","expect":"0.0125","label":"'1.25%'"},{"call":"parse_pct(\" -0.4 % \")","expect":"-0.004","label":"Spaces and a minus sign"},{"call":"parse_pct(\"3\")","expect":"0.03","label":"No % sign"},{"kind":"raises","raises":"ValueError","match":"abc","call":"parse_pct(\"abc\")","label":"Garbage names the text"},{"kind":"raises","raises":"ValueError","call":"parse_pct(\"\")","label":"Empty string","visible":false},{"kind":"raises","raises":"ValueError","match":"1,5","call":"parse_pct(\"1,5%\")","label":"Comma decimal separator","visible":false}],"hints":["What does float(' 1.25 ') give? And float('1.25%')?","Strip whitespace, remove a trailing %, strip again, then float() inside try/except; re-raise as ValueError with the original text, and divide by 100.","cleaned = text.strip().removesuffix(\"%\").strip()\ntry:\n    value = float(cleaned)\nexcept ValueError:\n    raise ValueError(f\"...{text!r}\") from None\nreturn ..."],"explanation":"str.removesuffix (3.9+) only strips one trailing %, unlike rstrip('%'), which strips any number. float() already tolerates surrounding spaces. raise … from None hides the original, less helpful exception from the traceback; plain raise … from err keeps it, which is better when the cause matters."},{"id":"cd-load-weights","type":"code","concepts":["guards"],"stage":5,"device":"either","timeLimitSec":600,"title":"Blank page: load a weights file","prompt":"Write `load_weights(lines)`. `lines` is a list of strings like 'EQ_US, 35%' (the % is optional).\n\n- Return a dict ticker → weight as a decimal.\n- Skip blank lines and lines starting with '#'.\n- Raise ValueError mentioning the line number (count every line from 1, including comments and blanks) for any line that isn't 'TICKER, number'.\n- Raise ValueError if the weights don't add up to 100% (within 0.01 percentage points).","starter":"","solution":"def load_weights(lines: list[str]) -> dict[str, float]:\n    weights: dict[str, float] = {}\n    for number, raw in enumerate(lines, start=1):\n        line = raw.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        parts = [p.strip() for p in line.split(\",\")]\n        if len(parts) != 2 or not parts[0]:\n            raise ValueError(f\"line {number}: expected 'TICKER, weight%', got {raw!r}\")\n        ticker, value = parts\n        try:\n            weights[ticker] = float(value.removesuffix(\"%\").strip()) / 100\n        except ValueError:\n            raise ValueError(f\"line {number}: can't read weight {value!r}\") from None\n    total = sum(weights.values())\n    if abs(total - 1.0) > 1e-4:\n        raise ValueError(f\"weights add up to {total:.4%}, expected 100%\")\n    return weights\n","cases":[{"call":"load_weights([\"EQ_US, 35%\", \"EQ_EU, 15%\", \"GILTS, 30%\", \"IG, 20%\"])","expect":"{'EQ_US': 0.35, 'EQ_EU': 0.15, 'GILTS': 0.3, 'IG': 0.2}","label":"Basic file","visible":false},{"call":"load_weights([\"# model portfolio\", \"\", \"EQ, 60%\", \"   \", \"GOV, 40\"])","expect":"{'EQ': 0.6, 'GOV': 0.4}","label":"Comments, blanks, missin
