g %","visible":false},{"kind":"raises","raises":"ValueError","match":"\\b3\\b","call":"load_weights([\"# hdr\", \"EQ, 60%\", \"GOV 40%\"])","label":"Malformed line names line 3","visible":false},{"kind":"raises","raises":"ValueError","match":"\\b1\\b","call":"load_weights([\"EQ, sixty%\"])","label":"Non-numeric weight names line 1","visible":false},{"kind":"raises","raises":"ValueError","call":"load_weights([\"EQ, 60%\", \"GOV, 30%\"])","label":"Weights add up to 90%","visible":false}],"explanation":"enumerate(lines, start=1) gives human line numbers for free. Splitting on ',' and checking for exactly two parts catches most malformed lines; the try/except around float() catches the rest. The total check runs once, after parsing, because it's about the file as a whole.","hints":[]},{"id":"pr-unpack","type":"predict","concepts":["tracebacks"],"stage":1,"device":"phone","code":"weights = {\"EQ_US\": 0.6, \"GILTS\": 0.4}\nfor ticker, w in weights:\n    print(ticker, w)\n","answer":"ValueError","expectError":"ValueError","choices":["EQ_US 0.6\nGILTS 0.4","ValueError","TypeError"],"explanation":"Looping over a dict gives keys, so Python tries to unpack the string 'EQ_US' (5 characters) into two names: ValueError, too many values to unpack. The fix is weights.items().","hints":[]},{"id":"w-traceback","type":"worked","concepts":["tracebacks"],"stage":1,"device":"phone","title":"Read it bottom-up","code":"def portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    total = 0.0\n    for ticker, weight in weights.items():\n        total += weight * returns[ticker]\n    return total\n\n\nweights = {\"EQ_GLOBAL\": 0.5, \"GILTS\": 0.3, \"EM_DEBT\": 0.2}\nreturns = {\"EQ_GLOBAL\": 0.021, \"GILTS\": -0.004}\nprint(portfolio_return(weights, returns))\n","verifyError":{"type":"KeyError","line":4},"runnable":true,"show":"Tap **Run** to see the real traceback, then read it from the bottom up.","explainPrompt":"What failed, on which line of your code, and what are two different ways to fix it?","explanation":"Bottom line first: KeyError: 'EM_DEBT', so a dict lookup for EM_DEBT failed. The last frame in your code points at line 4, returns[ticker]. Fix 1: get the missing data. Fix 2: validate up front and raise a clear ValueError naming the ticker. Not a fix: .get(ticker, 0.0), which silently invents a 0% return.","hints":[]},{"id":"sb-str-returns","type":"spotBug","concepts":["tracebacks"],"stage":2,"device":"phone","title":"Returns from a CSV","prompt":"The code crashes. Tap the line you need to change, then fix it. The returns really do arrive as strings, so fix the function, not the data.","symptom":"run","starter":"def portfolio_return(weights: dict[str, float], returns: dict[str, str]) -> float:\n    \"\"\"returns come straight from a CSV, so the values are strings like \"0.021\".\"\"\"\n    total = 0.0\n    for ticker, weight in weights.items():\n        total += weight * returns[ticker]\n    return total\n\n\nweights = {\"EQ\": 0.6, \"GOV\": 0.4}\nreturns = {\"EQ\": \"0.021\", \"GOV\": \"-0.004\"}\nprint(portfolio_return(weights, returns))\n","bugLines":[5],"expectError":{"type":"TypeError","line":5},"solution":"def portfolio_return(weights: dict[str, float], returns: dict[str, str]) -> float:\n    \"\"\"returns come straight from a CSV, so the values are strings like \"0.021\".\"\"\"\n    total = 0.0\n    for ticker, weight in weights.items():\n        total += weight * float(returns[ticker])\n    return total\n\n\nweights = {\"EQ\": 0.6, \"GOV\": 0.4}\nreturns = {\"EQ\": \"0.021\", \"GOV\": \"-0.004\"}\nprint(portfolio_return(weights, returns))\n","cases":[{"call":"portfolio_return({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": \"0.021\", \"GOV\": \"-0.004\"})","expect":"0.011","label":"String returns"},{"call":"portfolio_return({\"EQ\": 1.0}, {\"EQ\": \"0.05\"})","expect":"0.05","label":"Single asset","visible":false}],"hints":["The message says 'can't multiply sequence by non-int of type float'. Which value is the 'sequence'?","returns[ticker] is a str. Convert it to a number at the point of use.","total += weight * float(...)"],"explanation":"A str is a sequence, and 'abc' * 2 is legal ('abcabc'), but 'abc' * 0.6 isn't: hence 'can't multiply sequence by non-int'. Convert with float() where the data enters your maths. In real code you'd convert once, when loading the CSV, so the rest of the program only sees floats."},{"id":"fc-tb-read","type":"flashcard","concepts":["tracebacks"],"stage":1,"device":"phone","front":"Where do you start reading a Python traceback?","back":"At the bottom: the last line names the error type and message. Then go up to the last frame in your own file. That's where it blew up, which isn't always where the bug is.","hints":[]},{"id":"sb-avg","type":"spotBug","concepts":["tracebacks"],"stage":3,"device":"phone","title":"A quiet bug","prompt":"No crash this time: a test fails. Tap the faulty line, then fix it.","symptom":"tests","starter":"def average_return(returns: list[float]) -> float:\n    total = 0.0\n    for i in range(1, len(returns)):\n        total += returns[i]\n    return total / len(returns)\n","bugLines":[3],"solution":"def average_return(returns: list[float]) -> float:\n    total = 0.0\n    for r in returns:\n        total += r\n    return total / len(returns)\n","cases":[{"call":"average_return([0.01, 0.02, 0.03])","expect":"0.02","label":"Three months"},{"call":"average_return([0.05])","expect":"0.05","label":"One month"},{"call":"average_return([-0.01, 0.01])","expect":"0.0","label":"Cancels out","visible":false}],"hints":["Which element does range(1, len(returns)) never visit?","The loop skips index 0. Loop over the values directly instead of over indices.","for r in returns:\n    total += r"],"explanation":"range(1, n) starts at index 1, so the first month is dropped, while the divisor still counts it. Looping over values (for r in returns) removes the index entirely, so there's no off-by-one to make. statistics.fmean() does this in one call. Empty input still raises ZeroDivisionError here; decide whether that's acceptable."},{"id":"pr-mutable-default","type":"predict","concepts":["tracebacks"],"stage":2,"device":"phone","code":"def add_trade(ticker, blotter=[]):\n    blotter.append(ticker)\n    return blotter\n\nadd_trade(\"EQ\")\nprint(add_trade(\"GOV\"))\n","answer":"['EQ', 'GOV']","choices":["['GOV']","['EQ', 'GOV']","TypeError"],"explanation":"The default list is created once, when def runs, and shared by every call that doesn't pass its own. Use None as the default and create the list inside the function.","hints":[]},{"id":"sb-mutable","type":"spotBug","concepts":["tracebacks"],"stage":4,"device":"phone","title":"The leaky blotter","prompt":"The afternoon blotter should only hold the gilts trade. Find the bug and fix it.","symptom":"run","starter":"def add_trade(ticker: str, amount: float, blotter: list[tuple[str, float]] = []) -> list[tuple[str, float]]:\n    \"\"\"Append a trade to blotter (a new one if none is given) and return it.\"\"\"\n    blotter.append((ticker, amount))\n    return blotter\n\n\nmorning = add_trade(\"EQ_US\", 50_000)\nafternoon = add_trade(\"GILTS\", -20_000)\nprint(afternoon)\n","bugLines":[1],"solution":"def add_trade(ticker: str, amount: float, blotter: list[tuple[str, float]] | None = None) -> list[tuple[str, float]]:\n    \"\"\"Append a trade to blotter (a new one if none is given) and return it.\"\"\"\n    if blotter is None:\n        blotter = []\n    blotter.append((ticker, amount))\n    return blotter\n\n\nmorning = add_trade(\"EQ_US\", 50_000)\nafternoon = add_trade(\"GILTS\", -20_000)\nprint(afternoon)\n","cases":[{"call":"(add_trade(\"A\", 1.0), add_trade(\"B\", 2.0))[1]","expect":"[('B', 2.0)]","cmp":"exact","label":"Fresh blotter each call"},{"call":"add_trade(\"C\", 3.0, [(\"X\", 1.0)])","expect":"[('X', 1.0), ('C', 3.0)]","cmp":"exact","label":"Uses the blotter you pass in"}],"hints":["When is the default value [] created: on each call, or once?","A mutable default is shared across calls. Default to None and create a new list inside the function when nothing is passed.","def add_trade(..., blotter: list[...] | None = None) -> ...:\n    if blotter is None:\n        blotter = []"],"explanation":"Default values are evaluated once, when the def statement runs. A mutable default (list, dict, set) is therefore shared state. The None-sentinel pattern is the standard fix; linters like ruff flag the original (rule B006)."},{"id":"sb-summary","type":"spotBug","concepts":["tracebacks"],"stage":5,"device":"phone","timeLimitSec":480,"title":"Blank page: two bugs","prompt":"summary() should return 'Portfolio 1.10%, best: EQ' for weights {EQ: 0.6, GOV: 0.4} and returns {EQ: 2.1%, GOV: −0.4%}. It's broken in two places. Tap one, then fix both.","symptom":"tests","starter":"def portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    return sum(w * returns[t] for t, w in weights)\n\n\ndef best_asset(returns: dict[str, float]) -> str:\n    return max(returns, key=returns.get)\n\n\ndef summary(weights: dict[str, float], returns: dict[str, float]) -> str:\n    pr = portfolio_return(weights, returns)\n    return f\"Portfolio {pr:.2f}%, best: {best_asset(returns)}\"\n","bugLines":[2,11],"solution":"def portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    return sum(w * returns[t] for t, w in weights.items())\n\n\ndef best_asset(returns: dict[str, float]) -> str:\n    return max(returns, key=returns.get)\n\n\ndef summary(weights: dict[str, float], returns: dict[str, float]) -> str:\n    pr = portfolio_return(weights, returns)\n    return f\"Portfolio {pr:.2%}, best: {best_asset(returns)}\"\n","cases":[{"call":"summary({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.021, \"GOV\": -0.004})","expect":"'Portfolio 1.10%, best: EQ'","cmp":"exact","label":"Full summary string","visible":false},{"call":"portfolio_return({\"A\": 0.5, \"B\": 0.5}, {\"A\": 0.02, \"B\": 0.04})","expect":"0.03","label":"portfolio_return","visible":false},{"call":"best_asset({\"A\": 0.01, \"B\": 0.03})","expect":"'B'","cmp":"exact","label":"best_asset","visible":false}],"explanation":"Bug 1: iterating a dict gives keys, so unpacking 't, w' fails; it needs .items(). Bug 2: :.2f prints 0.01 and the literal % sign doesn't scale it; the :.2% format multiplies by 100 and adds the sign. Fixing one bug and re-running to find the next is normal; that's what tests are for.","hints":[]},{"id":"pr-compound","type":"predict","concepts":["compounding"],"stage":1,"device":"phone","code":"growth = 1.0\nfor r in [0.10, -0.10]:\n    growth *= 1 + r\nprint(round(growth - 1, 4))\n","answer":"-0.01","choices":["0.0","-0.01","0.01"],"explanation":"+10% then −10% is 1.1 × 0.9 = 0.99: a 1% loss, not zero. Returns compound; they don't add.","hints":[]},{"id":"w-compound","type":"worked","concepts":["compounding"],"stage":1,"device":"either","title":"Compound, then annualise","code":"def cumulative_return(period_returns: list[float]) -> float:\n    \"\"\"Compound simple period returns into one cumulative return.\"\"\"\n    growth = 1.0\n    for r in period_returns:\n        growth *= 1 + r\n    return growth - 1\n\n\ndef annualise(cum_return: float, n_periods: int, periods_per_year: int = 12) -> float:\n    \"\"\"Convert a cumulative return over n_periods into a compound annual rate.\"\"\"\n    return (1 + cum_return) ** (periods_per_year / n_periods) - 1\n\n\nmonthly = [0.012, -0.004, 0.008, 0.015, -0.011, 0.007]\ncum = cumulative_return(monthly)\nprint(f\"6-month: {cum:.2%}, annualised: {annualise(cum, len(monthly)):.2%}\")\n","verifyOutput":"6-month: 2.71%, annualised: 5.48%","runnable":true,"explainPrompt":"Why multiply (1 + r) instead of adding r? And what is periods_per_year quietly assuming?","explanation":"Each period's return applies to the value at the start of that period, so growth factors multiply. periods_per_year assumes a fixed frequency (12 monthly, 52 weekly, ~252 trading days) and that the period you have is representative of a full year.","financeNotes":["252 trading days is a common convention, not a law; some desks use 250, 260 or calendar days. State the one you use.","GIPS says returns for periods shorter than a year must not be annualised. Annualising 6 months is fine for a sanity check, not for reporting."],"hints":[]},{"id":"fb-compound","type":"fillBlank","concepts":["compounding"],"stage":2,"device":"phone","title":"Fill the gaps: compounding","prompt":"Complete cumulative_return().","code":"def cumulative_return(period_returns: list[float]) -> float:\n    growth = __1__\n    for r in period_returns:\n        growth __2__ (1 + r)\n    return growth __3__\n","answers":[["1.0","1"],["*=","= growth *"],["- 1","-1","- 1.0"]],"cases":[{"call":"cumulative_return([0.1, -0.1])","expect":"-0.01","label":"+10% then −10%","diagnoses":[{"expect":"2.0","message":"You're adding growth factors. Returns compound, so multiply."}]},{"call":"cumulative_return([])","expect":"0.0","label":"No periods"},{"call":"cumulative_return([0.02] * 12)","expect":"0.268241794563","label":"Twelve months of 2%","visible":false}],"hints":["Before any returns are applied, what is £1 worth?","Start at 1, multiply by (1 + r) each period, and convert the final growth factor back into a return.","growth = 1.0 · growth *= (1 + r) · return growth - 1"],"explanation":"Start from a growth factor of 1 (nothing has happened yet), multiply in each (1 + r), and subtract 1 at the end to turn the factor back into a return. An empty list correctly gives 0."},{"id":"fc-compound","type":"flashcard","concepts":["compounding"],"stage":1,"device":"phone","front":"Cumulative return of a list of simple returns rs, in one line","back":"math.prod(1 + r for r in rs) - 1\n\n(math.prod exists since Python 3.8.)","hints":[]},{"id":"cd-growth","type":"code","concepts":["compounding"],"stage":3,"device":"phone","title":"Growth of £100","prompt":"Implement growth_of() to match its docstring.","starter":"def growth_of(amount: float, period_returns: list[float]) -> list[float]:\n    \"\"\"Value of `amount` after each period, compounding the returns.\n\n    growth_of(100, [0.10, -0.10]) -> [110.0, 99.0]\n    An empty list of returns gives an empty list.\n    \"\"\"\n    ...\n","solution":"def growth_of(amount: float, period_returns: list[float]) -> list[float]:\n    \"\"\"Value of `amount` after each period, compounding the returns.\n\n    growth_of(100, [0.10, -0.10]) -> [110.0, 99.0]\n    An empty list of returns gives an empty list.\n    \"\"\"\n    values: list[float] = []\n    value = amount\n    for r in period_returns:\n        value *= 1 + r\n        values.append(value)\n    return values\n","cases":[{"call":"growth_of(100, [0.10, -0.10])","expect":"[110.0, 99.0]","label":"Docstring example","diagnoses":[{"expect":"[0.1, -0.01]","message":"Those are cumulative returns; the brief asks for the value of amount after each period."}]},{"call":"growth_of(1_000_000, [])","expect":"[]","label":"No returns"},{"call":"growth_of(50, [0.0, 0.0])","expect":"[50.0, 50.0]","label":"Flat months","visible":false},{"call":"growth_of(100, [0.5, -0.5, 0.5])","expect":"[150.0, 75.0, 112.5]","label":"Big swings","visible":false}],"hints":["You need a running value that changes each period, plus a list that records it each time. What's the running value at the start?","Start value at amount. For each return, multiply value by (1 + r) and append it to a list. Return the list.","values = []\nvalue = amount\nfor r in period_returns:\n    value *= ...\n    values.append(...)\nreturn values"],"explanation":"A running value plus an accumulator list: the same shape as most path-dependent finance (wealth index, drawdowns, cash balances). itertools.accumulate can do it in one line, but the loop is clearer while you're learning the pattern."},{"id":"pr-fstring-pct","type":"predict","concepts":["compounding"],"stage":1,"device":"phone","code":"print(f\"{0.01234:.2%}\")\n","answer":"1.23%","choices":["1.23%","0.01%","1.234%"],"explanation":"The % format spec multiplies by 100 and adds a % sign; .2 sets two decimals. Keep numbers as decimals in code and format them only for display.","hints":[]},{"id":"cd-max-dd","type":"code","concepts":["compounding"],"stage":4,"device":"phone","title":"Maximum drawdown","prompt":"Write `max_drawdown(period_returns)`: the worst peak-to-trough fall of the growth index, as a negative decimal (0.0 if it never falls). The index starts at 1.0 before the first period.","starter":"","solution":"def max_drawdown(period_returns: list[float]) -> float:\n    level = peak = 1.0\n    worst = 0.0\n    for r in period_returns:\n        level *= 1 + r\n        peak = max(peak, level)\n        worst = min(worst, level / peak - 1)\n    return worst\n","checks":[{"check":"defines","name":"max_drawdown","label":"Defines max_drawdown()"}],"cases":[{"call":"max_drawdown([-0.1])","expect":"-0.1","label":"Immediate loss counts","diagnoses":[{"expect":"0.0","message":"Your peak should start at 1.0 (the index before the first period), so an immediate loss counts."}]},{"call":"max_drawdown([0.1, -0.2, 0.05, 0.1])","expect":"-0.2","label":"Peak then fall"},{"call":"max_drawdown([0.1, 0.1])","expect":"0.0","label":"Never falls"},{"call":"max_drawdown([])","expect":"0.0","label":"No periods"},{"call":"max_drawdown([0.05, -0.1, -0.1, 0.3, -0.25])","expect":"-0.25","label":"Two drawdowns: pick the worse","visible":false},{"call":"max_drawdown([-0.5, 1.0, -0.5])","expect":"-0.5","label":"Recover, then fall again","visible":false}],"hints":["At each step, what two numbers do you need to know to measure how far you are below the best level so far?","Track the current level (compounding), the running peak (max so far, starting at 1.0), and the worst level/peak − 1 seen.","level = peak = 1.0\nworst = 0.0\nfor r in period_returns:\n    level *= ...\n    peak = max(...)\n    worst = min(...)\nreturn worst"],"explanation":"One pass, three running values: level, peak and worst. Starting the peak at 1.0 makes a loss in period one count. The same logic in pandas is wealth / wealth.cummax() − 1, but remember to include the starting 1.0 or the first period's loss disappears."},{"id":"cd-ann-stats","type":"code","concepts":["compounding"],"stage":5,"device":"either","timeLimitSec":600,"title":"Blank page: annualised stats","prompt":"Write `annualised_stats(monthly_returns)` returning a dict with:\n\n- 'cagr': the compound annual growth rate\n- 'vol': annualised volatility, i.e. the sample standard deviation of the monthly returns × √12\n\nRaise ValueError if there are fewer than 2 returns.","starter":"","solution":"import math\nimport statistics\n\n\ndef annualised_stats(monthly_returns: list[float]) -> dict[str, float]:\n    if len(monthly_returns) < 2:\n        raise ValueError(\"need at least 2 monthly returns\")\n    n = len(monthly_returns)\n    growth = math.prod(1 + r for r in monthly_returns)\n    return {\n        \"cagr\": growth ** (12 / n) - 1,\n        \"vol\": statistics.stdev(monthly_returns) * math.sqrt(12),\n    }\n","cases":[{"call":"annualised_stats([0.01, -0.02, 0.03, 0.015])","expect":"{'cagr': 0.108031607799, 'vol': 0.072629195232}","label":"Four months","visible":false,"diagnoses":[{"expect":"{'cagr': 0.108031607799, 'vol': 0.062898728127}","message":"Your vol uses the population standard deviation (pstdev); the brief asks for the sample one (stdev)."}]},{"call":"annualised_stats([0.01] * 12)","expect":"{'cagr': 0.126825030132, 'vol': 0.0}","label":"Twelve flat months","visible":false},{"kind":"raises","raises":"ValueError","call":"annualised_stats([0.01])","label":"One return","visible":false},{"kind":"raises","raises":"ValueError","call":"annualised_stats([])","label":"No returns","visible":false}],"explanation":"CAGR = growth^(12/n) − 1 with growth the product of (1 + r). statistics.stdev is the sample (n − 1) standard deviation; pstdev divides by n. Scaling by √12 assumes monthly returns are independent; with autocorrelation (smoothed private-asset returns, say) it understates true annual vol.","financeNotes":["Annualising four months is only for testing; GIPS doesn't allow annualising returns for periods under a year."],"hints":[]},{"id":"pr-name-main","type":"predict","concepts":["structure"],"stage":1,"device":"phone","code":"def main() -> None:\n    print(\"report\")\n\n\nif __name__ == \"__main__\":\n    main()\nprint(__name__)\n","answer":"report\n__main__","choices":["report\n__main__","__main__","report\nsolution"],"explanation":"Run as a script, a file's __name__ is '__main__', so the guard fires. Imported (by tests, say), __name__ is the module's name and main() doesn't run. The final print runs either way, which is why loose top-level prints are a smell.","hints":[]},{"id":"w-program","type":"worked","concepts":["structure"],"stage":1,"device":"either","title":"A small, testable program","code":"\"\"\"Monthly portfolio return report.\"\"\"\n\nWEIGHTS = {\"EQ_GLOBAL\": 0.55, \"GILTS\": 0.25, \"IG_CREDIT\": 0.20}\nRETURNS = {\"EQ_GLOBAL\": 0.020, \"GILTS\": -0.004, \"IG_CREDIT\": 0.006}\n\n\ndef portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    return sum(w * returns[t] for t, w in weights.items())\n\n\ndef format_report(weights: dict[str, float], returns: dict[str, float]) -> str:\n    lines = [f\"{t:<10} {w:>6.1%} {returns[t]:>7.2%}\" for t, w in weights.items()]\n    lines.append(f\"{'Portfolio':<10} {'':>6} {portfolio_return(weights, returns):>7.2%}\")\n    return \"\\n\".join(lines)\n\n\ndef main() -> None:\n    print(format_report(WEIGHTS, RETURNS))\n\n\nif __name__ == \"__main__\":\n    main()\n","verifyOutput":"EQ_GLOBAL   55.0%   2.00%\nGILTS       25.0%  -0.40%\nIG_CREDIT   20.0%   0.60%\nPortfolio           1.12%","runnable":true,"explainPrompt":"Why does format_report() return a string instead of printing it, and what does the if __name__ guard buy you?","explanation":"A function that returns a value can be tested with one assert; a function that prints can't, easily. main() is the only place with side effects (printing), and the guard means tests can import the file without triggering it. Constants at the top are the poor man's config: easy to find, easy to swap for a config file later.","hints":[]},{"id":"ps-program","type":"parsons","concepts":["structure"],"stage":2,"device":"phone","title":"Assemble a program","prompt":"Arrange a complete program that prints 'Best: EQ'. Indentation is set. Two lines are decoys.","lines":["RETURNS = {\"EQ\": 0.021, \"GOV\": -0.004, \"IG\": 0.006}","def best_asset(returns: dict[str, float]) -> str:","    return max(returns, key=returns.get)","def main() -> None:","    print(f\"Best: {best_asset(RETURNS)}\")","if __name__ == \"__main__\":","    main()","main()","    return print(best_asset(RETURNS))"],"order":[0,1,2,3,4,5,6],"cases":[{"kind":"stdout","expect":"Best: EQ","label":"Prints 'Best: EQ' when run"},{"kind":"silent","label":"Prints nothing when imported"},{"call":"best_asset({\"A\": 0.01, \"B\": 0.02})","expect":"'B'","cmp":"exact","label":"best_asset works"}],"checks":[{"check":"mainGuard","label":"Has a main guard"}],"hints":["Which decoy would run main() even when the file is imported?","Data first, then function definitions, then the guard that calls main(). Functions only need to exist by the time they're called.","RETURNS = ...\ndef best_asset(...):\n    ...\ndef main() -> None:\n    ...\nif __name__ == \"__main__\":\n    main()"],"explanation":"Order matters less than you'd think: Python only needs a name to exist when the line using it runs, so best_asset can be defined after main. What matters is that main() is called under the guard, not bare at top level."},{"id":"fc-main-guard","type":"flashcard","concepts":["structure"],"stage":1,"device":"phone","front":"Why put main() under  if __name__ == \"__main__\":?","back":"So the file runs main() when executed as a script, but not when it's imported (by tests or another module).","hints":[]},{"id":"cd-main-report","type":"code","concepts":["structure"],"stage":3,"device":"phone","title":"Write main() and the guard","prompt":"Fill in main() so it prints exactly what its docstring shows, then add the main guard.","starter":"WEIGHTS = {\"EQ_GLOBAL\": 0.55, \"GILTS\": 0.25, \"IG_CREDIT\": 0.20}\nRETURNS = {\"EQ_GLOBAL\": 0.020, \"GILTS\": -0.004, \"IG_CREDIT\": 0.006}\n\n\ndef portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    return sum(w * returns[t] for t, w in weights.items())\n\n\ndef main() -> None:\n    \"\"\"Print one line per holding, then the total:\n\n    EQ_GLOBAL: 55.0% weight, 2.00% return\n    GILTS: 25.0% weight, -0.40% return\n    IG_CREDIT: 20.0% weight, 0.60% return\n    Portfolio: 1.12%\n    \"\"\"\n    ...\n\n\n# add the main guard here\n","solution":"WEIGHTS = {\"EQ_GLOBAL\": 0.55, \"GILTS\": 0.25, \"IG_CREDIT\": 0.20}\nRETURNS = {\"EQ_GLOBAL\": 0.020, \"GILTS\": -0.004, \"IG_CREDIT\": 0.006}\n\n\ndef portfolio_return(weights: dict[str, float], returns: dict[str, float]) -> float:\n    return sum(w * returns[t] for t, w in weights.items())\n\n\ndef main() -> None:\n    \"\"\"Print one line per holding, then the total:\n\n    EQ_GLOBAL: 55.0% weight, 2.00% return\n    GILTS: 25.0% weight, -0.40% return\n    IG_CREDIT: 20.0% weight, 0.60% return\n    Portfolio: 1.12%\n    \"\"\"\n    for ticker, weight in WEIGHTS.items():\n        print(f\"{ticker}: {weight:.1%} weight, {RETURNS[ticker]:.2%} return\")\n    print(f\"Portfolio: {portfolio_return(WEIGHTS, RETURNS):.2%}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","cases":[{"kind":"stdout","label":"Prints the report when run","expect":"EQ_GLOBAL: 55.0% weight, 2.00% return\nGILTS: 25.0% weight, -0.40% return\nIG_CREDIT: 20.0% weight, 0.60% return\nPortfolio: 1.12%"},{"kind":"silent","label":"Prints nothing when imported"}],"checks":[{"check":"defines","name":"main","label":"Defines main()"},{"check":"mainGuard","label":"Has a main guard"}],"hints":["Which format specs give '55.0%' from 0.55 and '-0.40%' from -0.004?","Loop over WEIGHTS.items(), print one f-string per holding using :.1% and :.2%, then print the portfolio line. Finish with the guard calling main().","for ticker, weight in WEIGHTS.items():\n    print(f\"{ticker}: {weight:.1%} weight, {RETURNS[ticker]:...} return\")\nprint(f\"Portfolio: {...:.2%}\")\n\nif __name__ == \"__main__\":\n    main()"],"explanation":"main() only orchestrates: it reads the constants, calls the calculation and prints. The guard keeps imports silent, which is what the 'prints nothing when imported' test checks, and what pytest needs."},{"id":"cd-write-tests","type":"code","concepts":["structure"],"stage":4,"device":"phone","mode":"tests","title":"Write the tests","prompt":"Write pytest-style tests for `portfolio_return(weights, returns)`. It's already defined; you can't see it.\n\nSpec: it returns the sum of weight × return over the holdings in `weights`; a holding missing from `returns` must raise KeyError.\n\nYour tests run against a correct version and three broken ones. Every broken one must fail at least one of your tests. `approx` and `raises` work like `pytest.approx` and `pytest.raises`.","starter":"","impl":"def portfolio_return(weights, returns):\n    return sum(w * returns[t] for t, w in weights.items())\n","mutants":[{"label":"Adds up the returns, ignoring weights","code":"def portfolio_return(weights, returns):\n    return sum(returns[t] for t in weights)\n"},{"label":"Only counts the first holding","code":"def portfolio_return(weights, returns):\n    t, w = next(iter(weights.items()))\n    return w * returns[t]\n"},{"label":"Treats a missing return as 0%","code":"def portfolio_return(weights, returns):\n    return sum(w * returns.get(t, 0.0) for t, w in weights.items())\n"}],"minTests":2,"solution":"def test_two_assets():\n    result = portfolio_return({\"EQ\": 0.6, \"GOV\": 0.4}, {\"EQ\": 0.02, \"GOV\": -0.005})\n    assert result == approx(0.01)\n\n\ndef test_ignores_unheld_assets():\n    assert portfolio_return({\"EQ\": 1.0}, {\"EQ\": 0.03, \"GOV\": 0.5}) == approx(0.03)\n\n\ndef test_missing_return_raises():\n    with raises(KeyError):\n        portfolio_return({\"EQ\": 0.5, \"GOV\": 0.5}, {\"EQ\": 0.01})\n","selftestWrong":[{"note":"single-asset test only catches one mutant","code":"def test_one():\n    assert portfolio_return({\"EQ\": 1.0}, {\"EQ\": 0.02}) == approx(0.02)\n\n\ndef test_two():\n    assert portfolio_return({\"EQ\": 1.0}, {\"EQ\": 0.05}) == approx(0.05)\n"}],"hints":["With one asset at weight 1.0, can you tell 'weights × returns' apart from 'just returns'?","Use at least two assets with weights that aren't 1 and returns that differ, so each broken version gives a different number. Add a test that checks the KeyError with raises().","def test_two_assets():\n    assert portfolio_return({...}, {...}) == approx(...)\n\ndef test_missing_return_raises():\n    with raises(KeyError):\n        portfolio_return(...)"],"explanation":"A good test is one that a plausible bug would fail. Single-asset, weight-1.0 tests can't distinguish 'weighted' from 'unweighted'; two assets with unequal weights can. Testing the error path (raises) pins down behaviour that's easy to 'helpfully' break with .get()."},{"id":"cd-program","type":"code","concepts":["structure"],"stage":5,"device":"laptop","timeLimitSec":1500,"title":"Blank page: a three-month report","prompt":"Build a small program from a blank file. Use this data:\n\n```\nMONTHLY = {\n    \"EQ_GLOBAL\": [0.021, -0.013, 0.017],\n    \"GILTS\": [-0.004, 0.006, 0.002],\n    \"IG_CREDIT\": [0.006, 0.001, 0.004],\n}\nWEIGHTS = {\"EQ_GLOBAL\": 0.5, \"GILTS\": 0.3, \"IG_CREDIT\": 0.2}\n```\n\nWrite:\n\n- `cumulative_returns(monthly)` → dict asset → cumulative return over all months.\n- `portfolio_cumulative(weights, monthly)` → the portfolio's cumulative return, rebalanced to `weights` at the start of every month (each month's portfolio return is Σ weight × return; then compound the months). Raise ValueError if the assets' return lists have different lengths.\n- `main()` that prints one line per asset and a final line containing the word Portfolio.\n- A main guard. Importing the file must print nothing.\n\nPlan first (inputs, outputs, steps, signatures), then build the simplest version that runs.","starter":"","solution":"import math\n\nMONTHLY = {\n    \"EQ_GLOBAL\": [0.021, -0.013, 0.017],\n    \"GILTS\": [-0.004, 0.006, 0.002],\n    \"IG_CREDIT\": [0.006, 0.001, 0.004],\n}\nWEIGHTS = {\"EQ_GLOBAL\": 0.5, \"GILTS\": 0.3, \"IG_CREDIT\": 0.2}\n\n\ndef cumulative_returns(monthly: dict[str, list[float]]) -> dict[str, float]:\n    return {asset: math.prod(1 + r for r in rs) - 1 for asset, rs in monthly.items()}\n\n\ndef portfolio_cumulative(weights: dict[str, float], monthly: dict[str, list[float]]) -> float:\n    lengths = {len(monthly[asset]) for asset in weights}\n    if len(lengths) > 1:\n        raise ValueError(f\"return series have different lengths: {sorted(lengths)}\")\n    n_months = lengths.pop() if lengths else 0\n    growth = 1.0\n    for month in range(n_months):\n        growth *= 1 + sum(w * monthly[asset][month] for asset, w in weights.items())\n    return growth - 1\n\n\ndef main() -> None:\n    for asset, cum in cumulative_returns(MONTHLY).items():\n        print(f\"{asset:<10} {cum:>7.2%}\")\n    print(f\"{'Portfolio':<10} {portfolio_cumulative(WEIGHTS, MONTHLY):>7.2%}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","setup":"M = {'EQ_GLOBAL': [0.021, -0.013, 0.017], 'GILTS': [-0.004, 0.006, 0.002], 'IG_CREDIT': [0.006, 0.001, 0.004]}\nW = {'EQ_GLOBAL': 0.5, 'GILTS': 0.3, 'IG_CREDIT': 0.2}\n","cases":[{"call":"cumulative_returns(M)","expect":"{'EQ_GLOBAL': 0.024858359, 'GILTS': 0.003979952, 'IG_CREDIT': 0.011034024}","label":"Cumulative return per asset","visible":false},{"call":"portfolio_cumulative(W, M)","expect":"0.015911682225","label":"Monthly-rebalanced portfolio","visible":false},{"call":"portfolio_cumulative({'A': 0.5, 'B': 0.5}, {'A': [0.1, 0.0], 'B': [0.0, 0.1]})","expect":"0.1025","label":"Rebalanced, not buy-and-hold","visible":false,"diagnoses":[{"expect":"0.1","message":"Looks like a weighted average of each asset's cumulative return: that's buy-and-hold-ish, not monthly rebalancing."}]},{"kind":"raises","raises":"ValueError","call":"portfolio_cumulative({'A': 0.5, 'B': 0.5}, {'A': [0.01, 0.02], 'B': [0.01]})","label":"Mismatched lengths","visible":false},{"kind":"stdoutHas","contains":["Portfolio","EQ_GLOBAL","GILTS","IG_CREDIT"],"label":"Report printed when run","visible":false},{"kind":"silent","label":"Silent on import","visible":false}],"checks":[{"check":"defines","name":"main","label":"Defines main()"},{"check":"mainGuard","label":"Has a main guard"},{"check":"typeHints","name":"portfolio_cumulative","label":"portfolio_cumulative() has type hints"}],"explanation":"Two small pure functions do the maths; main() just formats and prints. Monthly rebalancing means you compound the portfolio's monthly returns, which differs from weighting each asset's cumulative return (that's closer to buy-and-hold, where weights drift).","financeNotes":["Rebalanced vs buy-and-hold differ more the more volatile and less correlated the assets are. Neither is 'right'; say which you mean."],"hints":[]},{"id":"pr-items-pairs","type":"predict","concepts":["dicts"],"stage":1,"device":"phone","code":"weights = {\"EQ\": 0.6, \"GOV\": 0.4}\nfor pair in weights.items():\n    print(pair)\n","answer":"('EQ', 0.6)\n('GOV', 0.4)","choices":["('EQ', 0.6)\n('GOV', 0.4)","EQ 0.6\nGOV 0.4","['EQ', 0.6]\n['GOV', 0.4]"],"explanation":".items() yields tuples. Unpack them in the loop header (for t, w in …) to get two names.","hints":[]},{"id":"pr-sum-values","type":"predict","concepts":["dicts"],"stage":1,"device":"phone","code":"weights = {\"EQ\": 0.25, \"GOV\": 0.5, \"CASH\": 0.25}\nprint(sum(weights.values()), len(weights))\n","answer":"1.0 3","choices":["1.0 3","1 3","3 1.0"],"explanation":"sum() over .values() adds the weights; len() of a dict counts keys. 0.25, 0.5 and 0.25 are exact in binary, so the sum is exactly 1.0 here.","hints":[]},{"id":"fc-sort-desc","type":"flashcard","concepts":["dicts"],"stage":1,"device":"phone","front":"Holdings sorted by weight, biggest first, as (ticker, weight) pairs","back":"sorted(weights.items(), key=lambda kv: kv[1], reverse=True)","hints":[]},{"id":"pr-isclose-zero","type":"predict","concepts":["guards"],"stage":2,"device":"phone","code":"import math\nprint(math.isclose(1e-12, 0.0), math.isclose(1e-12, 0.0, abs_tol=1e-9))\n","answer":"False True","choices":["True True","False True","False False"],"explanation":"isclose's default is a relative tolerance, and anything relative to 0 is 0, so only an exact 0 matches. Comparing with zero needs abs_tol.","hints":[]},{"id":"fc-raise-from","type":"flashcard","concepts":["guards"],"stage":2,"device":"phone","front":"Inside except ValueError:, raise a clearer ValueError without showing the original error","back":"raise ValueError(f\"line {n}: bad weight {text!r}\") from None\n\n(from err instead keeps the original as the cause, which is better when the cause matters.)","hints":[]},{"id":"sb-double-pct","type":"spotBug","concepts":["guards"],"stage":2,"device":"phone","title":"Too small by 100×","prompt":"to_decimal('2.5%') should give 0.025 but returns 0.00025. Tap the faulty line, then fix it.","symptom":"tests","starter":"def to_decimal(text: str) -> float:\n    number = float(text.strip().removesuffix(\"%\"))\n    fraction = number / 100\n    return fraction / 100\n","bugLines":[4],"solution":"def to_decimal(text: str) -> float:\n    number = float(text.strip().removesuffix(\"%\"))\n    fraction = number / 100\n    return fraction\n","cases":[{"call":"to_decimal(\"2.5%\")","expect":"0.025","label":"'2.5%'"},{"call":"to_decimal(\" -1 %\")","expect":"-0.01","label":"Negative with spaces","visible":false}],"hints":["How many times is the number divided by 100?","The conversion happens on line 3 already. The return line repeats it.","return fraction"],"explanation":"Converting twice is the classic units bug. Doing each conversion exactly once, in one named step (fraction = number / 100), makes it easy to spot the second one."},{"id":"pr-index-error","type":"predict","concepts":["tracebacks"],"stage":1,"device":"phone","code":"prices = [100.0, 101.5]\nprint(prices[2])\n","answer":"IndexError","expectError":"IndexError","choices":["101.5","IndexError","KeyError"],"explanation":"Two items have positions 0 and 1. Position 2 doesn't exist, so IndexError. Lists raise IndexError, dicts raise KeyError.","hints":[]},{"id":"pr-fstring-eq","type":"predict","concepts":["tracebacks"],"stage":1,"device":"phone","code":"total = 0.25\nprint(f\"{total=}\")\n","answer":"total=0.25","choices":["total=0.25","0.25","{total=}"],"explanation":"f\"{name=}\" prints the expression and its value: the quickest debugging print there is (Python 3.8+).","hints":[]},{"id":"fc-debug-print","type":"flashcard","concepts":["tracebacks"],"stage":1,"device":"phone","front":"You suspect a value is wrong halfway through a function. Fastest check without a debugger?","back":"print(f\"{value=}\") just before the suspect line, run, read, then delete the print.\n\nOn a laptop: breakpoint() drops into the debugger at that line.","hints":[]},{"id":"pr-none-return","type":"predict","concepts":["tracebacks"],"stage":2,"device":"phone","code":"def portfolio_return(weights, returns):\n    total = sum(w * returns[t] for t, w in weights.items())\n\nprint(portfolio_return({\"EQ\": 1.0}, {\"EQ\": 0.02}))\n","answer":"None","choices":["0.02","None","NameError"],"explanation":"No return statement means the function returns None. If a later line does maths with it, the error appears there, far from the real bug.","hints":[]},{"id":"pr-monthly-annual","type":"predict","concepts":["compounding"],"stage":2,"device":"phone","code":"print(round(1.02 ** 12 - 1, 4))\n","answer":"0.2682","choices":["0.24","0.2682","0.2"],"explanation":"2% a month compounds to about 26.8% a year, not 24%. Multiplying a monthly return by 12 is the simple-interest mistake.","hints":[]},{"id":"fc-ann-vol","type":"flashcard","concepts":["compounding"],"stage":2,"device":"phone","front":"Annualise a monthly volatility (standard deviation of monthly returns)","back":"monthly_vol * math.sqrt(12)\n\nAssumes months are independent. Daily data: × √252 by convention.","hints":[]},{"id":"pr-range-skip","type":"predict","concepts":["compounding"],"stage":1,"device":"phone","code":"rs = [0.01, 0.02, 0.03]\nprint(list(range(1, len(rs))))\n","answer":"[1, 2]","choices":["[1, 2]","[1, 2, 3]","[0, 1, 2]"],"explanation":"range(start, stop) stops before stop. Starting at 1 skips index 0: handy for 'compare with the previous period', a bug when you meant every period.","hints":[]},{"id":"fc-uv-pytest","type":"flashcard","concepts":["structure"],"stage":1,"device":"phone","front":"In a uv project: add pytest as a dev dependency, then run the tests","back":"uv add --dev pytest\nuv run pytest","hints":[]},{"id":"fc-ruff","type":"flashcard","concepts":["structure"],"stage":1,"device":"phone","front":"Lint and auto-fix with ruff, then format the code","back":"uv run ruff check --fix .\nuv run ruff format .","hints":[]},{"id":"pr-import-runs","type":"predict","concepts":["structure"],"stage":2,"device":"phone","code":"def report() -> str:\n    return \"ok\"\n\nprint(\"loading…\")\n\nif __name__ == \"__main__\":\n    print(report())\n","answer":"loading…\nok","choices":["loading…\nok","ok","loading…"],"explanation":"Run as a script, both lines print. Imported by a test, only 'loading…' would: top-level prints run on import, which is why they belong inside main().","hints":[]},{"id":"pr-dc-repr","type":"predict","concepts":["m2dc"],"stage":1,"device":"phone","code":"from dataclasses import dataclass\n\n\n@dataclass\nclass Position:\n    ticker: str\n    units: float\n    price: float\n\n\nprint(Position(\"EQ_US\", 100, 25.0))\n","answer":"Position(ticker='EQ_US', units=100, price=25.0)","choices":["Position(ticker='EQ_US', units=100, price=25.0)","<__main__.Position object at 0x…>","('EQ_US', 100, 25.0)"],"explanation":"@dataclass writes __init__, __repr__ and __eq__ for you from the annotated fields. Type hints aren't enforced: units=100 stays an int.","hints":[]},{"id":"w-dataclass","type":"worked","concepts":["m2dc"],"stage":1,"device":"phone","title":"A position record","code":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Position:\n    ticker: str\n    units: float\n    price: float\n    currency: str = \"GBP\"\n\n    @property\n    def market_value(self) -> float:\n        return self.units * self.price\n\n\nbook = [Position(\"EQ_US\", 1_000, 512.3, \"USD\"), Position(\"GILTS\", 50_000, 0.97)]\nfor p in book:\n    print(f\"{p.ticker:<6} {p.market_value:>12,.2f} {p.currency}\")\n","verifyOutput":"EQ_US    512,300.00 USD\nGILTS     48,500.00 GBP","runnable":true,"explainPrompt":"Why make it frozen, and why is market_value a property rather than a stored field?","explanation":"frozen=True makes positions immutable: a function can't quietly change units on you, and frozen instances can be dict keys. market_value is derived from units and price, so computing it on access means it can never go stale. A default (currency='GBP') must come after the fields without defaults.","financeNotes":["Market values here are in each position's own currency. Adding USD and GBP values needs an FX conversion first."],"hints":[]},{"id":"fc-dc-factory","type":"flashcard","concepts":["m2dc"],"stage":1,"device":"phone","front":"A dataclass field that defaults to an empty list","back":"trades: list[Trade] = field(default_factory=list)\n\n(from dataclasses import field). A plain = [] raises ValueError: shared mutable defaults again.","hints":[]},{"id":"fb-dc","type":"fillBlank","concepts":["m2dc"],"stage":2,"device":"phone","title":"Fill the gaps: a Trade record","prompt":"Complete the Trade dataclass.","code":"from __1__ import dataclass\n\n\n@__2__\nclass Trade:\n    ticker: str\n    amount: float\n\n    def side(self) -> str:\n        return \"BUY\" if self.__3__ > 0 else \"SELL\"\n","answers":[["dataclasses"],["dataclass"],["amount"]],"cases":[{"call":"Trade(\"EQ\", 100.0).side()","expect":"'BUY'","cmp":"exact","label":"Positive amount buys"},{"call":"Trade(\"EQ\", -5.0).side()","expect":"'SELL'","cmp":"exact","label":"Negative amount sells"},{"call":"Trade(\"EQ\", 1.0) == Trade(\"EQ\", 1.0)","expect":"True","label":"Equal fields, equal trades","visible":false}],"hints":["Which module is dataclass imported from?","Blank 1 is the module, blank 2 the decorator, blank 3 the field that carries the sign.","from dataclasses import dataclass\n\n@dataclass\nclass Trade: ...\n    return \"BUY\" if self.amount > 0 else \"SELL\""],"explanation":"The decorator reads the annotated class attributes and generates __init__, __repr__ and __eq__. Methods use self.field like any class."},{"id":"pr-dc-eq","type":"predict","concepts":["m2dc"],"stage":2,"device":"phone","code":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Trade:\n    ticker: str\n    amount: float\n\n\na = Trade(\"EQ\", 100.0)\nb = Trade(\"EQ\", 100.0)\nprint(a == b, a is b, len({a, b}))\n","answer":"True False 1","choices":["True False 1","True True 1","False False 2"],"explanation":"== compares fields (generated __eq__); is compares identity. Frozen dataclasses are hashable, so a set keeps one of the two equal trades.","hints":[]},{"id":"cd-positions-from","type":"code","concepts":["m2dc"],"stage":3,"device":"phone","title":"Rows to Position records","prompt":"Implement positions_from_rows(). The Position dataclass is given.","starter":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Position:\n    ticker: str\n    units: float\n    price: float\n\n    @property\n    def market_value(self) -> float:\n        return self.units * self.price\ndef positions_from_rows(rows: list[dict[str, str]]) -> list[Position]:\n    \"\"\"Turn CSV-style rows (all values are strings) into Positions.\n\n    Each row has keys \"ticker\", \"units\", \"price\".\n    Skip rows whose units are zero.\n    Raise ValueError naming the ticker if units or price aren't numbers.\n    \"\"\"\n    ...\n","solution":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Position:\n    ticker: str\n    units: float\n    price: float\n\n    @property\n    def market_value(self) -> float:\n        return self.units * self.price\ndef positions_from_rows(rows: list[dict[str, str]]) -> list[Position]:\n    \"\"\"Turn CSV-style rows (all values are strings) into Positions.\n\n    Each row has keys \"ticker\", \"units\", \"price\".\n    Skip rows whose units are zero.\n    Raise ValueError naming the ticker if units or price aren't numbers.\n    \"\"\"\n    positions = []\n    for row in rows:\n        ticker = row[\"ticker\"]\n        try:\n            units = float(row[\"units\"])\n            price = float(row[\"price\"])\n        except ValueError:\n            raise ValueError(f\"{ticker}: units and price must be numbers\") from None\n        if units != 0:\n            positions.append(Position(ticker, units, price))\n    return positions\n","cases":[{"call":"[(p.ticker, p.units, p.price) for p in positions_from_rows([{\"ticker\": \"EQ\", \"units\": \"100\", \"price\": \"25.5\"}, {\"ticker\": \"GOV\", \"units\": \"0\", \"price\": \"99\"}])]","expect":"[('EQ', 100.0, 25.5)]","cmp":"exact","label":"Zero-unit row skipped"},{"kind":"raises","raises":"ValueError","match":"IG","call":"positions_from_rows([{\"ticker\": \"IG\", \"units\": \"1,000\", \"price\": \"101\"}])","label":"Bad number names the ticker"},{"call":"positions_from_rows([])","expect":"[]","cmp":"exact","label":"No rows","visible":false},{"call":"type(positions_from_rows([{\"ticker\": \"EQ\", \"units\": \"1\", \"price\": \"2\"}])[0].units).__name__","expect":"'float'","cmp":"exact","label":"Units converted to float","visible":false}],"hints":["What type is row['units']? What do you need before comparing it with zero?","Loop over rows; convert units and price with float() inside try/except; on ValueError raise your own message with the ticker; append a Position only when units isn't zero.","positions = []\nfor row in rows:\n    ticker = row[\"ticker\"]\n    try:\n        units = float(...)\n        price = float(...)\n    except ValueError:\n        raise ValueError(f\"{ticker}: ...\") from None\n    if units != 0:\n        positions.append(Position(...))\nreturn positions"],"explanation":"Data from files is text until you convert it. Converting in one place, at the boundary, and failing with the ticker in the message means the rest of the program only ever sees clean Position objects."},{"id":"cd-dc-weight","type":"code","concepts":["m2dc"],"stage":4,"device":"phone","title":"Weight of one position","prompt":"`Position` (with a `market_value` property) is provided. Write `weight_of(book, ticker)`: that ticker's market value as a share of the whole book. Return 0.0 if the ticker isn't held; raise ValueError if the book's total value is zero.","starter":"","setup":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Position:\n    ticker: str\n    units: float\n    price: float\n\n    @property\n    def market_value(self) -> float:\n        return self.units * self.price\nBOOK = [Position(\"EQ_US\", 100, 50.0), Position(\"GILTS\", 300, 10.0), Position(\"IG\", 200, 10.0)]\n","solution":"def weight_of(book: list[Position], ticker: str) -> float:\n    total = sum(p.market_value for p in book)\n    if total == 0:\n        raise ValueError(\"book has zero total value\")\n    held = sum(p.market_value for p in book if p.ticker == ticker)\n    return held / total\n","checks":[{"check":"defines","name":"weight_of","label":"Defines weight_of()"}],"cases":[{"call":"weight_of(BOOK, \"EQ_US\")","expect":"0.5","label":"5,000 of 10,000"},{"call":"weight_of(BOOK, \"GILTS\")","expect":"0.3","label":"3,000 of 10,000"},{"call":"weight_of(BOOK, \"CASH\")","expect":"0.0","label":"Not held"},{"kind":"raises","raises":"ValueError","call":"weight_of([Position(\"X\", 0, 10.0)], \"X\")","label":"Zero-value book"},{"call":"weight_of([Position(\"A\", 1, 10.0), Position(\"A\", 1, 30.0)], \"A\")","expect":"1.0","label":"Two lots of the same ticker","visible":false}],"hints":["Two sums: one over the whole book, one over the positions with this ticker. Which comes first?","Total = sum of market_value over the book; check it isn't zero; held = sum of market_value where ticker matches; return held / total.","def weight_of(book: list[Position], ticker: str) -> float:\n    total = sum(p.market_value for p in book)\n    if total == 0:\n        raise ...\n    held = sum(... if p.ticker == ticker)\n    return ..."],"explanation":"Summing over matches (rather than finding 'the' position) handles split lots and missing tickers with no special cases: no match sums to 0."},{"id":"cd-bond-blank","type":"code","concepts":["m2dc"],"stage":5,"device":"either","timeLimitSec":720,"title":"Blank page: a Bond record","prompt":"Write a frozen dataclass `Bond` with fields `isin` (str), `face` (float, nominal held), `price` (clean price per 100 of face) and `coupon` (annual coupon as a decimal).\n\n- Property `market_value`: face × price / 100.\n- Method `annual_income()`: face × coupon.\n- Function `book_value(bonds)`: total market value of a list of bonds.\n\nInstances must be immutable.","starter":"","solution":"from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Bond:\n    isin: str\n    face: float\n    price: float\n    coupon: float\n\n    @property\n    def market_value(self) -> float:\n        return self.face * self.price / 100\n\n    def annual_income(self) -> float:\n        return self.face * self.coupon\n\n\ndef book_value(bonds: list[Bond]) -> float:\n    return sum(b.market_value for b in bonds)\n","cases":[{"call":"Bond(\"XS0001\", 1_000_000, 98.5, 0.04).market_value","expect":"985000.0","label":"Market value","visible":false},{"call":"Bond(\"XS0001\", 1_000_000, 98.5, 0.04).annual_income()","expect":"40000.0","label":"Annual income","visible":false},{"call":"book_value([Bond(\"A\", 100.0, 101.0, 0.05), Bond(\"B\", 200.0, 95.0, 0.03)])","expect":"291.0","label":"Book value","visible":false},{"call":"book_value([])","expect":"0","label":"Empty book","visible":false}],"tests":"def test_frozen():\n    b = Bond(\"XS1\", 100.0, 99.0, 0.05)\n    try:\n        b.price = 100.0\n    except Exception as e:\n        assert type(e).__name__ == \"FrozenInstanceError\", \"assigning to a field should raise FrozenInstanceError\"\n    else:\n        assert False, \"Bond should be frozen: assigning to b.price must fail\"\n","explanation":"frozen=True plus a property for anything derived. Price is quoted per 100 of face, hence the / 100: the commonest bond-maths slip.","financeNotes":["This uses the clean price. The cash you pay (dirty price) adds accrued interest, which depends on the day-count convention (e.g. ACT/ACT for gilts, 30/360 for many corporates)."],"hints":[]},{"id":"pr-dict-comp","type":"predict","concepts":["m2comp"],"stage":1,"device":"phone","code":"values = {\"A\": 30.0, \"B\": 70.0}\ntotal = sum(values.values())\nprint({t: v / total for t, v in values.items()})\n","answer":"{'A': 0.3, 'B': 0.7}","choices":["{'A': 0.3, 'B': 0.7}","[0.3, 0.7]","{'A': 30.0, 'B': 70.0}"],"explanation":"A dict comprehension builds a new dict: key expression : value expression for each item.","hints":[]},{"id":"w-comp","type":"worked","concepts":["m2comp"],"stage":1,"device":"phone","title":"Four comprehensions","code":"returns = {\"EQ\": 0.021, \"GOV\": -0.004, \"IG\": 0.006, \"HY\": -0.012}\n\nlosers = [t for t, r in returns.items() if r < 0]                    # list\nas_pct = {t: round(r * 100, 1) for t, r in returns.items()}         # dict\nsigns = {\"up\" if r > 0 else \"down\" for r in returns.values()}       # set\ntotal_abs = sum(abs(r) for r in returns.values())                   # generator\n\nprint(losers)\nprint(as_pct)\nprint(sorted(signs))\nprint(round(total_abs, 3))\n","verifyOutput":"['GOV', 'HY']\n{'EQ': 2.1, 'GOV': -0.4, 'IG': 0.6, 'HY': -1.2}\n['down', 'up']\n0.043","runnable":true,"explainPrompt":"Where does the if go when it filters, and where when it chooses a value? Why does sum() take a generator rather than a list?","explanation":"A trailing if filters which items get in. An if/else before the for chooses the value for every item. sum() only needs one value at a time, so a generator (round brackets, or none inside a call) avoids building a throwaway list.","hints":[]},{"id":"fc-dictcomp","type":"flashcard","concepts":["m2comp"],"stage":1,"device":"phone","front":"Weights from a dict of values, in one line","back":"total = sum(values.values())\nweights = {t: v / total for t, v in values.items()}","hints":[]},{"id":"ps-zip","type":"parsons","concepts":["m2comp"],"stage":2,"device":"phone","title":"Pair two lists","prompt":"Build pair_up(): a dict from parallel lists of tickers and prices, refusing lists of different lengths. Two lines are decoys.","lines":["def pair_up(tickers: list[str], prices: list[float]) -> dict[str, float]:","    if len(tickers) != len(prices):","        raise ValueError(\"tickers and prices differ in length\")","    return dict(zip(tickers, prices))","    return list(zip(tickers, prices))","        return {}"],"order":[0,1,2,3],"cases":[{"call":"pair_up([\"EQ\", \"GOV\"], [101.5, 99.0])","expect":"{'EQ': 101.5, 'GOV': 99.0}","label":"Two tickers"},{"kind":"raises","raises":"ValueError","call":"pair_up([\"EQ\"], [1.0, 2.0])","label":"Length mismatch","visible":false}],"hints":["zip() silently stops at the shorter list. What should happen instead?","Check the lengths first and raise, then turn the zipped pairs into a dict.","def pair_up(...):\n    if len(...) != len(...):\n        raise ValueError(...)\n    return dict(zip(...))"],"explanation":"zip pairs items up and dict() turns pairs into a dict. Since Python 3.10, zip(tickers, prices, strict=True) raises for you when lengths differ: same safety, one line."},{"id":"fb-comp","type":"fillBlank","concepts":["m2comp"],"stage":2,"device":"phone","title":"Fill the gaps: overweights","prompt":"Return the tickers whose active weight is above the threshold, sorted.","code":"def overweights(active: dict[str, float], threshold: float) -> list[str]:\n    return sorted(__1__ for t, a in active.__2__ if a __3__ threshold)\n","answers":[["t"],["items()"],[">"]],"cases":[{"call":"overweights({\"EQ\": 0.03, \"GOV\": -0.02, \"IG\": 0.01}, 0.005)","expect":"['EQ', 'IG']","cmp":"exact","label":"Two above 0.5%"},{"call":"overweights({}, 0.01)","expect":"[]","cmp":"exact","label":"Empty","visible":false}],"hints":["What should each element of the result be: the ticker, the weight, or both?","The expression before for is the ticker; iterate over (ticker, active) pairs; keep those strictly above the threshold.","sorted(t for t, a in active.items() if a > threshold)"],"explanation":"sorted() accepts any iterable, including a generator expression, so no inner list is needed."},{"id":"pr-sorted-key","type":"predict","concepts":["m2comp"],"stage":2,"device":"phone","code":"w = {\"A\": 0.2, \"B\": 0.5, \"C\": 0.3}\nprint(sorted(w, key=w.get, reverse=True)[:2])\n","answer":"['B', 'C']","choices":["['B', 'C']","['A', 'B']","[0.5, 0.3]"],"explanation":"Sorting a dict sorts its keys; key=w.get ranks them by value. [:2] keeps the top two.","hints":[]},{"id":"cd-bucket","type":"code","concepts":["m2comp"],"stage":3,"device":"phone","title":"Bucket bonds by rating","prompt":"Implement bucket_by_rating().","starter":"RATING_ORDER = [\"AAA\", \"AA\", \"A\", \"BBB\", \"BB\", \"B\", \"CCC\"]\n\n\ndef bucket_by_rating(ratings: dict[str, str]) -> dict[str, list[str]]:\n    \"\"\"Group bond identifiers by rating.\n\n    ratings: ISIN -> rating, e.g. {\"XS1\": \"BBB\", \"XS2\": \"AA\"}\n    Returns rating -> sorted list of ISINs, with ratings in\n    RATING_ORDER (best first) and only ratings that appear.\n    \"\"\"\n    ...\n","solution":"RATING_ORDER = [\"AAA\", \"AA\", \"A\", \"BBB\", \"BB\", \"B\", \"CCC\"]\n\n\ndef bucket_by_rating(ratings: dict[str, str]) -> dict[str, list[str]]:\n    \"\"\"Group bond identifiers by rating.\n\n    ratings: ISIN -> rating, e.g. {\"XS1\": \"BBB\", \"XS2\": \"AA\"}\n    Returns rating -> sorted list of ISINs, with ratings in\n    RATING_ORDER (best first) and only ratings that appear.\n    \"\"\"\n    buckets: dict[str, list[str]] = {}\n    for isin, rating in ratings.items():\n        buckets.setdefault(rating, []).append(isin)\n    return {r: sorted(buckets[r]) for r in RATING_ORDER if r in buckets}\n","cases":[{"call":"list(bucket_by_rating({\"XS3\": \"BBB\", \"XS1\": \"AA\", \"XS2\": \"BBB\"}).items())","expect":"[('AA', ['XS1']), ('BBB', ['XS2', 'XS3'])]","cmp":"exact","label":"Ordered best first, ISINs sorted"},{"call":"bucket_by_rating({})","expect":"{}","label":"Empty"},{"call":"list(bucket_by_rating({\"Z\": \"CCC\", \"Y\": \"AAA\", \"X\": \"B\"}))","expect":"['AAA', 'B', 'CCC']","cmp":"exact","label":"Rating order, not alphabetical","visible":false}],"hints":["Two jobs: group, then order. Can one dict comprehension over RATING_ORDER do the ordering?","Build a dict rating → list of ISINs (setdefault or .get), then build the result by walking RATING_ORDER and keeping ratings that appear, sorting each list.","buckets = {}\nfor isin, rating in ratings.items():\n    buckets.setdefault(rating, []).append(isin)\nreturn {r: sorted(...) for r in RATING_ORDER if r in buckets}"],"explanation":"Group first, order second. Dicts keep insertion order, so building the result by walking RATING_ORDER gives credit order for free; alphabetical would put 'A' before 'AA' and 'B' before 'BB'."},{"id":"cd-top-contrib","type":"code","concepts":["m2comp"],"stage":4,"device":"phone","title":"Biggest contributors","prompt":"Write `top_contributors(weights, returns, n)`: the n largest contributions (weight × return) by absolute size, as (ticker, contribution) tuples, biggest first.","starter":"","solution":"def top_contributors(weights: dict[str, float], returns: dict[str, float], n: int) -> list[tuple[str, float]]:\n    contribs = [(t, w * returns[t]) for t, w in weights.items()]\n    return sorted(contribs, key=lambda tc: abs(tc[1]), reverse=True)[:n]\n","checks":[{"check":"defines","name":"top_contributors","label":"Defines top_contributors()"}],"cases":[{"call":"top_contributors({'EQ': 0.5, 'GOV': 0.3, 'HY': 0.2}, {'EQ': 0.01, 'GOV': -0.02, 'HY': 0.05}, 2)","expect":"[('HY', 0.01), ('GOV', -0.006)]","label":"Top 2 by absolute size","diagnoses":[{"expect":"[('HY', 0.01), ('EQ', 0.005)]","message":"You ranked by signed size. The brief says absolute size: a big loss is a big contributor."}]},{"call":"top_contributors({'EQ': 0.5, 'GOV': 0.3, 'HY': 0.2}, {'EQ': 0.01, 'GOV': -0.02, 'HY': 0.05}, 0)","expect":"[]","label":"n = 0"},{"call":"len(top_contributors({\"A\": 1.0}, {\"A\": 0.1}, 5))","expect":"1","label":"n larger than the portfolio","visible":false}],"hints":["What should the sort key be when -0.6% matters more than +0.5%?","Build (ticker, weight × return) pairs, sort them by abs() of the contribution descending, slice n.","pairs = [(t, w * returns[t]) for t, w in weights.items()]\nreturn sorted(pairs, key=lambda tc: abs(tc[1]), reverse=True)[:n]"],"explanation":"key=lambda tc: abs(tc[1]) ranks by size while keeping the sign in the output. Risk reports almost always rank by absolute size."},{"id":"cd-rank-blank","type":"code","concepts":["m2comp"],"stage":5,"device":"phone","timeLimitSec":600,"title":"Blank page: league table","prompt":"Write `rank_assets(returns)`. `returns` maps ticker → list of monthly returns. Return a list of (ticker, cumulative return) tuples, best first; break ties by ticker, A to Z.","starter":"","solution":"import math\n\n\ndef rank_assets(returns: dict[str, list[float]]) -> list[tuple[str, float]]:\n    cum = [(t, math.prod(1 + r for r in rs) - 1) for t, rs in returns.items()]\n    return sorted(cum, key=lambda tc: (-round(tc[1], 12), tc[0]))\n","cases":[{"call":"[t for t, _ in rank_assets({'EQ': [0.02, -0.01, 0.03], 'GOV': [0.01, 0.01, 0.01], 'HY': [0.05, -0.04, 0.0], 'IG': [0.01, 0.01, 0.01]})]","expect":"['EQ', 'GOV', 'IG', 'HY']","cmp":"exact","label":"Order, with a tie broken A–Z","visible":false},{"call":"rank_assets({'EQ': [0.02, -0.01, 0.03], 'GOV': [0.01, 0.01, 0.01], 'HY': [0.05, -0.04, 0.0], 'IG': [0.01, 0.01, 0.01]})[0][1]","expect":"0.040094","label":"Top cumulative return","visible":false},{"call":"rank_assets({})","expect":"[]","label":"Empty","visible":false}],"explanation":"Sort keys can be tuples: (-return, ticker) sorts by return descending, then name ascending. Rounding inside the key stops float noise (0.0303 vs 0.030300000000000001) from deciding ties.","hints":[]},{"id":"pr-round-bankers","type":"predict","concepts":["m2rebal"],"stage":1,"device":"phone","code":"print(int(-2.7), round(2.5), round(3.5))\n","answer":"-2 2 4","choices":["-2 2 4","-3 3 4","-2 3 4"],"explanation":"int() truncates toward zero. round() uses round-half-to-even (banker's rounding), so 2.5 → 2 and 3.5 → 4. For lot sizes, decide the rule yourself instead of trusting round().","hints":[]},{"id":"w-weights","type":"worked","concepts":["m2rebal"],"stage":1,"device":"phone","title":"Values to weights","code":"def weights_from_values(values: dict[str, float]) -> dict[str, float]:\n    total = sum(values.values())\n    if total <= 0:\n        raise ValueError(\"portfolio value must be positive\")\n    return {t: v / total for t, v in values.items()}\n\n\nvalues = {\"EQ_GLOBAL\": 6_200_000, \"GILTS\": 2_500_000, \"IG_CREDIT\": 1_100_000, \"CASH\": 200_000}\nfor t, w in weights_from_values(values).items():\n    print(f\"{t:<10} {w:6.2%}\")\n","verifyOutput":"EQ_GLOBAL  62.00%\nGILTS      25.00%\nIG_CREDIT  11.00%\nCASH        2.00%","runnable":true,"explainPrompt":"Why is cash a line in the weights, and why raise on a zero (or negative) total?","explanation":"Cash is part of NAV: leave it out and every other weight is overstated. A zero total would divide by zero; a negative one (heavily short, or a data error) gives weights with flipped signs, so stop and say so.","hints":[]},{"id":"sb-rebal-sign","type":"spotBug","concepts":["m2rebal"],"stage":2,"device":"phone","title":"Buying what we should sell","prompt":"The trade list says sell gilts when gilts are underweight. Tap the bug, then fix it.","symptom":"tests","starter":"def trades(current: dict[str, float], target: dict[str, float], nav: float) -> dict[str, float]:\n    out = {}\n    for t in current.keys() | target.keys():\n        amount = (current.get(t, 0.0) - target.get(t, 0.0)) * nav\n        out[t] = amount\n    return out\n","bugLines":[4],"solution":"def trades(current: dict[str, float], target: dict[str, float], nav: float) -> dict[str, float]:\n    out = {}\n    for t in current.keys() | target.keys():\n        amount = (target.get(t, 0.0) - current.get(t, 0.0)) * nav\n        out[t] = amount\n    return out\n","cases":[{"call":"trades({\"EQ\": 0.62, \"GILTS\": 0.38}, {\"EQ\": 0.6, \"GILTS\": 0.4}, 1_000_000)","expect":"{'EQ': -20000.0, 'GILTS': 20000.0}","tol":1e-06,"label":"Underweight gilts are bought"}],"hints":["Gilts are at 38% and should be 40%. Should the amount be positive or negative?","Buy amount = where you want to be − where you are.","amount = (target.get(t, 0.0) - current.get(t, 0.0)) * nav"],"explanation":"Trade = target − current, so buys are positive. Writing the sign convention in the docstring (positive = buy) prevents this whole class of bug."},{"id":"fc-trunc","type":"flashcard","concepts":["m2rebal"],"stage":1,"device":"phone","front":"Round a (possibly negative) number of lots toward zero, so you never overshoot","back":"int(x)   or   math.trunc(x)\n\nmath.floor(-2.7) is -3: that rounds a sell up, not toward zero.","hints":[]},{"id":"cd-trade-list","type":"code","concepts":["m2rebal"],"stage":3,"device":"phone","title":"Trade list from values","prompt":"Implement trade_list() from its docstring.","starter":"def trade_list(values: dict[str, float], targets: dict[str, float], min_trade: float = 1_000.0) -> dict[str, float]:\n    \"\"\"GBP trades to move from current values to target weights.\n\n    values: ticker -> current market value in GBP (cash included as \"CASH\")\n    targets: ticker -> target weight (decimal), summing to 1\n    Returns ticker -> GBP amount (positive = buy), leaving out trades\n    smaller than min_trade in absolute size. Tickers in only one dict count\n    with 0 on the other side.\n    \"\"\"\n    ...\n","solution":"def trade_list(values: dict[str, float], targets: dict[str, float], min_trade: float = 1_000.0) -> dict[str, float]:\n    \"\"\"GBP trades to move from current values to target weights.\n\n    values: ticker -> current market value in GBP (cash included as \"CASH\")\n    targets: ticker -> target weight (decimal), summing to 1\n    Returns ticker -> GBP amount (positive = buy), leaving out trades\n    smaller than min_trade in absolute size. Tickers in only one dict count\n    with 0 on the other side.\n    \"\"\"\n    nav = sum(values.values())\n    out = {}\n    for t in values.keys() | targets.keys():\n        amount = targets.get(t, 0.0) * nav - values.get(t, 0.0)\n        if abs(amount) >= min_trade:\n            out[t] = amount\n    return out\n","cases":[{"call":"trade_list({\"EQ\": 650_000, \"GOV\": 300_000, \"CASH\": 50_000}, {\"EQ\": 0.6, \"GOV\": 0.38, \"CASH\": 0.02})","expect":"{'EQ': -50000.0, 'GOV': 80000.0, 'CASH': -30000.0}","tol":1e-06,"label":"Three lines incl. cash"},{"call":"trade_list({\"EQ\": 600_500, \"GOV\": 399_500}, {\"EQ\": 0.6, \"GOV\": 0.4})","expect":"{}","tol":1e-06,"label":"Both trades under £1,000"},{"call":"trade_list({\"OLD\": 100_000}, {\"NEW\": 1.0})","expect":"{'OLD': -100000.0, 'NEW': 100000.0}","tol":1e-06,"label":"Switch holdings","visible":false}],"hints":["Where does NAV come from here?","NAV is the sum of values. For each ticker in either dict, trade = target weight × NAV − current value; keep it if abs(trade) ≥ min_trade.","nav = sum(values.values())\nfor t in values.keys() | targets.keys():\n    amount = targets.get(t, 0.0) * nav - values.get(t, 0.0)\n    if abs(amount) >= min_trade:\n        out[t] = amount"],"explanation":"Working in money rather than weights avoids a second multiplication by NAV and makes the threshold natural. Cash trades are the funding leg: they should net the others to zero."},{"id":"pr-trade-net","type":"predict","concepts":["m2rebal"],"stage":2,"device":"phone","code":"trades = {\"EQ\": -50_000.0, \"GOV\": 80_000.0, \"CASH\": -30_000.0}\nprint(sum(trades.values()))\n","answer":"0.0","choices":["0.0","100000.0","-30000.0"],"explanation":"When cash is a line, a full rebalance nets to zero: buys are funded by sells and cash. A non-zero sum means money is appearing or vanishing.","hints":[]},{"id":"cd-lots","type":"code","concepts":["m2rebal"],"stage":4,"device":"phone","title":"Whole lots, never overshooting","prompt":"Write `to_lots(trades, prices, lots)`: GBP trade amounts → number of units to trade, rounded toward zero to a whole multiple of each ticker's lot size. Leave out tickers that round to zero.","starter":"","setup":"TRADES = {\"EQ_US\": 10_250.0, \"GILTS\": -4_990.0, \"IG\": 99.0}\nPRICES = {\"EQ_US\": 51.0, \"GILTS\": 0.98, \"IG\": 101.0}\nLOTS = {\"EQ_US\": 10, \"GILTS\": 1_000, \"IG\": 1}\n","solution":"def to_lots(trades: dict[str, float], prices: dict[str, float], lots: dict[str, int]) -> dict[str, int]:\n    out = {}\n    for t, amount in trades.items():\n        units = amount / prices[t]\n        n_lots = int(units / lots[t])\n        if n_lots:\n            out[t] = n_lots * lots[t]\n    return out\n","checks":[{"check":"defines","name":"to_lots","label":"Defines to_lots()"}],"cases":[{"call":"to_lots(TRADES, PRICES, LOTS)","expect":"{'EQ_US': 200, 'GILTS': -5000}","cmp":"exact","label":"Rounded toward zero, IG dropped","diagnoses":[{"expect":"{'EQ_US': 200, 'GILTS': -6000}","message":"The sell was rounded away from zero (floor). Sells must shrink toward zero too: int() truncates."}]},{"call":"to_lots({\"A\": 999.0}, {\"A\": 10.0}, {\"A\": 100})","expect":"{}","cmp":"exact","label":"Less than one lot"},{"call":"to_lots({\"A\": -1000.0}, {\"A\": 10.0}, {\"A\": 100})","expect":"{'A': -100}","cmp":"exact","label":"Exactly one lot sold","visible":false}],"hints":["EQ_US: £10,250 / £51 = 200.98 units. In lots of 10, what's the most you can buy without going over?","units = amount / price; whole lots = int(units / lot) (truncates toward zero, for buys and sells); units to trade = whole lots × lot; skip zeros.","for t, amount in trades.items():\n    units = amount / prices[t]\n    n_lots = int(units / lots[t])\n    if n_lots:\n        out[t] = n_lots * lots[t]"],"explanation":"Truncating toward zero means you never trade more than intended in either direction. The leftover goes to cash. Production systems often then top up the most underweight line with the residual.","financeNotes":["Gilts trade in nominal, not units, and many markets have minimum denominations: lot rules differ by instrument."]},{"id":"cd-rebal-blank","type":"code","concepts":["m2rebal"],"stage":5,"device":"either","timeLimitSec":900,"title":"Blank page: units to trade","prompt":"Write `rebalance(holdings, prices, targets, cash, cash_buffer=0.01)`.\n\n- `holdings`: ticker → units held; `prices`: ticker → price; `cash`: cash in GBP.\n- NAV = market value of holdings + cash. Aim each ticker at target weight × NAV × (1 − cash_buffer), so a slice of NAV stays in cash.\n- Return ticker → whole units to trade (int, positive = buy), rounded toward zero. Leave out zeros.\n- Raise ValueError if the targets don't sum to 1 (within 1e-9).","starter":"","solution":"import math\n\n\ndef rebalance(holdings: dict[str, float], prices: dict[str, float], targets: dict[str, float],\n              cash: float, cash_buffer: float = 0.01) -> dict[str, int]:\n    if not math.isclose(sum(targets.values()), 1.0, abs_tol=1e-9):\n        raise ValueError(\"targets must sum to 1\")\n    nav = sum(units * prices[t] for t, units in holdings.items()) + cash\n    investable = nav * (1 - cash_buffer)\n    out = {}\n    for t in holdings.keys() | targets.keys():\n        target_units = targets.get(t, 0.0) * investable / prices[t]\n        trade = int(target_units - holdings.get(t, 0))\n        if trade:\n            out[t] = trade\n    return out\n","cases":[{"call":"rebalance({'EQ': 1000, 'GOV': 5000}, {'EQ': 60.0, 'GOV': 10.0}, {'EQ': 0.5, 'GOV': 0.5}, 10_000.0, 0.0)","expect":"{'GOV': 1000}","cmp":"exact","label":"No buffer: NAV 120k split 50/50","visible":false},{"call":"rebalance({'EQ': 1000, 'GOV': 5000}, {'EQ': 60.0, 'GOV': 10.0}, {'EQ': 0.5, 'GOV': 0.5}, 10_000.0)","expect":"{'EQ': -10, 'GOV': 940}","cmp":"exact","label":"1% cash buffer","visible":false},{"kind":"raises","raises":"ValueError","call":"rebalance({'EQ': 1000, 'GOV': 5000}, {'EQ': 60.0, 'GOV': 10.0}, {'EQ': 0.5, 'GOV': 0.4}, 0.0)","label":"Targets don't sum to 1","visible":false},{"call":"rebalance({\"OLD\": 100}, {\"OLD\": 10.0, \"NEW\": 5.0}, {\"NEW\": 1.0}, 0.0, 0.0)","expect":"{'OLD': -100, 'NEW': 200}","cmp":"exact","label":"Full switch","visible":false}],"explanation":"Decompose: NAV → investable NAV → target units → trade → truncate. Each step is one line; together they're the core of any rebalancer. Units held but untargeted are sold to zero.","financeNotes":["A real rebalancer also nets against pending cash flows and checks the residual cash isn't negative after rounding."],"hints":[]},{"id":"pr-pd-loc","type":"predict","concepts":["m3pd"],"stage":1,"device":"phone","packages":["pandas"],"code":"import pandas as pd\n\ns = pd.Series([100.0, 101.5, 99.8], index=[\"2025-01-02\", \"2025-01-03\", \"2025-01-06\"])\nprint(s.iloc[-1], s.loc[\"2025-01-03\"])\n","answer":"99.8 101.5","choices":["99.8 101.5","101.5 99.8","KeyError"],"explanation":".iloc is by position (−1 = last); .loc is by label. Mixing them up is the most common pandas indexing bug.","hints":[]},{"id":"w-pd","type":"worked","concepts":["m3pd"],"stage":1,"device":"phone","packages":["pandas"],"title":"A price table","code":"import pandas as pd\n\nprices = pd.DataFrame(\n    {\"EQ\": [100.0, 102.0, 101.0], \"GOV\": [100.0, 99.5, 100.2]},\n    index=pd.to_datetime([\"2025-01-30\", \"2025-01-31\", \"2025-02-03\"]),\n)\nprint(prices.shape)\nprint(prices.loc[\"2025-01-31\", \"EQ\"])\nprint(prices.iloc[-1].to_dict())\nprint(prices[\"GOV\"].max())\n","verifyOutput":"(3, 2)\n102.0\n{'EQ': 101.0, 'GOV': 100.2}\n100.2","runnable":true,"explainPrompt":"Why can you look up a row with the string '2025-01-31', and what's the difference between prices.loc[...] and prices.iloc[...]?","explanation":"With a DatetimeIndex, pandas parses date strings in .loc, so '2025-01-31' finds that timestamp (and '2025-01' would select the whole month). .loc uses labels, .iloc uses integer positions. prices['GOV'] selects a column as a Series.","financeNotes":["pandas 3 is copy-on-write: selecting a column gives an independent object, so editing it never changes the original frame."],"hints":[]},{"id":"fc-loc-iloc","type":"flashcard","concepts":["m3pd"],"stage":1,"device":"phone","front":"pandas: the last row by position, and the row for 31 Jan 2025 by label","back":"df.iloc[-1]\ndf.loc[\"2025-01-31\"]","hints":[]},{"id":"pr-chained","type":"predict","concepts":["m3pd"],"stage":2,"device":"phone","packages":["pandas"],"code":"import pandas as pd\n\ndf = pd.DataFrame({\"px\": [1.0, 2.0]})\ndf[\"px\"][0] = 9.0\nprint(df.loc[0, \"px\"])\n","answer":"1.0","choices":["9.0","1.0","KeyError"],"explanation":"In pandas 3 (copy-on-write), df['px'] is a separate object, so chained assignment changes nothing and emits a ChainedAssignmentError warning. Write df.loc[0, 'px'] = 9.0 instead.","hints":[]},{"id":"fb-pd","type":"fillBlank","concepts":["m3pd"],"stage":2,"device":"phone","packages":["pandas"],"title":"Fill the gaps: last price","prompt":"Return the most recent price for one ticker. P (a price DataFrame) is provided for the tests.","code":"import pandas as pd\n\n\ndef last_price(prices: pd.DataFrame, ticker: str) -> float:\n    return float(prices[__1__].__2__[-1])\n","answers":[["ticker"],["iloc"]],"setup":"import pandas as pd\n\nP = pd.DataFrame(\n    {\"EQ\": [100.0, 102.0, 101.0, 105.0, 104.0, 108.0],\n     \"GOV\": [100.0, 99.5, 100.2, 100.0, 100.4, 100.1]},\n    index=pd.to_datetime([\"2025-01-30\", \"2025-01-31\", \"2025-02-27\", \"2025-02-28\", \"2025-03-28\", \"2025-03-31\"]),\n)\n","cases":[{"call":"last_price(P, \"EQ\")","expect":"108.0","label":"EQ"},{"call":"last_price(P, \"GOV\")","expect":"100.1","label":"GOV","visible":false}],"hints":["First select the column, then pick by position or by label?","prices[ticker] gives the column. The last value is position −1, which needs the positional indexer.","float(prices[ticker].iloc[-1])"],"explanation":"Column by name, row by position. float() turns numpy's float64 into a plain Python float, which is what the type hint promises."},{"id":"cd-snapshot","type":"code","concepts":["m3pd"],"stage":3,"device":"phone","packages":["pandas"],"title":"Prices as of a date","prompt":"Implement snapshot(). P is provided for the tests.","setup":"import pandas as pd\n\nP = pd.DataFrame(\n    {\"EQ\": [100.0, 102.0, 101.0, 105.0, 104.0, 108.0],\n     \"GOV\": [100.0, 99.5, 100.2, 100.0, 100.4, 100.1]},\n    index=pd.to_datetime([\"2025-01-30\", \"2025-01-31\", \"2025-02-27\", \"2025-02-28\", \"2025-03-28\", \"2025-03-31\"]),\n)\n","starter":"import pandas as pd\n\n\ndef snapshot(prices: pd.DataFrame, date: str) -> dict[str, float]:\n    \"\"\"Latest price of each column on or before `date` (weekends and holidays allowed).\n\n    Raise ValueError if `date` is before the first row.\n    \"\"\"\n    ...\n","solution":"import pandas as pd\n\n\ndef snapshot(prices: pd.DataFrame, date: str) -> dict[str, float]:\n    \"\"\"Latest price of each column on or before `date` (weekends and holidays allowed).\n\n    Raise ValueError if `date` is before the first row.\n    \"\"\"\n    upto = prices.loc[:date]\n    if upto.empty:\n        raise ValueError(f\"no prices on or before {date}\")\n    return {col: float(v) for col, v in upto.iloc[-1].items()}\n","cases":[{"call":"snapshot(P, \"2025-02-28\")","expect":"{'EQ': 105.0, 'GOV': 100.0}","label":"A trading day"},{"call":"snapshot(P, \"2025-03-01\")","expect":"{'EQ': 105.0, 'GOV': 100.0}","label":"A Saturday uses Friday"},{"kind":"raises","raises":"ValueError","call":"snapshot(P, \"2025-01-01\")","label":"Before the data starts"},{"call":"snapshot(P, \"2026-01-01\")","expect":"{'EQ': 108.0, 'GOV': 100.1}","label":"After the data ends","visible":false}],"hints":["How do you select every row up to and including a date?","Slice with prices.loc[:date] (label slices include the end point), check it isn't empty, then take the last row with .iloc[-1].","upto = prices.loc[:date]\nif upto.empty:\n    raise ValueError(...)\nreturn {col: float(v) for col, v in upto.iloc[-1].items()}"],"explanation":"Label slicing on a sorted DatetimeIndex includes both ends and accepts dates that aren't in the index, so .loc[:date].iloc[-1] is 'as of' in one line. Series.asof() does the same for a single column."},{"id":"pr-pd-mean","type":"predict","concepts":["m3pd"],"stage":2,"device":"phone","packages":["pandas"],"code":"import numpy as np\nimport pandas as pd\n\nprint(pd.Series([1.0, None, 3.0]).mean(), np.mean([1.0, np.nan, 3.0]))\n","answer":"2.0 nan","choices":["2.0 nan","nan nan","2.0 2.0"],"explanation":"pandas skips missing values by default (skipna=True); numpy doesn't. Know which one your number came from.","hints":[]},{"id":"cd-total-ret","type":"code","concepts":["m3pd"],"stage":4,"device":"phone","packages":["pandas"],"title":"Total return per column","prompt":"Write `total_returns(prices)`: a Series of each column's return from its first to its last price. P is provided.","setup":"import pandas as pd\n\nP = pd.DataFrame(\n    {\"EQ\": [100.0, 102.0, 101.0, 105.0, 104.0, 108.0],\n     \"GOV\": [100.0, 99.5, 100.2, 100.0, 100.4, 100.1]},\n    index=pd.to_datetime([\"2025-01-30\", \"2025-01-31\", \"2025-02-27\", \"2025-02-28\", \"2025-03-28\", \"2025-03-31\"]),\n)\n","starter":"","solution":"import pandas as pd\n\n\ndef total_returns(prices: pd.DataFrame) -> pd.Series:\n    return prices.iloc[-1] / prices.iloc[0] - 1\n","checks":[{"check":"defines","name":"total_returns","label":"Defines total_returns()"}],"cases":[{"call":"total_returns(P).round(6).to_dict()","expect":"{'EQ': 0.08, 'GOV': 0.001}","label":"Both columns"},{"call":"total_returns(P).idxmax()","expect":"'EQ'","cmp":"exact","label":"Best column"},{"call":"type(total_returns(P)).__name__","expect":"'Series'","cmp":"exact","label":"Returns a Series","visible":false}],"hints":["Which two rows do you need, and does dividing one row by another work column by column?","Take the last row and the first row with .iloc; dividing two Series aligns on column names.","return prices.iloc[-1] / prices.iloc[0] - 1"],"explanation":"Arithmetic between Series aligns on labels, so one line handles every column. This assumes no missing first/last prices: clean first."},{"id":"cd-summary-blank","type":"code","concepts":["m3pd"],"stage":5,"device":"either","packages":["pandas"],"timeLimitSec":720,"title":"Blank page: summary table","prompt":"Write `summary_table(prices)`. `prices` is a DataFrame of prices (dates down, tickers across).\n\nReturn a DataFrame with one row per ticker and columns, in this order: `first`, `last`, `total_return`, `max_drawdown` (worst fall from a running peak of the prices, as a negative decimal).","setup":"import pan
