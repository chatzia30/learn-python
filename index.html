<script type="text/x-python" id="bp-harness">"""Blank Page test harness.

Loaded once into Pyodide. The JS side calls run_code / run_tests / check_signatures /
self_test with JSON strings and gets JSON strings back. Every call starts from a fresh
namespace so one run can never leak state into the next.
"""

import ast
import builtins
import contextlib
import io
import json
import linecache
import math
import re
import traceback

USER_FILE = "<your code>"
TEST_FILE = "<tests>"
SETUP_FILE = "<setup>"
MAX_OUT = 20_000  # characters of stdout kept per run


class _CappedIO(io.StringIO):
    """StringIO that stops storing text after MAX_OUT chars (protects against print loops)."""

    def __init__(self):
        super().__init__()
        self.truncated = False
        self._n = 0

    def write(self, s):
        if self._n >= MAX_OUT:
            self.truncated = True
            return len(s)
        self._n += len(s)
        return super().write(s)

    def text(self):
        out = self.getvalue()
        return out + ("\n… output truncated …" if self.truncated else "")


def _no_input(*_args, **_kwargs):
    raise RuntimeError(
        "input() isn't available here. Pass values in as function arguments instead."
    )


builtins.input = _no_input


# ---------------------------------------------------------------------------
# pytest-alike helpers (same names and behaviour as pytest.approx / pytest.raises)
# ---------------------------------------------------------------------------

def _pandas_close(got, exp, abs_tol, rel_tol):
    """Compare pandas / numpy objects. Returns None if exp isn't one of those."""
    mod = type(exp).__module__ or ""
    if mod.startswith("pandas"):
        import pandas as pd
        kinds = {"Series": pd.testing.assert_series_equal, "DataFrame": pd.testing.assert_frame_equal,
                 "Index": pd.testing.assert_index_equal, "DatetimeIndex": pd.testing.assert_index_equal}
        fn = kinds.get(type(exp).__name__)
        if fn is None:
            return got == exp
        if type(got) is not type(exp):
            return False
        try:
            if fn is pd.testing.assert_index_equal:
                fn(got, exp, exact=False, rtol=rel_tol, atol=abs_tol)
            else:
                fn(got, exp, check_dtype=False, check_freq=False, check_index_type=False,
                   rtol=rel_tol, atol=abs_tol)
            return True
        except AssertionError:
            return False
    if mod.startswith("numpy"):
        import numpy as np
        if isinstance(exp, np.ndarray):
            return isinstance(got, np.ndarray) and got.shape == exp.shape and bool(
                np.allclose(got, exp, rtol=rel_tol, atol=abs_tol, equal_nan=True))
        if isinstance(exp, np.generic):  # numpy scalar: compare as a Python number
            return _close(got, exp.item(), abs_tol, rel_tol)
    return None


def _close(got, exp, abs_tol=1e-9, rel_tol=1e-9):
    pc = _pandas_close(got, exp, abs_tol, rel_tol)
    if pc is not None:
        return bool(pc)
    if type(got).__module__ == "numpy" and hasattr(got, "item"):
        got = got.item()  # numpy float64 etc. -> Python scalar
    if isinstance(exp, bool) or isinstance(got, bool):
        return got is exp or got == exp and type(got) is type(exp)
    if isinstance(exp, (int, float)) and isinstance(got, (int, float)):
        if math.isnan(exp) and math.isnan(got):
            return True
        return math.isclose(got, exp, abs_tol=abs_tol, rel_tol=rel_tol)
    if isinstance(exp, dict):
        return (
            isinstance(got, dict)
            and set(got) == set(exp)
            and all(_close(got[k], exp[k], abs_tol, rel_tol) for k in exp)
        )
    if isinstance(exp, (list, tuple)):
        return (
            isinstance(got, (list, tuple))
            and type(got) is type(exp)
            and len(got) == len(exp)
            and all(_close(g, e, abs_tol, rel_tol) for g, e in zip(got, exp))
        )
    return got == exp


class approx:
    """Minimal pytest.approx: works for numbers, and dicts/lists/tuples of numbers."""

    def __init__(self, expected, abs=1e-9, rel=1e-9):  # noqa: A002 (mirror pytest)
        self.expected, self.abs, self.rel = expected, abs, rel

    def __eq__(self, other):
        return _close(other, self.expected, self.abs, self.rel)

    def __repr__(self):
        return f"approx({self.expected!r})"


class raises:
    """Minimal pytest.raises context manager, including match=."""

    def __init__(self, exc, match=None):
        self.exc, self.match, self.value = exc, match, None

    def __enter__(self):
        return self

    def __exit__(self, et, ev, tb):
        if et is None:
            raise AssertionError(f"DID NOT RAISE {self.exc.__name__}")
        if not issubclass(et, self.exc):
            return False
        if self.match is not None and not re.search(self.match, str(ev)):
            raise AssertionError(
                f"{et.__name__} raised, but its message {str(ev)!r} doesn't match {self.match!r}"
            )
        self.value = ev
        return True


HELPERS = {"approx": approx, "raises": raises}


# ---------------------------------------------------------------------------
# Running code
# ---------------------------------------------------------------------------

def _register(filename, source):
    # Lets tracebacks show source lines for our pseudo-files.
    linecache.cache[filename] = (len(source), None, source.splitlines(True), filename)


def _error_info(e, code):
    lines = code.splitlines()
    info = {"type": type(e).__name__, "message": str(e), "line": None, "lineText": None,
            "where": "code"}
    if isinstance(e, SyntaxError):
        info["message"] = e.msg or str(e)
        if e.filename == USER_FILE:
            info["line"] = e.lineno
        else:
            info["where"] = "tests"
    else:
        frames = traceback.extract_tb(e.__traceback__)
        user = [f for f in frames if f.filename == USER_FILE]
        if user:
            info["line"] = user[-1].lineno
        elif any(f.filename in (TEST_FILE, SETUP_FILE) for f in frames):
            info["where"] = "tests"
    if info["line"] and 1 <= info["line"] <= len(lines):
        info["lineText"] = lines[info["line"] - 1]
    try:
        te = traceback.TracebackException.from_exception(e)
        keep = (USER_FILE, TEST_FILE, SETUP_FILE)
        te.stack = traceback.StackSummary.from_list(
            [f for f in te.stack if f.filename in keep]
        )
        info["trace"] = "".join(te.format()).rstrip()
    except Exception:  # never let formatting hide the real error
        info["trace"] = f"{info['type']}: {info['message']}"
    return info


def _exec(code, name, out, prelude=""):
    """Run code in a fresh namespace. prelude (an item's setup: provided classes, data) runs first."""
    ns = {"__name__": name, "__builtins__": builtins}
    if prelude:
        ns.update(HELPERS)
        _register(SETUP_FILE, prelude)
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            exec(compile(prelude, SETUP_FILE, "exec"), ns)
    _register(USER_FILE, code)
    with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
        exec(compile(code, USER_FILE, "exec"), ns)
    return ns


def run_code(code, prelude=""):
    """Run code as a script (__name__ == '__main__'). Returns stdout, stderr (warnings) and any error."""
    out = _CappedIO()
    err = _CappedIO()
    result = {"ok": True, "stdout": "", "stderr": "", "error": None}
    try:
        _exec_split(code, "__main__", out, err, prelude)
    except SystemExit as e:
        # raise SystemExit(main()) is the normal end of a CLI script: code 0/None means success.
        if e.code not in (0, None):
            result["ok"] = False
            result["error"] = _error_info(e, code)
            result["error"]["message"] = f"exit code {e.code}"
    except BaseException as e:  # KeyboardInterrupt etc. included on purpose
        result["ok"] = False
        result["error"] = _error_info(e, code)
    result["stdout"] = out.text()
    result["stderr"] = err.text()
    return json.dumps(result)


def _exec_split(code, name, out, err, prelude=""):
    ns = {"__name__": name, "__builtins__": builtins}
    with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
        if prelude:
            ns.update(HELPERS)
            _register(SETUP_FILE, prelude)
            exec(compile(prelude, SETUP_FILE, "exec"), ns)
        _register(USER_FILE, code)
        exec(compile(code, USER_FILE, "exec"), ns)
    return ns


# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

def _short(v, n=400):
    try:
        r = repr(v)
    except Exception:
        r = f"<{type(v).__name__}>"
    return r if len(r) <= n else r[: n - 1] + "…"


def _norm_out(s):
    return "\n".join(line.rstrip() for line in s.strip("\n").splitlines()).strip()


def _fresh(code, setup, out=None):
    out = out or _CappedIO()
    ns = _exec(code, "solution", out, setup)
    ns.update(HELPERS)
    return ns


def _expected(expr, setup):
    ns = dict(HELPERS)
    if setup:
        exec(compile(setup, SETUP_FILE, "exec"), ns)
    return eval(compile(expr, TEST_FILE, "eval"), ns)


def _generic_hint(got, exp):
    if type(got).__module__ == "numpy" and hasattr(got, "item") and getattr(got, "ndim", 1) == 0:
        got = got.item()
    if got is None and exp is not None:
        return "Your function returned None. Did you forget a return statement?"
    if isinstance(exp, (int, float)) and isinstance(got, str):
        return "You returned text (a str) where a number was expected."
    if isinstance(exp, float) and isinstance(got, (int, float)) and exp != 0 and got != 0:
        ratio = got / exp
        if math.isclose(ratio, 100, rel_tol=1e-6):
            return "Off by a factor of 100: are you mixing percentages and decimals?"
        if math.isclose(ratio, 0.01, rel_tol=1e-6):
            return "Off by a factor of 100: are you dividing by 100 twice?"
        if math.isclose(ratio, -1, rel_tol=1e-9):
            return "Right size, wrong sign."
    if (type(exp).__module__ or "").startswith("pandas") and type(got) is type(exp):
        if getattr(got, "shape", None) != getattr(exp, "shape", None):
            return f"Shape is {got.shape}, expected {exp.shape}."
        if hasattr(exp, "index") and not got.index.equals(exp.index):
            return "Values may be right but the index (dates/labels) differs."
        return "Same shape and index, but some values differ."
    if type(got) is not type(exp) and not (
        isinstance(got, (int, float)) and isinstance(exp, (int, float))
    ):
        return f"Wrong type: returned {type(got).__name__}, expected {type(exp).__name__}."
    if isinstance(exp, dict) and isinstance(got, dict) and set(got) != set(exp):
        missing = sorted(map(str, set(exp) - set(got)))
        extra = sorted(map(str, set(got) - set(exp)))
        bits = []
        if missing:
            bits.append("missing keys " + ", ".join(missing))
        if extra:
            bits.append("unexpected keys " + ", ".join(extra))
        return "Keys don't match: " + "; ".join(bits) + "."
    if isinstance(exp, (list, tuple)) and isinstance(got, (list, tuple)) and len(got) != len(exp):
        return f"Length is {len(got)}, expected {len(exp)}."
    return ""


def _match(got, exp, case):
    if case.get("cmp") == "exact":
        return got == exp and type(got) is type(exp)
    return _close(got, exp, case.get("tol", 1e-9), case.get("rtol", 1e-9))


def _exec_main(code, out, setup):
    """Run as a script; a clean SystemExit (raise SystemExit(main()) returning 0) is fine."""
    try:
        _exec(code, "__main__", out, setup)
    except SystemExit as e:
        if e.code not in (0, None):
            raise


def _run_case(code, case, setup):
    kind = case.get("kind", "value")
    res = {"label": case.get("label", ""), "visible": case.get("visible", True),
           "call": case.get("call", ""), "passed": False, "message": "",
           "expected": None, "got": None, "error": None}
    out = _CappedIO()
    try:
        if kind == "stdout":
            _exec_main(code, out, setup)
            got, exp = _norm_out(out.getvalue()), _norm_out(case["expect"])
            res["got"], res["expected"] = got, exp
            res["passed"] = got == exp
            if not res["passed"]:
                res["message"] = "Printed output doesn't match." if got else "Nothing was printed."
            return res
        if kind == "stdoutHas":
            _exec_main(code, out, setup)
            got = out.getvalue()
            missing = [w for w in case["contains"] if w not in got]
            res["got"] = got[:300]
            res["expected"] = "output containing " + ", ".join(map(repr, case["contains"]))
            res["passed"] = not missing
            if missing:
                res["message"] = "Output is missing: " + ", ".join(map(repr, missing))
            return res
        if kind == "silent":
            _exec(code, "solution", out, setup)
            printed = out.getvalue().strip()
            res["passed"] = printed == ""
            if not res["passed"]:
                res["got"] = printed[:300]
                res["message"] = ("Importing your code printed output. Put the printing inside "
                                  "main() and call it under if __name__ == \"__main__\":")
            return res

        ns = _fresh(code, setup, out)
        if kind == "raises":
            want = case["raises"]
            res["expected"] = f"raises {want}" + (
                f" (message mentions {case['match']!r})" if case.get("match") else "")
            try:
                with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
                    got = eval(compile(case["call"], TEST_FILE, "eval"), ns)
            except BaseException as e:
                name = type(e).__name__
                wanted_cls = getattr(builtins, want, Exception)
                if isinstance(e, wanted_cls):
                    if case.get("match") and not re.search(case["match"], str(e)):
                        res["got"] = f"{name}({str(e)!r})"
                        res["message"] = (f"Right exception, but the message should mention "
                                          f"{case['match']!r}.")
                    else:
                        res["passed"] = True
                        res["got"] = f"{name}({str(e)!r})"
                else:
                    res["got"] = f"{name}({str(e)!r})"
                    res["message"] = f"Raised {name}, expected {want}."
                    if name in ("KeyError", "TypeError", "ZeroDivisionError", "IndexError"):
                        res["message"] += " That's Python failing, not your own check firing."
                return _with_extra(res, case)
            res["got"] = f"returned {_short(got)}"
            res["message"] = f"Nothing was raised. Expected {want}."
            return _with_extra(res, case)

        # kind == "value"
        exp = _expected(case["expect"], setup)
        res["expected"] = _short(exp)
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            got = eval(compile(case["call"], TEST_FILE, "eval"), ns)
        res["got"] = _short(got)
        res["passed"] = _match(got, exp, case)
        if not res["passed"]:
            for d in case.get("diagnoses", []):
                try:
                    if _close(got, _expected(d["expect"], setup), 1e-9):
                        res["message"] = d["message"]
                        break
                except Exception:
                    pass
            if not res["message"]:
                res["message"] = _generic_hint(got, exp)
        return _with_extra(res, case)
    except BaseException as e:
        res["error"] = _error_info(e, code)
        res["message"] = f"Your code raised {type(e).__name__}: {e}"
        return _with_extra(res, case)


def _with_extra(res, case):
    if not res["passed"] and case.get("onFail"):
        res["message"] = (res["message"] + " " if res["message"] else "") + case["onFail"]
    return res


def _test_functions(source):
    tree = ast.parse(source)
    return [n.name for n in tree.body
            if isinstance(n, ast.FunctionDef) and n.name.startswith("test")]


def _run_pytest_style(code, tests_src, setup, name_ns=None):
    """Run each test_* function in tests_src against code. Fresh namespace per test."""
    results = []
    for fn in _test_functions(tests_src):
        r = {"name": fn, "passed": False, "message": "", "error": None}
        try:
            ns = name_ns() if name_ns else _fresh(code, setup)
            _register(TEST_FILE, tests_src)
            exec(compile(tests_src, TEST_FILE, "exec"), ns)
            sink = _CappedIO()
            with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                ns[fn]()
            r["passed"] = True
        except AssertionError as e:
            msg = str(e)
            if not msg:
                frames = [f for f in traceback.extract_tb(e.__traceback__)
                          if f.filename == TEST_FILE]
                msg = f"assert failed: {frames[-1].line}" if frames else "assert failed"
            r["message"] = msg
        except BaseException as e:
            r["error"] = _error_info(e, code)
            r["message"] = f"{type(e).__name__}: {e}"
        results.append(r)
    return results


def _ast_checks(code, checks):
    out = []
    try:
        tree = ast.parse(code)
    except SyntaxError:
        return [{"label": c.get("label", c["check"]), "passed": False,
                 "message": "Fix the syntax error first."} for c in checks]
    funcs = {n.name: n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
    for c in checks:
        kind, name = c["check"], c.get("name")
        ok, msg = True, ""
        if kind == "defines":
            ok = name in funcs
            msg = f"Define a function called {name}()."
        elif kind == "typeHints":
            fn = funcs.get(name)
            if fn is None:
                ok, msg = False, f"Define {name}() first."
            else:
                a = fn.args
                params = a.posonlyargs + a.args + a.kwonlyargs
                missing = [p.arg for p in params if p.annotation is None]
                ok = not missing and fn.returns is not None
                msg = f"Add type hints to {name}(): every parameter and the return type."
        elif kind == "docstring":
            fn = funcs.get(name)
            ok = fn is not None and ast.get_docstring(fn) is not None
            msg = f"Give {name}() a one-line docstring saying what it returns."
        elif kind == "mainGuard":
            ok = any(
                isinstance(n, ast.If)
                and isinstance(n.test, ast.Compare)
                and isinstance(n.test.left, ast.Name)
                and n.test.left.id == "__name__"
                for n in tree.body
            )
            msg = 'Add  if __name__ == "__main__":  main()  at the bottom.'
        out.append({"label": c.get("label", kind), "passed": ok, "message": "" if ok else msg})
    return out


def run_tests(code, spec_json):
    """Run an item's checks against code. spec keys: setup, cases, tests, checks, mode,
    impl, mutants, minTests."""
    spec = json.loads(spec_json)
    setup = spec.get("setup", "")
    result = {"load": {"ok": True, "error": None, "stdout": ""}, "checks": [], "cases": [],
              "tests": [], "mutants": [], "passed": False, "summary": ""}

    # 1. Does it even load?
    out = _CappedIO()
    try:
        _exec(code, "solution", out, setup)
    except BaseException as e:
        result["load"] = {"ok": False, "error": _error_info(e, code), "stdout": out.text()}
        result["summary"] = "Your code didn't run"
        return json.dumps(result)
    result["load"]["stdout"] = out.text()

    if spec.get("mode") == "tests":
        return json.dumps(_run_user_tests(code, spec, result))

    result["checks"] = _ast_checks(code, spec.get("checks", []))
    for case in spec.get("cases", []):
        result["cases"].append(_run_case(code, case, setup))
    if spec.get("tests"):
        result["tests"] = _run_pytest_style(code, spec["tests"], setup)

    parts = result["checks"] + result["cases"] + result["tests"]
    n_ok = sum(p["passed"] for p in parts)
    result["passed"] = bool(parts) and n_ok == len(parts)
    result["summary"] = f"{n_ok}/{len(parts)} checks passed"
    return json.dumps(result)


def _run_user_tests(code, spec, result):
    """Mode where the learner writes the tests. They must pass on the good implementation
    and each mutant (deliberately broken implementation) must fail at least one test."""
    names = _test_functions(code)
    need = spec.get("minTests", 2)
    result["checks"].append({
        "label": f"At least {need} test functions", "passed": len(names) >= need,
        "message": "" if len(names) >= need else
        f"Write at least {need} functions whose names start with test_.",
    })

    def on(impl):
        def make():
            ns = {"__name__": "solution", "__builtins__": builtins}
            ns.update(HELPERS)
            exec(compile(impl, "<implementation>", "exec"), ns)
            return ns
        return make

    good = _run_pytest_style(code, code, "", on(spec["impl"])) if names else []
    for g in good:
        g["name"] = f"{g['name']} on the correct version"
    result["tests"] = good
    for m in spec.get("mutants", []):
        runs = _run_pytest_style(code, code, "", on(m["code"])) if names else []
        caught = any(not r["passed"] for r in runs)
        result["mutants"].append({
            "label": m["label"], "passed": caught,
            "message": "" if caught else "None of your tests fail on this broken version.",
        })
    parts = result["checks"] + result["tests"] + result["mutants"]
    n_ok = sum(p["passed"] for p in parts)
    result["passed"] = bool(names) and n_ok == len(parts)
    result["summary"] = f"{n_ok}/{len(parts)} checks passed"
    return result


# ---------------------------------------------------------------------------
# Plan signatures
# ---------------------------------------------------------------------------

def check_signatures(text):
    """Parse 'def name(args) -> ret' lines from a plan. Returns per-line verdicts + stubs."""
    rows = []
    for raw in text.splitlines():
        line = raw.strip()
        if not line or line.startswith("#"):
            continue
        row = {"line": line, "ok": False, "name": None, "problems": [], "stub": ""}
        if not line.startswith("def "):
            row["problems"].append("Start each signature with def, e.g. def f(x: float) -> float")
            rows.append(row)
            continue
        head = line.rstrip(":").rstrip()
        src = head + ":\n    ...\n"
        try:
            fn = ast.parse(src).body[0]
        except SyntaxError as e:
            row["problems"].append(f"Not valid Python yet ({e.msg}). Check brackets, commas, colons.")
            rows.append(row)
            continue
        row["name"] = fn.name
        if not re.fullmatch(r"[a-z_][a-z0-9_]*", fn.name):
            row["problems"].append("Use snake_case for function names.")
        a = fn.args
        params = a.posonlyargs + a.args + a.kwonlyargs
        missing = [p.arg for p in params if p.annotation is None and p.arg not in ("self", "cls")]
        if missing:
            row["problems"].append("Add type hints for: " + ", ".join(missing))
        if fn.returns is None:
            row["problems"].append("Add a return type, e.g. -> float")
        row["ok"] = not row["problems"]
        row["stub"] = f'{head}:\n    """TODO"""\n    ...\n'
        rows.append(row)
    return json.dumps(rows)


# ---------------------------------------------------------------------------
# Self-test: every reference solution must pass its own tests
# ---------------------------------------------------------------------------

def _spec_of(item):
    return {k: item[k] for k in ("setup", "cases", "tests", "checks", "mode", "impl",
                                 "mutants", "minTests", "packages") if k in item}


def _fill(template, answers):
    out = template
    for i, a in enumerate(answers, start=1):
        out = out.replace(f"__{i}__", a)
    return out


def _assemble_parsons(item, order):
    return "\n".join(item["lines"][i] for i in order) + "\n"


def self_test(items_json):
    items = json.loads(items_json)
    report = []
    for it in items:
        problems = []
        t = it["type"]
        try:
            spec = json.dumps(_spec_of(it))
            has_tests = bool(it.get("cases") or it.get("tests") or it.get("mode"))
            if t in ("code", "spotBug"):
                r = json.loads(run_tests(it["solution"], spec))
                if not r["passed"]:
                    problems.append("reference solution fails: " + _why(r))
                if it.get("starter", "").strip():
                    r0 = json.loads(run_tests(it["starter"], spec))
                    if r0["passed"]:
                        problems.append("starter code already passes the tests")
                for w in it.get("selftestWrong", []):
                    rw = json.loads(run_tests(w["code"], spec))
                    if rw["passed"]:
                        problems.append(f"known-wrong version passes: {w.get('note', '')}")
                    elif w.get("expectMessage"):
                        msgs = " ".join(c.get("message", "") for c in rw["cases"])
                        if w["expectMessage"] not in msgs:
                            problems.append(f"diagnosis not shown for: {w.get('note', '')}")
                if t == "spotBug" and it.get("expectError"):
                    rr = json.loads(run_code(it["starter"], it.get("setup", "")))
                    ee = it["expectError"]
                    err = rr["error"] or {}
                    if err.get("type") != ee["type"] or (ee.get("line") and err.get("line") != ee["line"]):
                        problems.append(f"buggy code error is {err.get('type')} line {err.get('line')}, "
                                        f"expected {ee['type']} line {ee.get('line')}")
            elif t == "fillBlank":
                good = _fill(it["code"], [a[0] for a in it["answers"]])
                r = json.loads(run_tests(good, spec))
                if not r["passed"]:
                    problems.append("filled-in answer fails: " + _why(r))
                for k, alts in enumerate(it["answers"], start=1):
                    for alt in alts[1:]:
                        trial = _fill(it["code"], [alt if j == k else a[0]
                                                   for j, a in enumerate(it["answers"], start=1)])
                        if not json.loads(run_tests(trial, spec))["passed"]:
                            problems.append(f"alternative answer {alt!r} for blank {k} fails")
            elif t == "parsons":
                code = _assemble_parsons(it, it["order"])
                if has_tests:
                    r = json.loads(run_tests(code, spec))
                    if not r["passed"]:
                        problems.append("assembled solution fails: " + _why(r))
                    bad = list(it["order"])
                    if len(bad) > 2:
                        bad[1], bad[-1] = bad[-1], bad[1]
                        if json.loads(run_tests(_assemble_parsons(it, bad), spec))["passed"]:
                            problems.append("a shuffled order also passes; tests too weak")
            elif t == "predict":
                r = json.loads(run_code(it["code"]))
                if it.get("expectError"):
                    if r["ok"] or r["error"]["type"] != it["expectError"]:
                        problems.append(f"expected {it['expectError']}, got {r['error'] and r['error']['type']}")
                elif (got := _norm_out(r["stdout"]) if r["ok"] else f"ERROR {r['error']['type']}") != _norm_out(it["answer"]):
                    problems.append(f"actual output {got!r} != stated answer {it['answer']!r}")
                if it.get("choices") and it["answer"] not in it["choices"]:
                    problems.append("answer is not among the choices")
            elif t == "worked":
                if it.get("code"):
                    r = json.loads(run_code(it["code"]))
                    ve = it.get("verifyError")
                    if ve:
                        e = r["error"] or {}
                        if e.get("type") != ve["type"] or e.get("line") != ve.get("line"):
                            problems.append(f"example raises {e.get('type')} line {e.get('line')}, "
                                            f"expected {ve['type']} line {ve.get('line')}")
                    elif not r["ok"]:
                        problems.append(f"worked example errors: {r['error']['type']}: "
                                        f"{r['error']['message']}")
                    elif "verifyOutput" in it and _norm_out(r["stdout"]) != _norm_out(it["verifyOutput"]):
                        problems.append(f"output {r['stdout']!r} != verifyOutput")
            elif t == "plan":
                sigs = json.loads(check_signatures(it["modelPlan"]["signatures"]))
                if not sigs or not all(s["ok"] for s in sigs):
                    problems.append("model plan signatures don't parse cleanly")
                if not it.get("rubric"):
                    problems.append("plan has no rubric")
        except Exception as e:
            problems.append(f"self-test crashed: {type(e).__name__}: {e}")
        report.append({"id": it["id"], "type": t, "ok": not problems, "problems": problems})
    return json.dumps(report)


def _why(r):
    if not r["load"]["ok"]:
        e = r["load"]["error"]
        return f"load error {e['type']}: {e['message']} (line {e['line']})"
    bad = [p for p in r["checks"] + r["cases"] + r["tests"] + r.get("mutants", [])
           if not p["passed"]]
    return "; ".join(
        f"{p.get('label') or p.get('name') or p.get('call')}: {p.get('message')} "
        f"got={p.get('got')} exp={p.get('expected')}"
        for p in bad[:3]
    )

// ===================================================================== runtime
/**
 * Self-hosted packages. Some hosts (claude.ai pages) refuse .zip/.whl files, so the bundle in ./pyodide/
 * ships them renamed *.wasm, listed in bundle.json, and we unpack them into site-packages ourselves.
 * Runs inside the worker (via toString) and on the main thread, so it must be self-contained.
 */
async function bpLoadBundle(py, base, bundle, code, extra, loaded) {
  const want = new Set(extra || []);
  const found = py.pyodide_py.code.find_imports(code);
  for (const mod of found.toJs()) { const pkg = bundle.imports[String(mod).split('.')[0]]; if (pkg) want.add(pkg); }
  found.destroy();
  const order = [];
  const visit = (name) => {
    if (order.includes(name) || loaded.has(name) || !bundle.packages[name]) return;
    (bundle.packages[name].deps || []).forEach(visit);
    order.push(name);
  };
  [...want].forEach(visit);
  const site = py.runPython('import site; site.getsitepackages()[0]');
  for (const name of order) {
    const res = await fetch(base + bundle.packages[name].file);
    if (!res.ok) throw new Error(`could not download ${name} (HTTP ${res.status})`);
    await py.unpackArchive(new Uint8Array(await res.arrayBuffer()), 'wheel', { extractDir: site });
    loaded.add(name);
  }
  if (order.length) py.runPython('import importlib; importlib.invalidate_caches()');
  return order;
}
async function bpFetchBundle(base) {
  if (/cdn\.jsdelivr\.net/.test(base)) return null;
  try { const r = await fetch(base + 'bundle.json'); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

/** Pyodide in a module Web Worker (preferred) or on the main thread (fallback). */
const Runtime = {
  state: 'idle', mode: null, error: '', progress: '', version: '', startedAt: 0,
  worker: null, seq: 0, pending: new Map(), queue: Promise.resolve(), boot: null, mainPy: null,
  listeners: new Set(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  set(state, extra) { this.state = state; Object.assign(this, extra || {}); this.listeners.forEach((fn) => { try { fn(this); } catch (e) { /* ignore */ } }); },
  start() {

    return this.boot;
  },
  get ready() { return this.state === 'ready'; },
  workerSource() {
    return `
      let py = null, bundle = null, base = null;
      const loaded = new Set();
      ${bpLoadBundle.toString()}
      ${bpFetchBundle.toString()}
      const ALLOWED = new Set(['run_code', 'run_tests', 'check_signatures', 'self_test']);
      self.onmessage = async (e) => {
        const { id, cmd, args } = e.data;
        try {
          if (cmd === 'init') {
            let lastErr = null;
            for (const b of args.bases) {
              try {
                self.postMessage({ progress: 'Downloading Python…' });
                const mod = await import(b + 'pyodide.mjs');
                bundle = await bpFetchBundle(b);
                self.postMessage({ progress: 'Starting Python…' });
                py = await mod.loadPyodide(bundle ? { indexURL: b, stdLibURL: b + bundle.stdlib } : { indexURL: b });
                base = b;
                self.postMessage({ progress: 'Loading test harness…' });
                py.runPython(args.harness);
                const v = py.runPython('import sys; sys.version.split()[0]');
                self.postMessage({ id, ok: true, result: v + '|' + b });
                return;
              } catch (err) { lastErr = err; py = null; }
            }
            throw lastErr || new Error('No Pyodide source worked');
          }
          if (cmd === 'load_imports') {
            let added;
            if (bundle) added = await bpLoadBundle(py, base, bundle, args[0], args[1], loaded);
            else {
              const before = new Set(Object.keys(py.loadedPackages));
              await py.loadPackagesFromImports(args[0]);
              if (args[1] && args[1].length) await py.loadPackage(args[1]);
              added = Object.keys(py.loadedPackages).filter((k) => !before.has(k));
            }
            self.postMessage({ id, ok: true, result: JSON.stringify(added) });
            return;
          }
          if (!py || !ALLOWED.has(cmd)) throw new Error('Python not ready');
          const fn = py.globals.get(cmd);
          const result = fn(...args);
          fn.destroy();
          self.postMessage({ id, ok: true, result });
        } catch (err) {
          self.postMessage({ id, ok: false, error: String((err && err.message) || err) });
        }
      };`;
  },
  async _boot() {
    this.startedAt = Date.now();
    this.set('loading', { progress: 'Downloading Python…', error: '' });
    try {
      await this._bootWorker();
      this.set('ready', { mode: 'worker' });
      return true;
    } catch (e1) {
      this._killWorker();
      console.warn('Worker boot failed, trying main thread', e1);
      try {
        this.set('loading', { progress: 'Retrying without a worker…' });
        await this._bootMain();
        this.set('ready', { mode: 'main' });
        return true;
      } catch (e2) {
        console.error(e2);

        this.set('failed', { error: String((e2 && e2.message) || e2 || e1) });

  },
  _bootWorker() {
    return new Promise((resolve, reject) => {

      } catch (e) { reject(e); return; }
      const w = this.worker;
      const timer = setTimeout(() => reject(new Error('Python took more than 90 s to load')), 90000);
      w.onerror = (ev) => { clearTimeout(timer); reject(new Error(ev.message || 'Worker failed to start')); };
      w.onmessage = (e) => {
        const m = e.data;
        if (m.progress) { this.set('loading', { progress: m.progress }); return; }
        if (m.id === 0) {
          clearTimeout(timer);
          URL.revokeObjectURL(url);
          if (m.ok) { [this.version, this.base] = m.result.split('|'); w.onmessage = (ev) => this._onMessage(ev); resolve(); } else reject(new Error(m.error));
        }
      };
      w.postMessage({ id: 0, cmd: 'init', args: { bases: PYODIDE_BASES, harness: HARNESS } });
    });
  },
  async _bootMain() {
    let lastErr = null;
    for (const base of PYODIDE_BASES) {
      try {
        const mod = await import(base + 'pyodide.mjs');
        this.bundle = await bpFetchBundle(base);
        this.set('loading', { progress: 'Starting Python…' });
        this.mainPy = await mod.loadPyodide(this.bundle ? { indexURL: base, stdLibURL: base + this.bundle.stdlib } : { indexURL: base });
        this.mainPy.runPython(HARNESS);
        this.version = this.mainPy.runPython('import sys; sys.version.split()[0]');
        this.base = base;
        return;
      } catch (err) { lastErr = err; this.mainPy = null; }
    }
    throw lastErr || new Error('No Pyodide source worked');
  },
  _onMessage(e) {
    const m = e.data;
    const p = this.pending.get(m.id);
    if (!p) return;
    this.pending.delete(m.id);
    clearTimeout(p.timer);
    if (m.ok) p.resolve(m.result); else p.reject(new Error(m.error));
  },
  _killWorker() {
    if (this.worker) { try { this.worker.terminate(); } catch (e) { /* ignore */ } }
    this.worker = null;
  },
  /** Stop whatever is running: kill the worker and boot a fresh one. */
  restart() {
    this._killWorker();
    this.loaded = new Set();
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.reject(new Error('stopped')); }
    this.pending.clear();
    this.boot = null;
    this.queue = Promise.resolve();
    return this.start();
  },
  call(cmd, args, timeoutMs) {
    const job = this.queue.then(() => this._call(cmd, args, timeoutMs));
    this.queue = job.catch(() => {});
    return job;
  },
  async _call(cmd, args, timeoutMs) {
    const ok = await this.start();
    if (!ok) throw new Error('Python is not available');
    if (this.mode === 'main') {
      await new Promise((r) => setTimeout(r, 30)); // let the UI paint "Running…"
      if (cmd === 'load_imports' && this.bundle) {
        return JSON.stringify(await bpLoadBundle(this.mainPy, this.base, this.bundle, args[0], args[1], this.mainLoaded || (this.mainLoaded = new Set())));
      }
      if (cmd === 'load_imports') {
        const before = new Set(Object.keys(this.mainPy.loadedPackages));
        await this.mainPy.loadPackagesFromImports(args[0]);
        if (args[1] && args[1].length) await this.mainPy.loadPackage(args[1]);
        return JSON.stringify(Object.keys(this.mainPy.loadedPackages).filter((k) => !before.has(k)));
      }
      const fn = this.mainPy.globals.get(cmd);
      try { return fn(...args); } finally { fn.destroy(); }
    }
    return new Promise((resolve, reject) => {
      const id = ++this.seq;
      const timer = setTimeout(() => {
        this.pending.delete(id);
        reject(Object.assign(new Error('timeout'), { timeout: true }));
        this.restart();
      }, timeoutMs);
      this.pending.set(id, { resolve, reject, timer });
      this.worker.postMessage({ id, cmd, args });
    });
  },
  loaded: new Set(),
  pkgMsg: '',
  /** Load numpy/pandas etc. before a run, with its own long timeout (first load can take ~20 s on a phone). */
  async prepare(code, packages = []) {
    const want = /^\s*(import|from)\s+(numpy|pandas)\b/m.test(code) || packages.length;
    if (!want) return;
    const missing = ['numpy', 'pandas'].filter((p) => (packages.includes(p) || new RegExp(`\\b${p}\\b`).test(code)) && !this.loaded.has(p));
    if (missing.length) this.set(this.state, { pkgMsg: `Loading ${missing.join(' and ')} (first time only, can take 20–40 s)…` });
    try {
      const added = JSON.parse(await this.call('load_imports', [code, packages], 180000));
      added.forEach((p) => this.loaded.add(p));
    } catch (e) { /* the run itself will report the import error */ }
    if (this.pkgMsg) this.set(this.state, { pkgMsg: '' });
  },
  async run(code, prelude = '', packages = []) {
    try { await this.prepare(code + '\n' + prelude, packages); return JSON.parse(await this.call('run_code', [code, prelude], RUN_TIMEOUT_MS)); } catch (e) { return this._fail(e); }
  },
  async test(code, spec) {
    try {
      await this.prepare([code, spec.setup || '', spec.impl || ''].join('\n'), spec.packages || []);
      return JSON.parse(await this.call('run_tests', [code, JSON.stringify(spec)], TEST_TIMEOUT_MS));
    } catch (e) { return this._fail(e, true); }
  },
  async sigs(text) { return JSON.parse(await this.call('check_signatures', [text], RUN_TIMEOUT_MS)); },
  async selftest(items) {
    if (items.some((it) => (it.packages || []).length)) await this.prepare('', ['numpy', 'pandas']);
    return JSON.parse(await this.call('self_test', [JSON.stringify(items)], 300000));
  },
  _fail(e, isTest) {
    const timeout = e && e.timeout;
    const stopped = e && e.message === 'stopped';
    const error = {
      type: timeout ? 'Timeout' : stopped ? 'Stopped' : 'RuntimeUnavailable',
      message: timeout ? `Still running after ${(isTest ? TEST_TIMEOUT_MS : RUN_TIMEOUT_MS) / 1000} s, so it was stopped.`
        : stopped ? 'Run stopped.' : String((e && e.message) || e),
      line: null, lineText: null, trace: '',
    };
    return isTest ? { load: { ok: false, error, stdout: '' }, checks: [], cases: [], tests: [], mutants: [], passed: false, summary: '' }
      : { ok: false, stdout: '', error };
  },
};

function specOf(it) {
  const s = {};
  for (const k of ['setup', 'cases', 'tests', 'checks', 'mode', 'impl', 'mutants', 'minTests', 'packages']) if (it[k] !== undefined) s[k] = it[k];
  return s;
}
const hasTests = (it) => !!((it.cases && it.cases.length) || it.tests || it.mode);

// ===================================================================== traceback translator
/** Plain-English explanation of a structured Python error (from the harness). */
function translateError(err) {
  if (!err) return null;
  const t = err.type || '';
  const m = err.message || '';
  const code = err.lineText || '';
  const res = (title, explain, checks = []) => ({ title, explain, checks });
  if (/[‘’“”]/.test(code) || /invalid character '[‘’“”]'/.test(m)) {
    return res('Curly quotes in your code', 'Your phone replaced a straight quote with a curly one. Python only accepts straight quotes.',
      ['Use the " and \' keys on the bar above the keyboard.', 'Or turn off Settings → General → Keyboard → Smart Punctuation.']);
  }
  switch (t) {
    case 'Timeout':
      return res('It never finished', 'The code ran for too long, which usually means a loop that never ends.',
        ['Does every while loop change the thing its condition checks?', 'Are you appending to the list you are looping over?']);
    case 'Stopped': return res('Stopped', 'You stopped the run.');
    case 'RuntimeUnavailable': return res('Python isn’t available', m, ['Check your connection, then tap the Python pill at the top to retry.']);
    case 'IndentationError': case 'TabError':
      if (/expected an indented block/.test(m)) return res('Missing indented block', 'A line ending in : (def, if, for…) must be followed by at least one indented line.', ['Indent the body by 4 spaces, or put pass as a placeholder.']);
      if (/unexpected indent/.test(m)) return res('Unexpected indent', 'This line is indented more than Python expects.', ['Line it up with the block it belongs to.']);
      if (/unindent does not match/.test(m)) return res('Indentation doesn’t line up', 'This line’s indent doesn’t match any outer block.', ['Use multiples of 4 spaces consistently.']);
      return res('Indentation problem', m, ['Check the indent of this line and the one above.']);
    case 'SyntaxError':
      if (/was never closed/.test(m)) return res('Unclosed bracket', `${m}. Python reached the end of the line or file still inside a bracket.`, ['Count opening and closing brackets on this line and the ones above.']);
      if (/unterminated string/.test(m)) return res('Unclosed string', 'A string starts with a quote but never ends.', ['Add the matching quote.']);
      if (/expected ':'/.test(m)) return res('Missing colon', 'def, if, elif, else, for, while, with, try and class lines must end with a colon.', []);
      if (/forgot a comma/.test(m)) return res('Missing comma?', 'Python found two values side by side with nothing between them.', ['Check the commas in this list, dict or call.']);
      if (/'return' outside function/.test(m)) return res('return outside a function', 'This return isn’t indented inside a def.', ['Indent it into the function body.']);
      return res('Python can’t parse this line', m || 'The line isn’t valid Python.', ['Look at this line and the one just before it: brackets, colons, quotes.']);
    case 'NameError': {
      const name = (m.match(/name '([^']+)'/) || [])[1];
      return res(`Unknown name${name ? ` “${name}”` : ''}`, 'Python doesn’t know this name at the point it runs.',
        ['Typo or wrong case? (Weights vs weights)', 'Defined later, or inside another function?', 'Missing an import?'].concat(/Did you mean/.test(m) ? [m.slice(m.indexOf('Did you mean'))] : []));
    }
    case 'TypeError':
      if (/can't multiply sequence by non-int/.test(m)) return res('Text × number', 'You multiplied a string (or list) by a float. Often a number that is still text, e.g. "0.021".', ['Convert with float(...) where the data comes in.']);
      if (/can only concatenate str/.test(m) || /unsupported operand type\(s\) for \+: '(int|float)' and 'str'/.test(m)) return res('Mixing text and numbers', 'You used + between a str and a number.', ['Build strings with an f-string: f"{value:.2%}"', 'Or convert the text with float(...).']);
      if (/NoneType/.test(m)) return res('Something is None', 'A value you used is None, usually because a function has no return statement (or list.sort() was used as if it returned the list).', ['Check the function that produced this value returns something.']);
      if (/missing \d+ required positional argument/.test(m)) return res('Missing argument', m, ['Compare the call with the def line: count the arguments.']);
      if (/takes \d+ positional arguments? but \d+ (were|was) given/.test(m)) return res('Too many arguments', m, ['Methods get self automatically; check the call matches the def.']);
      if (/object is not callable/.test(m)) return res('Calling something that isn’t a function', m, ['Did a variable reuse a function’s name (e.g. sum = …)?', 'Square brackets [] vs round () for indexing?']);
      if (/not subscriptable/.test(m)) return res('Indexing something that can’t be indexed', m, ['Is this value what you think it is? print(type(x))']);
      if (/unsupported operand/.test(m)) return res('Wrong types for this operator', m, ['print(type(...)) on both sides of the operator.']);
      return res('Wrong type', m, ['print(type(x)) for the values on this line.']);
    case 'KeyError':
      return res(`Missing key ${m}`, 'You looked up a key that isn’t in the dict.',
        ['Spelling and case: "Gilts" ≠ "GILTS".', 'Is the data incomplete? Decide: fix the data, raise a clear error, or use .get() only if missing truly means zero.']);
    case 'IndexError':
      return res('Index out of range', 'You asked for a position past the end of a list (or the list is empty).', ['Lists run from 0 to len − 1.', 'Can the list be empty here?', 'Prefer for x in items: over index loops.']);
    case 'AttributeError':
      if (/NoneType/.test(m)) return res('Something is None', 'You called a method on None. A function probably returned nothing.', ['Check for a missing return.']);
      return res('No such attribute or method', m, ['Check the spelling, and the type: print(type(x))']);
    case 'ValueError':
      if (/too many values to unpack|not enough values to unpack/.test(m)) return res('Unpacking mismatch', `${m}. The number of names on the left doesn’t match the items on the right.`, ['Looping over a dict? Use .items() to get (key, value) pairs.']);
      if (/could not convert string to float/.test(m)) return res('Not a number', m, ['Strip spaces and % signs before float(), or handle the error with try/except.']);
      return res('Bad value', `${m}. Right type, unacceptable value. If you raised this yourself, your guard rail fired: read the message.`, []);
    case 'ZeroDivisionError':
      return res('Division by zero', 'You divided by zero, often the length of an empty list or a zero total.', ['Guard the case first: if not values: …']);
    case 'RecursionError':
      return res('Infinite recursion', 'A function keeps calling itself without stopping.', ['Check the base case.']);
    case 'ModuleNotFoundError':
      return res('Module not available', `${m}. In this browser version only the standard library is loaded.`, ['numpy and pandas arrive with later modules.']);
    case 'AssertionError':
      return res('An assertion failed', m || 'An assert statement was False.', ['Compare the expected and actual values.']);
    case 'RuntimeError':
      if (/input\(\) isn't available/.test(m)) return res('input() isn’t available', m, []);
      return res('Runtime error', m, []);
    case 'StopIteration':
      return res('Ran out of items', 'next() was called on an empty iterator.', []);
    default:
      return res(t || 'Error', m, ['Read the last line of the traceback first, then the line number in your code.']);
  }
}

function Editor({ value = '', onChange, onRun, label = 'Code editor', minLines = 8, readOnly = false }) {

    'aria-label': label, 'data-gramm': 'false', 'data-enable-grammarly': 'false', translate: 'no',
  });

  const wrap = h('div', { class: 'editor' + (readOnly ? ' readonly' : '') }, gutter, ta);
  let escaped = false;

  const refresh = () => {
    const n = Math.max(ta.value.split('\n').length, readOnly ? 1 : minLines);
    let s = '';
    for (let i = 1; i <= n; i++) s += i + '\n';
    gutter.textContent = s;
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';

    const s = ta.selectionStart;

    if (readOnly) return;

    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && onRun) { e.preventDefault(); onRun(); }

    if (SMART_RE.test(ta.value)) {

    el: wrap, ta, onRun,
    get value() { return ta.value; },
    set value(v) { ta.value = v; refresh(); },

}

// ===================================================================== progress & scheduling
function deviceMode() {
  const s = Store.d.settings.device;
  if (s === 'phone' || s === 'laptop') return s;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  return coarse && Math.min(window.screen.width, window.screen.height) < 700 ? 'phone' : 'laptop';
}
function suitsDevice(it) { return deviceMode() === 'laptop' || it.device !== 'laptop'; }

function schedule(rec, outcome) {
  if (outcome === 'up') rec.box = Math.min(5, Math.max(1, rec.box + 1));
  else if (outcome === 'stay') rec.box = Math.max(1, rec.box);
  else rec.box = 1;
  rec.due = addDays(today(), LEITNER_DAYS[rec.box]);
}
function bumpStreak() {
  const s = Store.d.streak;
  const d = today();
  if (s.lastDay === d) return;
  s.current = s.lastDay === addDays(d, -1) ? s.current + 1 : 1;
  s.best = Math.max(s.best, s.current);
  s.lastDay = d;
}
function baseXP(it) {
  if (it.type === 'flashcard' || it.type === 'predict') return 3;
  if (it.type === 'worked') return 5;
  if (it.type === 'plan') return [0, 6, 8, 10, 14, 25][it.stage];
  return [0, 6, 8, 12, 18, 30][it.stage];
}

/**
 * Record the end of an item attempt. outcome = { passed, level (0-4), selfRate, overTime, gaveUp }.
 * Returns { xp, advanced } for display.
 */
function recordResult(it, S, outcome) {
  const rec = Store.item(it.id);
  const level = outcome.level || 0;
  rec.lastHint = level;
  let xp = 0;
  let advanced = null;
  if (S.diag) {
    Store.log({ id: it.id, k: outcome.passed ? 'diag-pass' : 'diag-fail' });
    Store.save();
    return { xp, advanced };
  }
  if (outcome.tapOnly) {
    // Spot-the-bug done by tapping only: retrieval practice, not a solve. The fix stays open for a keyboard session.
    rec.tapAt = today();
    xp = outcome.passed ? 2 : 0;
    Store.d.xp += xp;
    if (outcome.passed) bumpStreak();
    Store.log({ id: it.id, k: outcome.passed ? 'tap-pass' : 'tap-fail' });
    Store.save();
    return { xp, advanced };
  }
  if (it.stage === 5 && (it.timeLimitSec) && GATE_TYPES.includes(it.type)) {
    rec.blank.tries++;
    const win = outcome.passed && level === 0 && !outcome.overTime;
    if (win) rec.blank.wins++;
    Store.log({ id: it.id, k: 'blank', win });
  }
  if (outcome.passed) {
    rec.solves++;
    rec.lastPassed = Date.now();
    rec.bestHint = rec.bestHint == null ? level : Math.min(rec.bestHint, level);
    rec.draft = null;
    xp = Math.round(baseXP(it) * HINT_FACTOR[level] + (outcome.explained ? 2 : 0) + (it.stage === 5 && !outcome.overTime && level === 0 ? 10 : 0));
    Store.d.xp += xp;
    bumpStreak();
    if (hasHints(it) || isGate(it)) Store.log({ id: it.id, k: 'solve', lvl: level, sk: CONCEPTS.get(it.concepts[0]).skill });
    // Concept stage advance (gate items only, at the concept's current stage, low hints).
    if (isGate(it) && level <= 1 && outcome.selfRate !== 'missed' && (it.stage < 5 || (level === 0 && !outcome.overTime))) {
      for (const cid of it.concepts) {
        const c = Store.d.concepts[cid] || (Store.d.concepts[cid] = { stage: 1 });
        if (c.stage === it.stage) { c.stage = it.stage + 1; advanced = { concept: CONCEPTS.get(cid).name, stage: c.stage }; }
        c.weak = false;
      }
    }
  } else {
    Store.log({ id: it.id, k: 'fail', lvl: level, sk: CONCEPTS.get(it.concepts[0]).skill });
  }
  if (level >= 3) for (const cid of it.concepts) (Store.d.concepts[cid] || (Store.d.concepts[cid] = { stage: 1 })).weak = true;
  // Leitner
  let move = 'reset';
  if (outcome.passed && level === 0 && outcome.selfRate !== 'missed' && outcome.selfRate !== 'partly' && !outcome.overTime) move = 'up';
  else if (outcome.passed && level <= 2 && outcome.selfRate !== 'missed') move = 'stay';
  schedule(rec, move);
  // Solution viewed → redo from memory tomorrow.
  if (level === 4) {
    Store.d.redo = Store.d.redo.filter((r) => r.id !== it.id);
    Store.d.redo.push({ id: it.id, due: addDays(today(), 1) });
  } else if (outcome.passed && S.redo) {
    Store.d.redo = Store.d.redo.filter((r) => r.id !== it.id);
  }
  Store.save();
  return { xp, advanced };
}

function dueReviews() {
  const d = today();
  const out = [];
  for (const [id, rec] of Object.entries(Store.d.items)) {
    const it = ITEMS.get(id);
    if (!it || it.diagnostic || !rec.due || rec.due > d || !isAvailable(it)) continue;
    out.push({ it, rec });
  }
  out.sort((a, b) => a.rec.box - b.rec.box || (a.rec.due < b.rec.due ? -1 : 1));
  return out;
}
function dueRedos() {
  const d = today();
  return Store.d.redo.filter((r) => r.due <= d && ITEMS.has(r.id)).map((r) => ITEMS.get(r.id));
}
function newCandidates() {
  // Unseen, available items in lesson order; gate items below the learner's current stage are skipped
  // (already demonstrated via placement or later work).
  const out = [];
  for (const l of LESSONS) {
    for (const s of l.steps) {
      if (s.kind !== 'item') continue;
      const it = ITEMS.get(s.ref);
      const rec = Store.d.items[it.id];
      if (rec && (rec.due || rec.solves > 0)) continue; // opened-but-abandoned items stay 'new'
      if (!isAvailable(it)) continue;
      if (isGate(it) && it.stage < minStage(it)) continue;
      out.push({ it, lesson: l });
    }
  }
  return out;
}
function buildSession(minutes) {
  const queue = [];
  let used = 0;
  const seen = new Set();
  const add = (it, why) => {
    if (seen.has(it.id) || !suitsDevice(it)) return;
    const m = estMinutes(it);
    if (queue.length && used + m > minutes) return;
    queue.push({ kind: 'item', ref: it.id, why, redo: why === 'redo' });
    seen.add(it.id);
    used += m;
  };
  for (const it of dueRedos()) add(it, 'redo');
  for (const { it } of dueReviews().slice(0, 12)) add(it, 'review');
  // New material: interleave the first two lessons that still have unseen items.
  const fresh = newCandidates();
  const byLesson = new Map();
  for (const f of fresh) { if (!byLesson.has(f.lesson.id)) byLesson.set(f.lesson.id, []); byLesson.get(f.lesson.id).push(f.it); }
  const lanes = [...byLesson.values()].slice(0, 2);
  const pattern = [0, 0, 1];
  let p = 0;
  let guard = 0;
  while (used < minutes && lanes.some((l) => l.length) && guard++ < 50) {
    const lane = lanes[pattern[p++ % pattern.length]] || lanes[0];
    const next = (lane && lane.length ? lane : lanes.find((l) => l.length)).shift();
    const before = queue.length;
    add(next, 'new');
    if (queue.length === before && used >= minutes) break;
  }
  return { queue, minutes: Math.round(used) };
}

const TAP_TYPES = ['flashcard', 'predict', 'parsons', 'spotBug'];
const tapMinutes = (it) => ({ flashcard: 0.5, predict: 1, parsons: 1.5, spotBug: 1.5 }[it.type] || 1);
/** Commute session: only items you can do by tapping, one-handed, without Python if need be. */
function buildCommute(minutes) {
  const queue = [];
  let used = 0;
  const seen = new Set();
  const add = (it, why) => {
    if (seen.has(it.id) || !TAP_TYPES.includes(it.type) || it.diagnostic) return false;
    const m = tapMinutes(it);
    if (queue.length && used + m > minutes) return false;
    queue.push({ kind: 'item', ref: it.id, why });
    seen.add(it.id);
    used += m;
    return true;
  };
  for (const { it } of dueReviews()) add(it, 'review');
  // New tap items, round-robin across lessons so topics interleave.
  const lanes = LESSONS.map((l) => l.steps.filter((s) => s.kind === 'item').map((s) => ITEMS.get(s.ref))
    .filter((it) => TAP_TYPES.includes(it.type) && isAvailable(it) && (it.type === 'spotBug'
      ? !(Store.d.items[it.id] || {}).solves && (Store.d.items[it.id] || {}).tapAt !== today()
      : !(Store.d.items[it.id] || {}).due && !(Store.d.items[it.id] || {}).solves)))
    .filter((l) => l.length).slice(0, 3);
  let guard = 0;
  while (used < minutes && lanes.some((l) => l.length) && guard++ < 60) {
    for (const lane of lanes) { if (lane.length) add(lane.shift(), 'new'); }
  }
  // Still time left: extra recall on the oldest-practised tap items.
  if (used < minutes) {
    const old = Object.entries(Store.d.items).map(([id, r]) => ({ it: ITEMS.get(id), r }))
      .filter(({ it, r }) => it && !it.diagnostic && TAP_TYPES.includes(it.type) && it.type !== 'spotBug' && r.solves > 0)
      .sort((a, b) => (a.r.lastPassed || 0) - (b.r.lastPassed || 0));
    for (const { it } of old) add(it, 'review');
  }
  return { queue, minutes: Math.round(used) };
}

/** Weekly no-AI challenge: one per ISO week, rotating through the list. */
function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
}
function thisWeeksChallenge() {
  const list = CONTENT.challenges || [];
  if (!list.length) return null;
  const done = Store.d.challenges || {};
  // First undone challenge in order; the week number only rotates once all are done.
  const open = list.find((c) => !(done[c.id] && done[c.id].doneAt));
  const { week } = isoWeek();
  return open || list[week % list.length];
}

// ===================================================================== stats
function computeStats() {
  const ev = Store.d.events;
  const solves = ev.filter((e) => e.k === 'solve');
  const indep = solves.length ? solves.filter((e) => e.lvl <= 1).length / solves.length : null;
  const blanks = ev.filter((e) => e.k === 'blank');
  const blankRate = blanks.length ? blanks.filter((e) => e.win).length / blanks.length : null;
  const skillScores = CONTENT.skills.map((s) => {
    const recent = ev.filter((e) => (e.k === 'solve' || e.k === 'fail') && e.sk === s.id).slice(-20);
    const fails = recent.filter((e) => e.k === 'fail').length;
    const avgHint = recent.length ? recent.reduce((a, e) => a + (e.k === 'fail' ? 4 : e.lvl), 0) / recent.length : null;
    const concepts = CONTENT.concepts.filter((c) => c.skill === s.id);
    const stage = concepts.length ? concepts.reduce((a, c) => a + Math.min(stageOf(c.id), 6), 0) / concepts.length : 0;
    return { skill: s, n: recent.length, fails, avgHint, stage };
  });
  const weakest = skillScores.filter((s) => s.n >= 2 && (s.avgHint >= 1 || s.fails > 0))
    .sort((a, b) => ((b.avgHint == null ? 0 : b.avgHint) - (a.avgHint == null ? 0 : a.avgHint)) || (a.stage - b.stage)).slice(0, 2);
  const d = today();
  let week = 0;
  for (let i = 0; i < 7; i++) week += Store.d.timeLog[addDays(d, -i)] || 0;
  return { solves: solves.length, indep, blanks: blanks.length, blankRate, skillScores, weakest, week, todaySec: Store.d.timeLog[d] || 0 };
}
