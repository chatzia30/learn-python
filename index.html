  if (right) tb.append(right);
  tb.append(pyPill());
  if (!back) tb.append(h('a', { class: 'icon-btn', href: '#/settings', 'aria-label': 'Settings' }, '⚙︎'));
}
function pyPill() {
  const pill = h('button', { class: 'py-pill', type: 'button', 'aria-live': 'polite' });
  const paint = () => {
    pill.className = 'py-pill ' + Runtime.state;
    const label = { idle: 'Python', loading: 'Loading…', ready: `Python ${Runtime.version || ''}`.trim(), failed: 'Python failed' }[Runtime.state];
    pill.innerHTML = '';
    pill.append(h('span', { class: 'dot' }), label);
  };
  paint();
  const off = Runtime.on(paint);
  pill.addEventListener('click', () => {
    if (Runtime.state === 'failed') Runtime.start(); else go('settings');
  });
  // Detach listener when the pill leaves the DOM.
  const mo = new MutationObserver(() => { if (!document.body.contains(pill)) { off(); mo.disconnect(); } });
  mo.observe(document.body, { childList: true, subtree: true });
  return pill;
}
function runtimeNotice() {
  // Shown inside items that need Python while it loads or after it fails.
  const box = h('div');
  const paint = () => {
    box.innerHTML = '';
    if (Runtime.state === 'ready' && Runtime.pkgMsg) {
      box.append(h('div', { class: 'card warn small' }, h('span', { class: 'spinner' }), ' ', Runtime.pkgMsg));
      return;
    }
    if (Runtime.state === 'ready') return;
    if (Runtime.state === 'failed') {
      box.append(h('div', { class: 'card bad' },
        h('strong', null, 'Python couldn’t load. '),
        'Code exercises need it. Flashcards, predict-the-output, plans and plain Parsons still work. ',
        h('div', { class: 'small muted' }, `Check your connection (the first load downloads several MB), that Safari is up to date, and that content blockers allow cdn.jsdelivr.net. Detail: ${Runtime.error}`),
        h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn small', onclick: () => Runtime.start() }, 'Retry'))));
    } else {
      const secs = Math.round((Date.now() - Runtime.startedAt) / 1000);
      box.append(h('div', { class: 'card warn small' }, h('span', { class: 'spinner' }), ` ${Runtime.progress || 'Loading Python…'} ${Runtime.startedAt ? `(${secs} s)` : ''}`,
        h('div', { class: 'muted' }, 'First load downloads several MB; after that it comes from the browser cache. You can read the task meanwhile.')));
    }
  };
  paint();
  const off = Runtime.on(paint);
  const iv = setInterval(() => { if (!document.body.contains(box)) { off(); clearInterval(iv); } else if (Runtime.state === 'loading') paint(); }, 1000);
  return box;
}

// ===================================================================== item player
const Player = {
  ctx: null, S: null, editorActions: null, timerIv: null,
  /** ctx: { title, steps: [{kind:'item', ref} | {kind:'explain', md}], index, mode, origin } */
  open(ctx) {
    this.ctx = Object.assign({ index: 0, mode: 'single', results: [], xp: 0, origin: currentRoute === 'play' ? 'today' : currentRoute }, ctx);
    document.body.classList.add('playing');
    go('play');
    this.saveResume();
    this.render();
  },
  close() {
    this.cleanup();
    document.body.classList.remove('playing');
    const origin = (this.ctx && this.ctx.origin) || 'today';
    this.ctx = null;
    go(origin === 'play' ? 'today' : origin);
  },
  cleanup() {
    clearInterval(this.timerIv);
    this.timerIv = null;
    this.editorActions = null;
    Keybar.hide();
    if (this.S && !this.S.done && this.S.saveDraft) this.S.saveDraft();
    this.S = null;
  },
  next() {
    this.cleanup();
    this.ctx.index++;
    if (this.ctx.index >= this.ctx.steps.length) { Store.d.resume = null; Store.saveNow(); this.renderSummary(); } else { this.saveResume(); this.render(); }
    window.scrollTo(0, 0);
  },
  /** Keep the queue so a session interrupted by a dead tunnel or a closed tab can be picked up again. */
  saveResume() {
    const c = this.ctx;
    if (!c || c.mode === 'single' || c.steps.length < 2) return;
    Store.d.resume = { title: c.title, mode: c.mode, steps: c.steps, index: c.index, at: Date.now() };
    Store.saveNow();
  },
  render() {
    const ctx = this.ctx;
    const step = ctx.steps[ctx.index];
    const main = $('#main');
    main.innerHTML = '';
    const progress = ctx.steps.length > 1 ? `${ctx.index + 1}/${ctx.steps.length}` : '';
    if (step.kind === 'explain') {
      setTopbar({ title: ctx.title, back: () => this.close(), right: progress ? h('span', { class: 'chip' }, progress) : null });
      main.append(h('div', { class: 'card' }, md(step.md)));
      this.footer([h('span', { class: 'grow' }), h('button', { class: 'btn primary', onclick: () => this.next() }, 'Got it')]);
      return;
    }
    const it = ITEMS.get(step.ref);
    const rec = Store.item(it.id);
    rec.sessions++;
    if (!rec.firstSeen) rec.firstSeen = Date.now();
    Store.save();
    const S = this.S = {
      item: it, rec, diag: ctx.mode === 'diagnostic', tapOnly: ctx.mode === 'commute', redo: !!step.redo, attempts: 0, lastAttempt: null,
      hintsOpened: 0, sinceHint: 0, solutionShown: false, done: false, overTime: false, startedAt: Date.now(),
      explained: false,
    };
    const timerEl = it.timeLimitSec && !S.diag ? h('span', { class: 'timer', role: 'timer' }, fmtClock(it.timeLimitSec)) : null;
    setTopbar({ title: itemTitle(it), back: () => this.close(), right: progress ? h('span', { class: 'chip' }, progress) : null });
    const head = h('div', { class: 'player-head' },
      h('span', { class: 'chip accent' }, typeLabel(it.type)),
      isGate(it) && !S.diag ? h('span', { class: 'chip' }, `Stage ${it.stage} · ${STAGE_NAMES[it.stage]}`) : null,
      h('span', { class: 'chip' }, deviceLabel(it.device)),
      step.why === 'review' ? h('span', { class: 'chip warn' }, 'Review') : null,
      step.redo ? h('span', { class: 'chip bad' }, 'Redo from memory') : null,
      S.diag ? h('span', { class: 'chip warn' }, 'Placement: no hints') : null,
      S.tapOnly && it.type === 'spotBug' ? h('span', { class: 'chip' }, 'Tap-only: fix it later on a keyboard') : null,
      (it.packages || []).length ? h('span', { class: 'chip' }, it.packages.join(' + ')) : null,
      timerEl,
    );
    main.append(head);
    if (timerEl) {
      this.timerIv = setInterval(() => {
        const left = it.timeLimitSec - (Date.now() - S.startedAt) / 1000;
        timerEl.textContent = fmtClock(left);
        if (left <= 0 && !S.overTime) {
          S.overTime = true;
          timerEl.classList.add('over');
          toast('Time’s up. Keep going, but this attempt won’t count as a blank-page win.', 4000);
          if (S.refreshHints) S.refreshHints();
        }
      }, 1000);
    }
    const body = h('div');
    main.append(body);
    if ((it.packages || []).length && !S.tapOnly) Runtime.prepare('', it.packages);
    const R = RENDERERS[it.type];
    R(it, S, body);
    main.focus({ preventScroll: true });
  },
  footer(nodes) {
    const main = $('#main');
    const old = $('.footer-actions', main);
    if (old) old.remove();
    main.append(h('div', { class: 'footer-actions' }, nodes));
  },
  renderSummary() {
    const ctx = this.ctx;
    const main = $('#main');
    main.innerHTML = '';
    setTopbar({ title: ctx.title, back: () => this.close() });
    if (ctx.mode === 'diagnostic') { renderDiagnosticResults(ctx); return; }
    const res = ctx.results;
    const solved = res.filter((r) => r.passed).length;
    const lowHint = res.filter((r) => r.passed && r.level <= 1 && r.hintable).length;
    const hintable = res.filter((r) => r.hintable).length;
    main.append(h('div', { class: 'card ok' },
      h('h2', null, 'Done'),
      h('p', null, `${solved}/${res.length} completed · +${ctx.xp} XP`),
      hintable ? h('p', null, `Independence this session: ${lowHint}/${hintable} solved with no or one hint.`) : null,
      ctx.advances && ctx.advances.length ? h('ul', null, ctx.advances.map((a) => h('li', null, `${a.concept}: now ${a.stage >= 6 ? 'mastered' : 'stage ' + a.stage}`))) : null,
    ));
    this.footer([h('span', { class: 'grow' }), h('button', { class: 'btn primary', onclick: () => this.close() }, 'Finish')]);
  },
  /** Called by renderers when an item is complete. */
  finish(it, S, outcome) {
    if (S.done) return { xp: 0, advanced: null };
    S.done = true;
    clearInterval(this.timerIv);
    const level = S.solutionShown ? 4 : S.hintsOpened;
    outcome = Object.assign({ level, overTime: S.overTime, explained: S.explained }, outcome);
    const { xp, advanced } = recordResult(it, S, outcome);
    if (S.refreshHints) S.refreshHints();
    this.ctx.results.push({ id: it.id, passed: outcome.passed, level, hintable: hasHints(it) && !S.diag });
    this.ctx.xp += xp;
    if (advanced) (this.ctx.advances || (this.ctx.advances = [])).push(advanced);
    return { xp, advanced };
  },
};

/** Hint panel with the attempt-first, three-tier, solution-last rules. */
function HintPanel(it, S, { solutionText, onSolution }) {
  const box = h('div');
  const shown = h('div');
  const btnRow = h('div', { class: 'row', style: 'margin:8px 0' });
  box.append(shown, btnRow);
  const tiers = ['Guiding question', 'Approach', 'Skeleton'];
  const paint = () => {
    btnRow.innerHTML = '';
    if (S.diag || S.done) return;
    const n = (it.hints || []).length;
    if (!n) {
      // Stage 5: no hints. Solution only once time is up and at least one attempt has been made.
      if (it.stage === 5 && solutionText && S.attempts > 0 && S.overTime && !S.solutionShown) {
        btnRow.append(h('button', { class: 'btn small ghost', onclick: showSolution }, 'Show solution (counts as fully assisted)'));
      } else if (it.stage === 5) {
        btnRow.append(h('span', { class: 'small muted' }, 'Blank page: no hints. A solution unlocks after time’s up and at least one attempt.'));
      }
      return;
    }
    if (S.hintsOpened < n) {
      const canOpen = S.hintsOpened === 0 ? S.attempts >= 1 : S.sinceHint >= 1;
      btnRow.append(h('button', { class: 'btn small', disabled: !canOpen, onclick: openHint },
        canOpen ? `Hint ${S.hintsOpened + 1} of ${n}: ${tiers[S.hintsOpened] || ''}` : (S.hintsOpened === 0 ? '🔒 Hints unlock after your first attempt' : '🔒 Next hint unlocks after another attempt')));
    } else if (solutionText && !S.solutionShown) {
      const can = S.sinceHint >= 1;
      btnRow.append(h('button', { class: 'btn small ghost', disabled: !can, onclick: showSolution },
        can ? 'Show solution (you’ll redo it tomorrow)' : '🔒 Solution unlocks after one more attempt'));
    }
  };
  function openHint() {
    const i = S.hintsOpened;
    S.hintsOpened++;
    S.sinceHint = 0;
    const text = it.hints[i];
    const isCode = /\n/.test(text) && i === 2;
    shown.append(h('div', { class: 'hint' }, h('div', { class: 'ht' }, `Hint ${i + 1} · ${tiers[i]}`), isCode ? h('pre', null, text) : h('div', null, text)));
    Store.log({ id: it.id, k: 'hint', lvl: S.hintsOpened });
    Store.save();
    paint();
  }
  function showSolution() {
    S.solutionShown = true;
    Store.log({ id: it.id, k: 'solution' });
    shown.append(h('div', { class: 'card warn' }, h('strong', null, 'Reference solution'),
      h('pre', { class: 'code-block' }, solutionText),
      h('p', { class: 'small' }, 'Read it, close it, then type your own version from memory. It’s back in your queue tomorrow with hints locked.')));
    if (onSolution) onSolution();
    paint();
  }
  S.registerAttempt = (snapshot) => {
    const norm = normCode(snapshot);
    if (S.lastAttempt === norm) return false;
    S.lastAttempt = norm;
    S.attempts++;
    S.sinceHint++;
    S.rec.attempts++;
    Store.log({ id: it.id, k: 'attempt' });
    Store.save();
    paint();
    return true;
  };
  S.refreshHints = paint;
  paint();
  return box;
}

/** Explain-back, then the model explanation and a self-rating. */
function ExplainBack(it, S, prompt, onRated, { required = true } = {}) {
  const box = h('div', { class: 'card accent' });
  const ta = autoGrow(h('textarea', { class: 'plain', rows: 4, placeholder: 'In your own words…', 'aria-label': 'Your explanation' }));
  const btn = h('button', { class: 'btn primary', disabled: required }, 'Submit explanation');
  ta.addEventListener('input', () => { btn.disabled = required && ta.value.trim().length < 20; });
  box.append(h('h3', null, 'Explain it back'), h('p', { class: 'small' }, prompt || 'Why does this work? Two or three sentences, your own words.'), ta,
    h('div', { class: 'row', style: 'margin-top:8px' }, btn, !required ? h('span', { class: 'small muted' }, 'On the move? Submit empty to just read the model answer.') : h('span', { class: 'small muted' }, 'At least a sentence.')));
  btn.addEventListener('click', () => {
    S.explained = ta.value.trim().length >= 20;
    if (ta.value.trim()) { S.rec.explains.push({ at: Date.now(), text: ta.value.trim().slice(0, 2000) }); S.rec.explains = S.rec.explains.slice(-5); Store.save(); }
    ta.readOnly = true;
    btn.remove();
    box.append(h('h3', null, 'Model explanation'), h('p', null, it.explanation || ''),
      (it.financeNotes || []).length ? h('div', { class: 'card warn small' }, h('strong', null, 'Convention check'), h('ul', null, it.financeNotes.map((n) => h('li', null, n)))) : null,
      h('p', { class: 'small', style: 'margin-top:10px' }, 'How close was yours?'));
    const rate = h('div', { class: 'rate' });
    [['got', 'Got it'], ['partly', 'Partly'], ['missed', 'Missed it']].forEach(([k, label]) => {
      rate.append(h('button', { class: 'btn', onclick: () => { [...rate.children].forEach((b) => b.disabled = true); onRated(k); } }, label));
    });
    box.append(rate);
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  return box;
}

function nextButton() {
  const last = !Player.ctx || Player.ctx.index + 1 >= Player.ctx.steps.length;
  return h('button', { class: 'btn primary', onclick: () => Player.next() }, last ? 'Finish' : 'Next →');
}

/** After a pass: optional explain-back → finish → Next button. */
function completeItem(it, S, area, { passed = true, explain = true, tapOnly = false } = {}) {
  const proceed = (selfRate) => {
    const { xp, advanced } = Player.finish(it, S, { passed, selfRate, tapOnly });
    area.append(h('div', { class: 'card ' + (passed ? 'ok' : '') },
      passed ? h('strong', null, `+${xp} XP`) : h('strong', null, 'Logged. It’ll come back soon.'),
      advanced ? h('div', null, `${advanced.concept} → ${advanced.stage >= 6 ? 'mastered' : 'stage ' + advanced.stage} (${STAGE_NAMES[advanced.stage] || ''})`) : null));
    Player.footer([h('span', { class: 'grow' }), nextButton()]);
    area.lastChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  if (S.diag || tapOnly || !explain || !passed) { proceed(null); return; }
  area.append(ExplainBack(it, S, null, proceed, { required: !S.tapOnly }));
}

function testsPreview(it) {
  const cases = it.cases || [];
  const vis = cases.filter((c) => c.visible !== false);
  const hidden = cases.length - vis.length;
  if (!cases.length || it.stage === 5) return hidden && it.stage === 5 ? h('p', { class: 'small muted' }, `${cases.length} hidden tests run when you Check.`) : null;
  return h('div', { class: 'tests' },
    h('div', { class: 'small muted' }, it.stage === 4 ? 'Only the tests are given. Make them pass:' : 'Tests:'),
    vis.map((c) => h('div', { class: 't' }, c.label ? h('span', { class: 'lbl' }, c.label) : null,
      c.kind === 'raises' ? `${c.call}  → raises ${c.raises}${c.match ? ` (mentions ${c.match})` : ''}`
        : c.kind === 'stdout' ? `run the file → prints:\n${c.expect}`
          : c.kind === 'silent' ? 'import the file → prints nothing'
            : c.kind === 'stdoutHas' ? `run the file → output contains ${c.contains.join(', ')}`
              : `${c.call}  → ${c.expect}`)),
    hidden ? h('div', { class: 'small muted' }, `+ ${hidden} hidden test${hidden > 1 ? 's' : ''}`) : null);
}

function renderTestResult(r, { showValues = true } = {}) {
  const box = h('div', { class: 'results', 'aria-live': 'polite' });
  if (!r.load.ok) {
    box.append(h('div', { class: 'summary fail' }, '✗ Your code didn’t run'), errorCard(r.load.error));
    if (r.load.stdout) box.append(h('div', { class: 'out' }, r.load.stdout));
    return box;
  }
  box.append(h('div', { class: 'summary ' + (r.passed ? 'pass' : 'fail') }, (r.passed ? '✓ ' : '✗ ') + r.summary));
  const row = (p, title, extra) => h('div', { class: 'result-row ' + (p.passed ? 'pass' : 'fail') },
    h('div', { class: 'rt' }, (p.passed ? '✓ ' : '✗ ') + title), extra, p.message && !p.passed ? h('div', { class: 'small', style: 'margin-top:4px' }, p.message) : null,
    p.error && !p.passed ? errorCard(p.error) : null);
  for (const c of r.checks) row && box.append(row(c, c.label));
  for (const c of r.cases) {
    const label = c.label || c.call;
    const vis = c.visible !== false && showValues;
    const extra = vis && !c.passed && (c.got != null || c.expected != null) ? h('div', null,
      c.call ? h('div', { class: 'kv' }, h('b', null, 'call'), c.call) : null,
      c.expected != null ? h('div', { class: 'kv' }, h('b', null, 'expected'), c.expected) : null,
      c.got != null ? h('div', { class: 'kv' }, h('b', null, 'got'), c.got) : null) : null;
    box.append(row(c, (c.visible === false ? 'Hidden test: ' : '') + label, extra));
  }
  for (const t of r.tests) box.append(row(t, t.name));
  for (const m of r.mutants || []) box.append(row(m, (m.passed ? 'Caught: ' : 'Not caught: ') + m.label));
  return box;
}

function renderRunResult(r) {
  const box = h('div', { class: 'results', 'aria-live': 'polite' });
  if (r.stdout) box.append(h('div', { class: 'out' }, r.stdout));
  if (r.stderr) box.append(h('div', { class: 'out warn-out' }, r.stderr));
  if (!r.ok) box.append(errorCard(r.error));
  else if (!r.stdout) box.append(h('div', { class: 'small muted' }, 'Ran without errors. Nothing was printed.'));
  return box;
}

// ----------------------------------------------------------------- renderers by type
const RENDERERS = {
  flashcard(it, S, body) {
    const card = h('div', { class: 'card flash' }, h('div', null, it.front));
    const scratch = h('textarea', { class: 'plain mono', rows: 3, placeholder: 'Write it from memory first (optional)', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
    body.append(card, scratch);
    const reveal = h('button', { class: 'btn primary', onclick: () => {
      card.append(h('div', { class: 'back' }, it.back));
      reveal.remove();
      const rate = (k) => {
        const passed = k !== 'again';
        Player.finish(it, S, { passed, selfRate: k === 'hard' ? 'partly' : k === 'again' ? 'missed' : 'got' });
        Player.next();
      };
      Player.footer([h('button', { class: 'btn', onclick: () => rate('again') }, 'Again'), h('button', { class: 'btn', onclick: () => rate('hard') }, 'Hard'),
        h('button', { class: 'btn primary', onclick: () => rate('good') }, 'Good')]);
    } }, 'Reveal');
    Player.footer([h('span', { class: 'grow small muted' }, 'Recall first, then reveal.'), reveal]);
  },

  predict(it, S, body) {
    body.append(h('p', null, 'What does this print?'), h('pre', { class: 'code-block' }, it.code));
    const area = h('div');
    const decide = (choiceText, btn) => {
      const correct = choiceText.trim() === it.answer.trim();
      [...body.querySelectorAll('.choice')].forEach((b) => { b.disabled = true; if (b.dataset.val === it.answer) b.classList.add('correct'); });
      if (btn && !correct) btn.classList.add('wrong');
      area.append(h('div', { class: 'card ' + (correct ? 'ok' : 'bad') }, h('strong', null, correct ? 'Correct. ' : 'Not quite. '), it.explanation || ''));
      const runBtn = h('button', { class: 'btn small', onclick: async () => {
        runBtn.disabled = true;
        const r = await Runtime.run(it.code, '', it.packages || []);
        area.append(renderRunResult(r));
      } }, 'Run it to see');
      area.append(runBtn);
      completeItem(it, S, area, { passed: correct, explain: false });
    };
    if (it.choices) {
      const choices = seededShuffle(it.choices, it.id);
      choices.forEach((c) => {
        const b = h('button', { class: 'btn choice', 'data-val': c }, h('pre', null, c));
        b.addEventListener('click', () => decide(c, b));
        body.append(b);
      });
    } else {
      const inp = h('textarea', { class: 'plain mono', rows: 2, autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
      body.append(inp, h('button', { class: 'btn primary', onclick: () => decide(inp.value) }, 'Check'));
    }
    body.append(area);
    Player.footer([h('span', { class: 'grow small muted' }, 'Commit to an answer before running anything.')]);
  },

  worked(it, S, body) {
    if (it.show) body.append(h('div', { class: 'card' }, md(it.show)));
    const area = h('div');
    if (it.code) {
      const ed = Editor({ value: it.code, readOnly: true, label: 'Worked example (read-only)' });
      body.append(ed.el);
      if (it.runnable) {
        const runBtn = h('button', { class: 'btn', onclick: async () => {
          runBtn.disabled = true;
          runBtn.textContent = 'Running…';
          const r = await Runtime.run(it.code, '', it.packages || []);
          runBtn.disabled = false;
          runBtn.textContent = 'Run again';
          out.innerHTML = '';
          out.append(renderRunResult(r));
        } }, 'Run');
        const out = h('div');
        body.append(h('div', { class: 'row', style: 'margin-top:8px' }, runBtn), out, runtimeNotice());
      }
    }
    body.append(area);
    area.append(ExplainBack(it, S, it.explainPrompt, (rate) => {
      const { xp, advanced } = Player.finish(it, S, { passed: rate !== 'missed', selfRate: rate });
      area.append(h('div', { class: 'card ok' }, h('strong', null, `+${xp} XP`), advanced ? h('div', null, `${advanced.concept} → stage ${advanced.stage}`) : null,
        rate === 'missed' ? h('div', { class: 'small' }, 'It’ll come back tomorrow. Re-read the example, then try explaining again.') : null));
      Player.footer([h('span', { class: 'grow' }), nextButton()]);
    }));
    Player.footer([h('span', { class: 'grow small muted' }, 'Read the example, then explain it back.')]);
  },

  fillBlank(it, S, body) {
    body.append(it.prompt ? md(it.prompt) : null);
    const inputs = [];
    const parts = it.code.split(/(__\d+__)/);
    const pre = h('div', { class: 'fill' });
    for (const p of parts) {
      const m = p.match(/^__(\d+)__$/);
      if (m) {
        const n = Number(m[1]);
        const width = Math.max(4, ...it.answers[n - 1].map((a) => a.length)) + 1;
        const inp = h('input', { type: 'text', autocapitalize: 'off', autocorrect: 'off', autocomplete: 'off', spellcheck: 'false', 'aria-label': `Blank ${n}`, style: `width:${width}ch` });
        inp.addEventListener('input', () => { const v = normaliseSmart(inp.value); if (v !== inp.value) inp.value = v; });
        inputs[n - 1] = inp;
        pre.append(inp);
      } else pre.append(p);
    }
    body.append(pre, testsPreview(it), runtimeNotice());
    const hints = HintPanel(it, S, { solutionText: it.code.replace(/__(\d+)__/g, (_, n) => it.answers[Number(n) - 1][0]) });
    const out = h('div');
    body.append(hints, out);
    const assemble = () => it.code.replace(/__(\d+)__/g, (_, n) => inputs[Number(n) - 1].value);
    const check = async () => {
      if (inputs.some((i) => !i.value.trim())) { toast('Fill every blank first.'); return; }
      S.registerAttempt(assemble());
      out.innerHTML = '';
      out.append(h('div', { class: 'small muted' }, h('span', { class: 'spinner' }), ' Checking…'));
      let r;
      if (hasTests(it) && Runtime.state !== 'failed') r = await Runtime.test(assemble(), specOf(it));
      else {
        const ok = inputs.every((inp, i) => it.answers[i].some((a) => normCode(a) === normCode(inp.value)));
        r = { load: { ok: true }, checks: [], cases: [{ label: 'Matches an accepted answer', passed: ok, visible: true }], tests: [], passed: ok, summary: ok ? 'Correct' : 'Not yet' };
      }
      out.innerHTML = '';
      out.append(renderTestResult(r));
      if (r.passed) { checkBtn.disabled = true; inputs.forEach((i) => i.readOnly = true); completeItem(it, S, out); }
    };
    const checkBtn = h('button', { class: 'btn primary', onclick: check }, 'Check');
    Player.footer([h('span', { class: 'grow' }), checkBtn]);
  },

  parsons(it, S, body) {
    body.append(it.prompt ? md(it.prompt) : null);
    const isCode = /^\s*(def |[A-Z_]+ =|if |for |return |    )/.test(it.lines.join('\n'));
    let order = seededShuffle(it.lines.map((_, i) => i), it.id);
    if (order.slice(0, it.order.length).join() === it.order.join()) order = order.reverse();
    const pool = order.slice();
    const answer = [];
    const ansZone = h('div', { class: 'parsons-zone answer', 'aria-label': 'Your answer' });
    const poolZone = h('div', { class: 'parsons-zone', 'aria-label': 'Available lines' });
    const paint = () => {
      ansZone.innerHTML = '';
      poolZone.innerHTML = '';
      if (!answer.length) ansZone.append(h('div', { class: 'small muted', style: 'padding:8px' }, 'Tap lines below to add them here, in order.'));
      answer.forEach((i, pos) => ansZone.append(h('button', { class: 'pline' + (isCode ? '' : ' prose-line'), 'aria-label': `Remove: ${it.lines[i]}`, onclick: () => { answer.splice(pos, 1); pool.push(i); paint(); } },
        h('span', { class: 'idx' }, pos + 1), it.lines[i])));
      if (!pool.length) poolZone.append(h('div', { class: 'small muted', style: 'padding:8px' }, 'All lines used.'));
      pool.forEach((i, pos) => poolZone.append(h('button', { class: 'pline' + (isCode ? '' : ' prose-line'), 'aria-label': `Add: ${it.lines[i]}`, onclick: () => { pool.splice(pos, 1); answer.push(i); paint(); } }, it.lines[i])));
    };
    paint();
    body.append(h('h3', null, 'Your answer'), ansZone, h('h3', null, 'Lines'), poolZone, hasTests(it) && !S.tapOnly ? runtimeNotice() : null);
    const solution = it.order.map((i) => it.lines[i]).join('\n');
    const hints = (it.hints || []).length ? HintPanel(it, S, { solutionText: solution }) : null;
    const out = h('div');
    body.append(hints, out);
    const check = async () => {
      if (answer.length < 2) { toast('Add some lines first.'); return; }
      const code = answer.map((i) => it.lines[i]).join('\n') + '\n';
      if (S.registerAttempt) S.registerAttempt(code); else S.attempts++;
      out.innerHTML = '';
      let passed;
      if (hasTests(it) && (Runtime.ready || !S.tapOnly)) {
        out.append(h('div', { class: 'small muted' }, h('span', { class: 'spinner' }), ' Checking…'));
        const r = await Runtime.test(code, specOf(it));
        out.innerHTML = '';
        out.append(renderTestResult(r));
        passed = r.passed;
      } else {
        const firstWrong = it.order.findIndex((v, i) => answer[i] !== v);
        passed = firstWrong === -1 && answer.length === it.order.length;
        out.append(h('div', { class: 'card ' + (passed ? 'ok' : 'bad') }, passed ? '✓ Right order.'
          : answer.length !== it.order.length && firstWrong === -1 ? `The first ${answer.length} are right; something’s missing or extra.` : `Lines 1–${firstWrong} are right; line ${firstWrong + 1} isn’t.`));
      }
      if (passed) {
        checkBtn.disabled = true;
        if (isGate(it)) completeItem(it, S, out);
        else { out.append(h('p', null, it.explanation || '')); completeItem(it, S, out, { explain: false }); }
      }
    };
    const checkBtn = h('button', { class: 'btn primary', onclick: check }, 'Check');
    Player.footer([h('button', { class: 'btn ghost', onclick: () => { pool.push(...answer.splice(0)); paint(); } }, 'Reset'), h('span', { class: 'grow' }), checkBtn]);
  },

  spotBug(it, S, body) {
    body.append(md(it.prompt));
    const symptom = h('div');
    const showSymptom = async () => {
      if (it.symptom === 'none' || !it.symptom) return;
      if (S.tapOnly && !Runtime.ready) return; // commute: don't wait on Python
      symptom.innerHTML = '';
      symptom.append(h('div', { class: 'small muted' }, h('span', { class: 'spinner' }), ' Running the current code to show the symptom…'));
      const r = it.symptom === 'run' ? await Runtime.run(it.starter, it.setup || '', it.packages || []) : await Runtime.test(it.starter, specOf(it));
      symptom.innerHTML = '';
      symptom.append(h('h3', null, 'Symptom'), it.symptom === 'run' ? renderRunResult(r) : renderTestResult(r, { showValues: it.stage < 5 }));
    };
    body.append(symptom, it.symptom && it.symptom !== 'none' && !S.tapOnly ? runtimeNotice() : null);
    showSymptom();
    const lines = it.starter.replace(/\n$/, '').split('\n');
    const linesBox = h('div', { class: 'lines', role: 'group', 'aria-label': 'Tap the line with the bug' });
    const fixArea = h('div');
    let wrongTaps = 0;
    let found = false;
    const hints = S.diag || S.tapOnly ? null : HintPanel(it, S, { solutionText: it.solution });
    lines.forEach((text, i) => {
      const n = i + 1;
      const b = h('button', { type: 'button', 'aria-label': `Line ${n}: ${text.trim() || 'blank'}` }, h('span', { class: 'n' }, n), h('span', { class: 'c' }, text || ' '));
      b.addEventListener('click', () => {
        if (found) return;
        if (S.registerAttempt) S.registerAttempt('tap' + n); else S.attempts++;
        if (it.bugLines.includes(n)) {
          b.classList.add('picked-ok');
          found = true;
          if (S.diag || S.tapOnly) {
            fixArea.append(h('div', { class: 'card ok' }, `Yes: line ${n}. ${it.explanation || ''}`));
            completeItem(it, S, fixArea, { tapOnly: S.tapOnly });
            return;
          }
          fixArea.append(h('div', { class: 'card ok' }, `Yes, line ${n}${it.bugLines.length > 1 ? ' is one of them' : ''}. Now fix it.`));
          startFix();
        } else {
          b.classList.add('picked-bad');
          wrongTaps++;
          if (S.diag || (S.tapOnly && wrongTaps >= 2)) {
            found = true;
            fixArea.append(h('div', { class: 'card bad' }, `It was line ${it.bugLines.join(' or ')}. ${it.explanation || ''}`));
            completeItem(it, S, fixArea, { passed: false, tapOnly: S.tapOnly });
            return;
          }
          if (S.tapOnly) { toast('Not that one. One more try.'); return; }
          if (wrongTaps >= 3) {
            S.hintsOpened = Math.max(S.hintsOpened, 1);
            fixArea.append(h('div', { class: 'card warn' }, `It’s line ${it.bugLines.join(' or ')}. (Counts as a hint.) Now fix it.`));
            found = true;
            startFix();
          } else toast('Not that one. Read the symptom again.');
        }
      });
      linesBox.append(b);
    });
    body.append(h('h3', null, 'Tap the line with the bug'), linesBox, fixArea, hints);
    Player.footer([h('span', { class: 'grow small muted' }, it.stage === 5 ? 'Blank page: no hints.' : 'Find it before you fix it.')]);
    function startFix() {
      linesBox.remove();
      codeTask(it, S, fixArea, { starter: S.rec.draft || it.starter, hintsEl: hints });
    }
  },

  code(it, S, body) {
    body.append(md(it.prompt));
    if (it.financeNotes && it.stage < 5) body.append(h('div', { class: 'small muted' }, it.financeNotes.join(' ')));
    if (it.stage >= 4 && !S.diag) body.append(h('div', { class: 'row', style: 'margin:6px 0' }, h('button', { class: 'btn small ghost', onclick: () => exportBrief(it) }, '⤓ Export brief (.md)')));
    body.append(testsPreview(it), runtimeNotice());
    const area = h('div');
    body.append(area);
    const hints = S.diag ? null : HintPanel(it, S, { solutionText: it.solution });
    const startCoding = (starter) => codeTask(it, S, area, { starter, hintsEl: hints });
    const needsPlan = !S.diag && it.stage === 5 && !S.rec.draft;
    if (needsPlan) {
      area.append(PlanForm(it, S, {
        mini: true,
        onDone: (plan, stubs) => {
          area.innerHTML = '';
          startCoding(stubs || '');
        },
      }));
    } else startCoding(S.rec.draft || it.starter || '');
  },

  plan(it, S, body) {
    body.append(h('div', { class: 'card' }, h('strong', null, 'Brief'), md(it.brief)));
    body.append(PlanForm(it, S, {}));
  },
};

/** Shared editor + Run/Check loop for code and spotBug items. */
function codeTask(it, S, area, { starter, hintsEl }) {
  const out = h('div');
  let lastResult = null;
  const ed = Editor({
    value: starter, label: `Code for ${itemTitle(it)}`,
    onChange: debounce((v) => { if (!S.done) { S.rec.draft = v; Store.save(); } }, 600),
    onRun: () => check(),
  });
  S.saveDraft = () => { if (!S.done) { S.rec.draft = ed.value; Store.saveNow(); } };
  const runBtn = h('button', { class: 'btn', onclick: () => run() }, '▶ Run');
  const checkBtn = h('button', { class: 'btn primary', onclick: () => check() }, '✓ Check');
  const stopBtn = h('button', { class: 'btn danger', hidden: true, onclick: () => { Runtime.restart(); } }, '■ Stop');
  area.append(ed.el, h('div', { class: 'small muted', style: 'margin-top:4px' }, 'Run executes your file. Check runs the tests.'), out, hintsEl);
  const busy = (on) => {
    runBtn.disabled = checkBtn.disabled = on || S.done;
    stopBtn.hidden = !on || Runtime.mode !== 'worker';
  };
  async function run() {
    busy(true);
    out.innerHTML = '';
    out.append(h('div', { class: 'small muted' }, h('span', { class: 'spinner' }), ' Running…'));
    const r = await Runtime.run(ed.value, it.setup || '', it.packages || []);
    busy(false);
    out.innerHTML = '';
    out.append(h('h3', null, 'Output'), renderRunResult(r), it.setup ? h('p', { class: 'small muted' }, 'Provided code (classes, sample data) is loaded first.') : null);
  }
  async function check() {
    if (S.done) return;
    if (!ed.value.trim()) { toast('Write something first.'); return; }
    const meaningful = it.starter && normCode(ed.value) === normCode(it.starter) ? false : true;
    if (meaningful && S.registerAttempt) S.registerAttempt(ed.value);
    else if (!S.registerAttempt) S.attempts++;
    busy(true);
    out.innerHTML = '';
    out.append(h('div', { class: 'small muted' }, h('span', { class: 'spinner' }), ' Running tests…'));
    const r = await Runtime.test(ed.value, specOf(it));
    lastResult = r;
    busy(false);
    out.innerHTML = '';
    out.append(renderTestResult(r));
    if (!meaningful && !r.passed) out.append(h('div', { class: 'small muted' }, 'That’s the starter code unchanged, so it doesn’t count as an attempt.'));
    if (r.passed) {
      busy(true);
      ed.ta.readOnly = true;
      Keybar.hide();
      completeItem(it, S, out, { explain: !S.diag });
    } else if (S.diag && S.attempts >= 3) {
      out.append(h('div', { class: 'card' }, 'Three tries is the limit in the placement check. Moving on is fine: this sets where the topic starts.'));
      completeItem(it, S, out, { passed: false });
    }
  }
  Player.editorActions = { run, check };
  const skip = S.diag ? h('button', { class: 'btn ghost', onclick: () => { if (!S.done) { completeItem(it, S, out, { passed: false }); } } }, 'Skip') : null;
  Player.footer([skip, stopBtn, h('span', { class: 'grow' }), runBtn, checkBtn]);
  return { ed, get result() { return lastResult; } };
}

/** Plan form: inputs, outputs, steps, signatures. Used by plan items and (mini) before blank-page code. */
function PlanForm(it, S, { mini = false, onDone } = {}) {
  const box = h('div');
  const saved = S.rec.plan || {};
  const pre = it.prefill || {};
  const fields = [
    ['inputs', 'Inputs', 'names, types, units'],
    ['outputs', 'Outputs', 'type and meaning'],
    ['steps', 'Steps', 'plain English, one per line'],
    ['signatures', 'Signatures', 'one def per line, with type hints'],
  ];
  const tas = {};
  for (const [k, label, help] of fields) {
    const mono = k === 'signatures';
    const ta = h('textarea', { class: 'plain' + (mono ? ' mono' : ''), rows: k === 'steps' ? 5 : 3, 'aria-label': label,
      autocapitalize: mono ? 'off' : 'sentences', autocorrect: mono ? 'off' : 'on', spellcheck: mono ? 'false' : 'true',
      placeholder: mono ? 'def name(arg: type) -> type' : '' });
    ta.value = saved[k] != null ? saved[k] : (pre[k] || '');
    if (mono) ta.addEventListener('input', () => { const v = normaliseSmart(ta.value); if (v !== ta.value) { const p = ta.selectionStart; ta.value = v; ta.setSelectionRange(p, p); } });
    ta.addEventListener('input', debounce(() => { S.rec.plan = collect(); Store.save(); }, 600));
    tas[k] = autoGrow(ta);
    box.append(h('label', { class: 'field' }, label, ' ', h('small', null, help)), ta);
  }
  const collect = () => Object.fromEntries(fields.map(([k]) => [k, tas[k].value]));
  const fb = h('div', { 'aria-live': 'polite' });
  const hints = mini || S.diag ? null : HintPanel(it, S, {});
  box.append(fb, hints);
  let submitted = false;
  let stubs = '';

  async function check() {
    const plan = collect();
    S.rec.plan = plan;
    Store.save();
    const problems = [];
    if (plan.inputs.trim().length < 5) problems.push('Inputs: name each input with its type (and units).');
    if (plan.outputs.trim().length < 3) problems.push('Outputs: say what comes back and its type.');
    const stepLines = plan.steps.split('\n').filter((l) => l.replace(/^\s*\d+[.)]\s*/, '').trim().length > 3);
    if (stepLines.length < 2) problems.push('Steps: at least two plain-English steps.');
    // Signatures: Python ast check if available, regex otherwise.
    let sigRows = [];
    if (Runtime.ready) { try { sigRows = await Runtime.sigs(plan.signatures); } catch (e) { sigRows = []; } }
    if (!sigRows.length) {
      sigRows = plan.signatures.split('\n').filter((l) => l.trim()).map((l) => {
        const ok = /^def\s+[a-z_][a-z0-9_]*\s*\(.*\)\s*->\s*.+$/.test(l.trim().replace(/:$/, ''));
        return { line: l.trim(), ok, problems: ok ? [] : ['Needs the shape def name(arg: type) -> type'], stub: ok ? l.trim().replace(/:$/, '') + ':\n    """TODO"""\n    ...\n' : '' };
      });
    }
    if (!sigRows.length) problems.push('Signatures: at least one def line.');
    const sigOK = sigRows.length && sigRows.every((r) => r.ok);
    stubs = sigRows.filter((r) => r.stub).map((r) => r.stub).join('\n\n');
    const lower = Object.values(plan).join('\n').toLowerCase();
    const spotted = (it.rubric || []).map((r) => ({ r, hit: r.any.some((k) => lower.includes(k.toLowerCase())) }));
    const structural = !problems.length && sigOK;
    if (S.registerAttempt) S.registerAttempt(JSON.stringify(plan)); else S.attempts++;
    submitted = true;
    fb.innerHTML = '';
    fb.append(h('div', { class: 'card ' + (structural ? 'ok' : 'bad') },
      h('strong', null, structural ? '✓ Plan structure is complete.' : 'Not complete yet:'),
      problems.length ? h('ul', null, problems.map((p) => h('li', null, p))) : null,
      sigRows.length ? h('div', { style: 'margin-top:6px' }, sigRows.map((r) => h('div', { class: 'small' },
        (r.ok ? '✓ ' : '✗ '), h('code', { class: 'inline-code' }, r.line), r.problems.length ? ' — ' + r.problems.join('; ') : ''))) : null));
    if (spotted.length) {
      fb.append(h('div', { class: 'card' }, h('strong', null, 'Did your plan cover these?'),
        h('div', { class: 'small muted' }, 'Keyword spotting only: a ? means “not spotted”, not “wrong”.'),
        h('ul', { class: 'list' }, spotted.map(({ r, hit }) => h('li', { style: 'padding:6px 0' }, (hit ? '✓ ' : '? ') + r.text)))));
    }
    actions();
    return structural;
  }

  function actions() {
    const nodes = [h('span', { class: 'grow' }), h('button', { class: 'btn' + (submitted ? '' : ' primary'), onclick: check }, submitted ? 'Re-check plan' : 'Check plan')];
    if (mini) {
      nodes.push(h('button', { class: 'btn primary', disabled: !submitted, onclick: async () => {
        const ok = await check();
        if (!ok) { toast('Finish the plan structure first: it becomes your starter code.'); return; }
        onDone(collect(), stubs);
      } }, 'Start coding →'));
    } else if (!S.diag) {
      nodes.push(h('button', { class: 'btn primary', disabled: !submitted, onclick: compare }, 'Compare with model'));
    } else {
      nodes.push(h('button', { class: 'btn primary', disabled: !submitted, onclick: async () => {
        const ok = await check();
        completeItem(it, S, fb, { passed: ok });
      } }, 'Submit'));
    }
    Player.footer(nodes);
  }

  async function compare() {
    const structural = await check();
    Object.values(tas).forEach((t) => { t.readOnly = true; });
    const mp = it.modelPlan;
    const ratings = {};
    const doneBtn = h('button', { class: 'btn primary', disabled: true }, 'Done');
    const rateRows = (it.rubric || []).map((r) => {
      const row = h('div', { class: 'rate' });
      [['yes', 'Yes'], ['partly', 'Partly'], ['no', 'No']].forEach(([k, label]) => {
        const b = h('button', { class: 'btn small', 'aria-pressed': 'false', onclick: () => {
          ratings[r.id] = k;
          [...row.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          doneBtn.disabled = Object.keys(ratings).length < it.rubric.length;
        } }, label);
        row.append(b);
      });
      return h('div', { style: 'margin:10px 0' }, h('div', { class: 'small' }, r.text), row);
    });
    fb.append(h('div', { class: 'card accent' }, h('h3', null, 'Model plan'),
      ['inputs', 'outputs', 'steps', 'signatures'].map((k) => h('div', null, h('div', { class: 'small muted', style: 'margin-top:6px;text-transform:capitalize' }, k), h('pre', { class: 'code-block wrap' }, mp[k]))),
      h('p', { class: 'small' }, it.explanation || ''),
      (it.financeNotes || []).length ? h('div', { class: 'small' }, h('strong', null, 'Convention check: '), it.financeNotes.join(' ')) : null,
      h('h3', null, 'Self-check against the rubric'), rateRows));
    doneBtn.addEventListener('click', () => {
      const anyNo = Object.values(ratings).includes('no');
      const anyPartly = Object.values(ratings).includes('partly');
      const passed = structural && !anyNo;
      doneBtn.disabled = true;
      const { xp, advanced } = Player.finish(it, S, { passed, selfRate: anyNo ? 'missed' : anyPartly ? 'partly' : 'got' });
      fb.append(h('div', { class: 'card ' + (passed ? 'ok' : 'warn') },
        passed ? h('strong', null, `+${xp} XP`) : h('strong', null, structural ? 'You marked a rubric point as missed, so this comes back soon.' : 'The plan structure wasn’t complete, so this comes back soon.'),
        advanced ? h('div', null, `${advanced.concept} → ${advanced.stage >= 6 ? 'mastered' : 'stage ' + advanced.stage}`) : null,
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'btn small', onclick: () => openSandboxWith(planToCode(it, collect(), stubs)) }, 'Build it in the sandbox'),
          h('button', { class: 'btn small ghost', onclick: () => exportBrief(it, collect()) }, '⤓ Export brief'))));
      Player.footer([h('span', { class: 'grow' }), nextButton()]);
    });
    Player.footer([h('span', { class: 'grow' }), doneBtn]);
    fb.lastChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  actions();
  return box;
}

function planToCode(it, plan, stubs) {
  const steps = plan.steps.split('\n').filter((l) => l.trim()).map((l) => '# ' + l.trim()).join('\n');
  return `"""${itemTitle(it)}\n\nInputs:\n${plan.inputs}\n\nOutputs:\n${plan.outputs}\n"""\n\n# Steps\n${steps}\n\n${stubs || ''}`;
}

function exportBrief(it, plan) {
  const lines = [`# ${itemTitle(it)}`, '', `Device: ${it.device} · Stage ${it.stage} (${STAGE_NAMES[it.stage]})`, ''];
  lines.push('## Brief', '', it.prompt || it.brief || '', '');
  if (it.setup) lines.push('## Test data', '', '```python', it.setup.trim(), '```', '');
  lines.push('## Plan first (before any code)', '');
  if (plan) {
    lines.push('**Inputs**', '', plan.inputs, '', '**Outputs**', '', plan.outputs, '', '**Steps**', '', plan.steps, '', '**Signatures**', '', '```python', plan.signatures, '```', '');
  } else lines.push('- Inputs (types, units):', '- Outputs (type):', '- Steps in plain English:', '- Function signatures with type hints:', '');
  const vis = (it.cases || []).filter((c) => c.visible !== false && (c.kind || 'value') !== 'stdout' && c.kind !== 'silent' && c.kind !== 'stdoutHas');
  if (vis.length) {
    lines.push('## Starter tests (`tests/test_solution.py`)', '', '```python', 'import pytest', '', 'from solution import *  # adjust to your module name', '');
    if (it.setup) lines.push(it.setup.trim(), '');
    vis.forEach((c, i) => {
      const name = 'test_' + ((c.label || `case_${i + 1}`).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || `case_${i + 1}`);
      lines.push(`def ${name}():`);
      if (c.kind === 'raises') {
        lines.push(`    with pytest.raises(${c.raises}${c.match ? `, match=${JSON.stringify(c.match)}` : ''}):`, `        ${c.call}`, '');
      } else if (c.cmp === 'exact') lines.push(`    assert ${c.call} == ${c.expect}`, '');
      else lines.push(`    assert ${c.call} == pytest.approx(${c.expect})`, '');
    });
    lines.push('```', '');
  }
  const hidden = (it.cases || []).length - vis.length;
  if (hidden > 0) lines.push(`The app has ${hidden} more hidden test${hidden > 1 ? 's' : ''}: paste your finished code back into the app and press Check.`, '');
  lines.push('## Build checklist', '',
    '- [ ] Plan written before any code',

    '- [ ] Simplest version that passes one test',

    '- [ ] `uv run ruff check .` clean',

    '- Is calculation separate from printing?',
    '- Did I write the tests before or after the code? (Before is better.)', '');

function challengeMarkdown(ch, st) {

  for (const k of ['inputs', 'outputs', 'steps', 'signatures']) lines.push(`**${k[0].toUpperCase() + k.slice(1)}**`, '', (st.plan[k] || '_(write before coding)_'), '');

  return lines.join('\n');
}

const SAMPLE_SNIPPET = `import random


def sample_returns(tickers: list[str], months: int = 12, seed: int = 42) -> dict[str, list[float]]:
    """Made-up monthly returns (decimals). Same seed, same numbers."""
    rng = random.Random(seed)
    params = {"EQ": (0.007, 0.045), "GOV": (0.002, 0.015), "IG": (0.003, 0.020), "HY": (0.005, 0.030)}
    out = {}
    for t in tickers:
        mu, sigma = params.get(t, (0.004, 0.025))
        out[t] = [round(rng.gauss(mu, sigma), 4) for _ in range(months)]
    return out


data = sample_returns(["EQ", "GOV", "IG"])
for ticker, rs in data.items():
    print(f"{ticker:<4} first 3 months: {rs[:3]}")
`;

    st.weakest.map((s) => h('div', { style: 'padding:6px 0' }, h('strong', null, s.skill.name), h('div', { class: 'small muted' },
      s.avgHint == null ? 'No recent attempts' : `Avg hint level ${s.avgHint.toFixed(1)} (0 = none, 4 = solution / fail) over ${s.n} recent · ${s.fails} misses`)))));
  main.append(h('h2', null, 'Topic mastery'));
  const card = h('div', { class: 'card' });
  for (const c of CONTENT.concepts) {
    const s = stageOf(c.id);
    card.append(h('div', { style: 'padding:6px 0' }, h('div', { class: 'row spread' }, h('span', null, c.name), stageDots(s)),
      h('div', { class: 'bar', style: 'margin-top:4px' }, h('i', { style: `width:${Math.min(100, ((s - 1) / 5) * 100)}%` }))));
  }
  main.append(card);
};

Views.settings = () => {
  setTopbar({ title: 'Settings', back: () => go(lastMainRoute || 'today') });
  const main = $('#main');
  main.innerHTML = '';
  const s = Store.d.settings;
  const seg = (key, options, onChange) => {
    const row = h('div', { class: 'rate' });
    options.forEach(([v, label]) => row.append(h('button', { class: 'btn small', 'aria-pressed': String(s[key] === v), onclick: () => {
      s[key] = v; Store.saveNow(); applySettings(); if (onChange) onChange(); Views.settings();
    } }, label)));
    return row;
  };
  main.append(h('div', { class: 'card' },
    h('h3', null, 'Appearance'), h('div', { class: 'small muted' }, 'Theme'), seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]),
    h('div', { class: 'small muted', style: 'margin-top:10px' }, 'Code size'), seg('codeSize', [[16, '16'], [17, '17'], [18, '18'], [20, '20']]),
    h('div', { class: 'small muted', style: 'margin-top:10px' }, `Device (auto detects: ${deviceMode()})`), seg('device', [['auto', 'Auto'], ['phone', 'Phone'], ['laptop', 'Laptop']])));

  const fileIn = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
  fileIn.addEventListener('change', async () => { const f = fileIn.files[0]; if (f) importProgress(await f.text()); });
  const paste = h('textarea', { class: 'plain mono', rows: 3, placeholder: 'Or paste a backup here', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
  main.append(h('div', { class: 'card' },
    h('h3', null, 'Backup'),
    h('p', { class: 'small' }, `Progress is stored only in this browser${Store.ok ? '' : ' (storage is currently failing!)'}. On iPhone, a Home Screen app and a Safari tab keep separate progress: pick one. Last backup: ${Store.d.lastBackup ? new Date(Store.d.lastBackup).toLocaleDateString('en-GB') : 'never'}.`),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: exportProgress }, '⤓ Download backup'),
      navigator.share && !IN_FRAME ? h('button', { class: 'btn', onclick: shareProgress }, 'Share…') : null,
      h('button', { class: 'btn', onclick: async () => { try { await navigator.clipboard.writeText(JSON.stringify(Store.d)); Store.d.lastBackup = Date.now(); Store.saveNow(); toast('Copied.'); } catch (e) { toast('Clipboard blocked. Use Download.'); } } }, 'Copy')),
    h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn', onclick: () => fileIn.click() }, 'Import file…'), fileIn),
    paste, h('button', { class: 'btn small', style: 'margin-top:6px', onclick: () => importProgress(paste.value) }, 'Import pasted text')));

  const stOut = h('div');
  main.append(h('div', { class: 'card' },
    h('h3', null, 'Python'),
    h('p', { class: 'small' }, `Pyodide ${PYODIDE_VERSION}, Python ${Runtime.version || '(not loaded)'} · ${Runtime.mode === 'worker' ? 'background worker' : Runtime.mode === 'main' ? 'main thread (no Stop button)' : '—'} · ${Runtime.state}`),
    Runtime.base ? h('p', { class: 'small muted' }, `Loaded from ${Runtime.base.includes('jsdelivr') ? 'the jsDelivr CDN' : 'files published with this page'}. Packages loaded: ${[...Runtime.loaded].join(', ') || 'standard library only'}.`) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => Runtime.restart().then(() => Views.settings()) }, 'Restart Python'),
      h('button', { class: 'btn', onclick: async () => {
        stOut.innerHTML = '';
        stOut.append(h('p', { class: 'small' }, h('span', { class: 'spinner' }), ' Running every reference solution against its tests…'));
        try {
          const rep = await Runtime.selftest([...ITEMS.values()]);
          const bad = rep.filter((r) => !r.ok);
          stOut.innerHTML = '';
          stOut.append(h('div', { class: 'card ' + (bad.length ? 'bad' : 'ok') }, `${rep.length - bad.length}/${rep.length} items pass their own tests.`,
            bad.length ? h('ul', null, bad.map((b) => h('li', null, `${b.id}: ${b.problems.join('; ')}`))) : null));
        } catch (e) { stOut.innerHTML = ''; stOut.append(h('div', { class: 'card bad' }, String(e.message || e))); }
      } }, 'Run content self-test')), stOut));

  main.append(h('div', { class: 'card' },
    h('h3', null, 'About & limitations'),
    md([
      `**Blank Page ${APP_VERSION}** · content ${CONTENT.meta.contentVersion}.`,
      '',
      `- Python runs in your browser via Pyodide ${PYODIDE_VERSION} (Python 3.14). Lessons stick to 3.12-compatible syntax so code runs on your laptop too.`,
      '- No real file system: files written during a run live in memory and vanish on reload.',
      '- No threads or multiprocessing; limited networking (no sockets). Everything here is generated in the browser.',
      '- numpy 2.4.6 and pandas 3.0.2 load on first use (20–40 s the first time on a phone, then cached). matplotlib isn’t bundled: charts are laptop tasks.',
      '- Commute sessions are tap-only and work even if Python hasn’t loaded.',
      '- Code runs noticeably slower than desktop Python. Infinite loops are stopped after 10 s.',
      '- Hidden tests are hidden from the screen, not from view-source. Honour system.',
      '- Plan feedback is structural checks plus keyword spotting plus your own rubric rating: no AI grading, on purpose.',
    ].join('\n'))));

  main.append(h('div', { class: 'card bad' }, h('h3', null, 'Reset'),
    h('p', { class: 'small' }, 'Deletes all progress in this browser. Export first.'),
    h('button', { class: 'btn danger', onclick: async () => {
      if (!(await ask({ title: 'Delete all progress?', body: 'Everything in this browser goes: stages, history, snippets. Export a backup first.', okLabel: 'Delete everything', danger: true }))) return;
      Store.d = Store.fresh(); Store.saveNow(); applySettings(); go('today');
    } }, 'Reset progress')));
};

function backupName() { return `blank-page-progress-${today()}.json`; }
function exportProgress() {
  offerText(backupName(), JSON.stringify(Store.d), { title: 'Progress backup', mime: 'application/json' });
  Store.d.lastBackup = Date.now();
  Store.saveNow();
}
async function shareProgress() {
  try {
    const file = new File([JSON.stringify(Store.d)], backupName(), { type: 'application/json' });
    if (navigator.canShare && !navigator.canShare({ files: [file] })) throw new Error('no file share');
    await navigator.share({ files: [file], title: 'Blank Page backup' });
    Store.d.lastBackup = Date.now();
    Store.saveNow();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    exportProgress();
  }
}
async function importProgress(text) {
  let d;
  try { d = Store.migrate(JSON.parse(String(text || '').trim())); } catch (e) { d = null; }
  if (!d) { toast('That isn’t a valid Blank Page backup.'); return; }
  if (!(await ask({ title: 'Replace progress?', body: 'Your current progress in this browser will be replaced by the backup.', okLabel: 'Replace', danger: true }))) return;
  Store.d = d;
  Store.saveNow();
  applySettings();
  toast('Backup restored.');
  go('today');
}

// ----------------------------------------------------------------- diagnostic
function startDiagnostic() {
  Player.open({ title: CONTENT.diagnostic.title, mode: 'diagnostic', steps: CONTENT.diagnostic.items.map((it) => ({ kind: 'item', ref: it.id })) });
}
function renderDiagnosticResults(ctx) {
  const main = $('#main');
  const placement = {};
  for (const r of ctx.results) {
    const it = ITEMS.get(r.id);
    if (!r.passed) continue;
    for (const p of it.places || []) placement[p.concept] = Math.max(placement[p.concept] || 1, Math.min(4, p.stage));
  }
  const d = Store.d;
  for (const [cid, stage] of Object.entries(placement)) {
    const c = d.concepts[cid] || (d.concepts[cid] = { stage: 1 });
    c.stage = Math.max(c.stage, stage);
  }
  d.diagnostic = { at: Date.now(), placement, score: `${ctx.results.filter((r) => r.passed).length}/${ctx.results.length}` };
  Store.saveNow();
  main.append(h('div', { class: 'card ok' }, h('h2', null, 'Placement done'), h('p', null, `${d.diagnostic.score} correct.`),
    h('ul', null, CONTENT.concepts.map((c) => h('li', null, `${c.name}: start at stage ${stageOf(c.id)} (${STAGE_NAMES[stageOf(c.id)]})`))),
    h('p', { class: 'small muted' }, 'Earlier stages stay open as practice. Stage 5 (blank page) is never skipped: you earn it.')));
  Player.footer([h('span', { class: 'grow' }), h('button', { class: 'btn primary', onclick: () => Player.close() }, 'Go to Today')]);
}

// ===================================================================== router & boot
function applySettings() {
  const s = Store.d.settings;
  const root = document.documentElement;
  if (s.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme);
  root.style.setProperty('--code-size', `${Math.max(16, Number(s.codeSize) || 16)}px`);
}
// In-page router. The hosted viewer only passes plain #anchors in links, so state lives here;
// the hash is mirrored when the browser allows it, so the back gesture still works.
let currentRoute = 'today';
let lastMainRoute = 'today';
function parseHash() {
  const m = (location.hash || '').match(/^#\/?([\w/-]+)$/);
  return m ? m[1] : 'today';
}
function go(r, { replace = false } = {}) {
  currentRoute = r;
  try { history[replace ? 'replaceState' : 'pushState'](null, '', '#/' + r); } catch (e) { /* sandboxed: fine */ }
  route();
}
function route() {
  const [view, arg] = currentRoute.split('/');
  if (view === 'play') {
    if (!Player.ctx) go('today', { replace: true });
    return;
  }
  if (Player.ctx) { Player.cleanup(); Player.ctx = null; document.body.classList.remove('playing'); }
  if (view !== 'settings') lastMainRoute = currentRoute;
  Keybar.hide();
  Player.editorActions = null;
  document.querySelectorAll('#tabbar a').forEach((a) => {
    if (a.dataset.tab === view || (view === 'lesson' && a.dataset.tab === 'learn')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const fn = view === 'lesson' ? () => Views.lesson(arg) : view === 'challenge' ? () => Views.challenge(arg) : Views[view] || Views.today;
  fn();
  window.scrollTo(0, 0);
}

function boot() {
  Store.load();
  if (!Store.ok) toast('Storage is blocked in this browser mode: progress won’t be saved. Export manually.', 6000);
  applySettings();
  Keybar.init();
  window.addEventListener('popstate', () => { currentRoute = parseHash(); route(); });
  // Every in-app link ("#/learn", "#/lesson/m1l2") goes through the router.
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(2));
  });
  currentRoute = parseHash() === 'play' ? 'today' : parseHash();
  window.addEventListener('pagehide', () => { if (Player.S && Player.S.saveDraft) Player.S.saveDraft(); Store.saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.saveNow(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  route();
  Runtime.start();
}
window.BlankPage = { Store, Runtime, ITEMS, Player, buildSession, computeStats }; // handy for debugging
boot();

</script>
